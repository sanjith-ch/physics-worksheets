{h:'What a wave is',b:['A travelling wave transfers energy (and information) without transferring matter. Particles oscillate about fixed positions.','The energy carried is proportional to amplitude²: doubling the amplitude quadruples the energy.']},
{h:'Transverse and longitudinal',b:['**Transverse:** oscillations perpendicular to the direction of energy transfer. Crests and troughs. Examples: light, waves on a string.','**Longitudinal:** oscillations parallel to the direction of energy transfer. Compressions (high pressure) and rarefactions (low pressure). Example: sound.']},
{h:'Wave quantities',b:['Wavelength λ: distance between neighbouring points in phase. Amplitude: maximum displacement from equilibrium.','Period T and frequency f = 1/T.','Wave speed v = fλ = λ/T.','Displacement–distance graph gives λ. Displacement–time graph gives T. Learn which is which.'],t:'To find which way a particle moves, shift the wave a little in its direction of travel and see whether that point goes up or down.'},
{h:'Sound',b:['Sound is a longitudinal mechanical wave. It needs a medium and cannot travel through a vacuum.','It travels fastest in solids and slowest in gases.','At the centre of a compression or rarefaction, the particle displacement is zero.']},
{h:'Electromagnetic waves',b:['Oscillating electric and magnetic fields, perpendicular to each other and to the direction of travel, so always transverse.','Need no medium. All travel at c = 3.00 × 10^{8} m s^{−1} in a vacuum.','In order of increasing frequency (decreasing wavelength): radio, microwave, infrared, visible (about 700 nm red to 400 nm violet), ultraviolet, X-ray, gamma.']}
],
C3:[
{h:'Wavefronts and rays',b:['A wavefront joins points that are in phase, for example all the crests.','A ray shows the direction of energy transfer and is perpendicular to the wavefronts.']},
{h:'Reflection and refraction',b:['Reflection: angle of incidence = angle of reflection, both measured from the normal.','Refraction: the wave changes speed at a boundary and changes direction unless it hits along the normal.','Frequency never changes at a boundary. Speed and wavelength change together (v = fλ).','Entering a slower medium the ray bends towards the normal. Entering a faster medium it bends away.','Snell\'s law: n_{1} sin θ_{1} = n_{2} sin θ_{2}, or sin θ_{1}/sin θ_{2} = v_{1}/v_{2}. Refractive index n = c/v.']},
{h:'Critical angle and total internal reflection',b:['Only possible going from a higher to a lower refractive index (slower to faster medium).','At the critical angle the refracted ray travels along the boundary: sin θ_{c} = n_{2}/n_{1}.','For angles of incidence above θ_{c}, all the light is reflected. Used in optical fibres.']},
{h:'Diffraction',b:['Waves spread out after passing through a gap or around an obstacle.','The effect is greatest when the gap is about the same size as the wavelength.','Diffraction does not change the speed, frequency or wavelength.']},
{h:'Superposition and interference',b:['When waves overlap, the resultant displacement is the sum of the individual displacements.','Coherent sources have a constant phase difference (and the same frequency). They are needed for a stable pattern.','For sources in phase: constructive where the path difference = nλ, destructive where the path difference = (n + ½)λ.','Phase difference = (path difference ÷ λ) × 2π.']},
{h:'Young\'s double slit',b:['Light diffracts at each slit and the two beams overlap, giving equally spaced bright and dark fringes.','Fringe spacing s = λD/d, where D is the slit–screen distance and d the slit separation.','Using white light gives a white central fringe and coloured fringes, with red furthest out.']},
{h:'Single slit diffraction (HL)',b:['A single slit gives a wide, bright central maximum (twice the width of the others) and much dimmer side maxima.','First minimum at θ = λ/b, where b is the slit width. At this angle light from the two halves of the slit cancels.','In a real double slit pattern, the single slit pattern is an envelope over the double slit fringes. Fringes that land on an envelope minimum go missing.']},
{h:'Diffraction gratings (HL)',b:['Many equally spaced slits give very sharp, bright principal maxima at angles where nλ = d sin θ.','d = 1/(lines per metre). The highest order you can see has sin θ ≤ 1.','More slits make the maxima sharper and brighter at the same angles. Gratings are used to split light into spectra.']}
],
C4:[
{h:'Formation of standing waves',b:['Two waves of the same frequency, wavelength and similar amplitude travelling in opposite directions superpose. Usually one is a reflection of the other.','The pattern does not move along, and no energy is transferred along the wave.']},
{h:'Nodes and antinodes',b:['Node: zero displacement at all times. Antinode: maximum amplitude.','Adjacent nodes (or adjacent antinodes) are λ/2 apart. A node and the next antinode are λ/4 apart.','All points between two adjacent nodes oscillate in phase. Points in neighbouring loops are in antiphase.','Amplitude varies with position, unlike a travelling wave where every point has the same amplitude.']},
{h:'Strings',b:['Both fixed ends are nodes.','Harmonic n: λ_{n} = 2L/n and f_{n} = nv/2L = n f_{1}. All harmonics are possible.']},
{h:'Pipes',b:['Open end: displacement antinode. Closed end: displacement node.','**Open at both ends:** λ_{n} = 2L/n, all harmonics, f_{n} = n f_{1}.','**Closed at one end:** λ_{1} = 4L, only odd harmonics (f, 3f, 5f, …).','A closed pipe has half the fundamental frequency of an open pipe of the same length.'],t:'Sketch the pipe first and count quarter wavelengths. It is quicker and safer than memorising formulas.'},
{h:'Resonance',b:['Every system has a natural frequency. When the driving frequency equals the natural frequency, the amplitude is maximum. This is resonance.','At resonance energy is transferred most efficiently from the driver to the system.','Useful: microwave ovens, musical instruments, quartz clocks. Harmful: bridges and buildings shaking, engine vibrations.']},
{h:'Damping',b:['Damping is energy loss to resistive forces, which makes the amplitude decay.','**Light:** oscillations slowly die away. **Critical:** returns to equilibrium fastest with no oscillation. **Heavy:** returns slowly with no oscillation.','More damping lowers and broadens the resonance peak and shifts it to a slightly lower frequency.']}
],
C5:[
{h:'The Doppler effect',b:['A change in observed frequency and wavelength when the source and observer move relative to each other.','Approaching: higher observed frequency (shorter wavelength). Receding: lower frequency (longer wavelength).','It happens for all waves: sound, water and electromagnetic.']},
{h:'Wavefront pictures',b:['**Moving source:** wavefronts are bunched up in front and spread out behind, so the wavelength in front is shorter.','**Moving observer:** the wavefronts are unchanged, but the observer meets them more (or less) often.','Doppler changes the frequency heard, not the speed of the wave.']},
{h:'Light: red shift and blue shift',b:['Source moving away: red shift, observed wavelength longer. Moving closer: blue shift.','For v much less than c: Δf/f = Δλ/λ ≈ v/c.','Shifts in the spectral lines of galaxies show they are receding, which is evidence for the expanding universe.']},
{h:'Sound and mechanical waves (HL)',b:['Moving source: f′ = f v/(v ± u_{s}). Use − when the source approaches, + when it recedes.','Moving observer: f′ = f (v ± u_{o})/v. Use + when the observer approaches, − when it recedes.','v is the wave speed in the medium. Source motion changes the wavelength. Observer motion does not.'],t:'Check your sign by asking whether the frequency should go up (approaching) or down (receding).'}
],
D1:[
{h:'Newton\'s law of gravitation',b:['Every pair of point masses attracts with F = GMm/r², along the line joining their centres.','Spheres can be treated as point masses at their centres. G = 6.67 × 10^{−11} N m² kg^{−2}.','Gravity is always attractive and follows an inverse square law.']},
{h:'Gravitational field strength',b:['g = F/m, the force per unit mass. For a point or spherical mass, g = GM/r².','Field lines point towards the mass. Closer lines mean a stronger field. Lines never cross.','Near Earth\'s surface the field is uniform: parallel, equally spaced lines.']},
{h:'Kepler\'s laws and orbits',b:['**1st:** planets move in ellipses with the Sun at one focus.','**2nd:** the line from the Sun to a planet sweeps out equal areas in equal times, so a planet moves fastest when closest to the Sun.','**3rd:** T² ∝ r³ for everything orbiting the same central body.','For a circular orbit, gravity provides the centripetal force: GMm/r² = mv²/r = m(4π²/T²)r, giving T² = (4π²/GM)r³.']},
{h:'Potential and potential energy (HL)',b:['Gravitational potential energy E_{p} = −GMm/r: the work done to bring the masses together from infinity. Zero at infinity, negative everywhere else.','Gravitational potential V_{g} = −GM/r: work done per unit mass bringing a mass from infinity. It is a scalar, so potentials from several masses simply add.','Work done moving a mass: W = mΔV_{g}.','Field strength is the negative potential gradient: g = −ΔV_{g}/Δr.']},
{h:'Equipotentials (HL)',b:['Equipotential surfaces join points of equal potential. They are always perpendicular to field lines.','No work is done moving along an equipotential.','Around a point mass they are concentric spheres, spaced further apart further out for equal steps of V.']},
{h:'Escape speed and orbital speed (HL)',b:['Escape speed v_{esc} = √(2GM/r): kinetic energy just enough to reach infinity with total energy zero.','Orbital speed v_{orbital} = √(GM/r).','In a circular orbit: E_{k} = GMm/2r, E_{p} = −GMm/r, total E = −GMm/2r.']},
{h:'Atmospheric drag on satellites (HL)',b:['Drag does negative work, so the total energy decreases and the orbit gets lower.','In the lower orbit the satellite moves faster: kinetic energy increases while potential energy decreases by twice as much.']}
],
D2:[
{h:'Electric charge',b:['Two types: positive and negative. Like charges repel, unlike attract.','Charge is conserved and quantized in units of e = 1.60 × 10^{−19} C.','Objects become charged by friction, contact or induction, which all move electrons.','Millikan\'s oil drop experiment: drops held still when qE = mg always had charges that were whole multiples of e.']},
{h:'Coulomb\'s law',b:['F = kq_{1}q_{2}/r², with k = 1/4πε_{0} = 8.99 × 10^{9} N m² C^{−2}.','The force acts along the line joining the charges and follows an inverse square law, like gravity.']},
{h:'Electric fields',b:['Field strength E = F/q: force per unit positive test charge. Direction is the force on a positive charge.','Point charge: E = kQ/r². Field lines go out from + and into −.','Between parallel plates the field is uniform: E = V/d. Field lines are parallel and equally spaced, with edge effects at the ends.']},
{h:'Magnetic fields',b:['Field lines show the direction of the force on a north pole. Outside a magnet they run from N to S, and they form closed loops.','Straight wire: concentric circles around the wire. Use the right hand grip rule (thumb = current, fingers = field).','Solenoid: uniform field inside, like a bar magnet outside.','Dot = out of the page, cross = into the page.']},
{h:'Electric potential and potential energy (HL)',b:['Electric potential energy E_{p} = kq_{1}q_{2}/r. Positive for like charges, negative for unlike.','Electric potential V_{e} = kQ/r: work done per unit charge bringing a positive test charge from infinity. Scalar, zero at infinity.','Work done moving a charge: W = qΔV_{e}.','Field strength is the negative potential gradient: E = −ΔV_{e}/Δr.']},
{h:'Equipotentials (HL)',b:['Equipotential surfaces are perpendicular to field lines. No work is done moving a charge along one.','Between parallel plates they are equally spaced planes parallel to the plates.'],t:'Potential is per unit charge. Potential energy is for the actual charge. Do not mix them up.'}
],
D3:[
{h:'Force on a current-carrying wire',b:['F = BIL sin θ, where θ is the angle between the current and the field.','Maximum when the wire is perpendicular to the field. Zero when parallel.','Direction by Fleming\'s left hand rule: First finger = Field, seCond finger = Current, thuMb = Motion (force).']},
{h:'Parallel wires',b:['Each wire sits in the other\'s magnetic field, so each feels a force.','Currents in the same direction attract. Opposite directions repel.','Force per unit length: F/L = μ_{0}I_{1}I_{2}/2πr, with μ_{0} = 4π × 10^{−7} T m A^{−1}. The forces are equal and opposite (Newton\'s third law).']},
{h:'Force on a moving charge',b:['F = qvB sin θ. Zero if the charge moves parallel to the field.','For a negative charge, the force is opposite to that given by the left hand rule for conventional current.','The force is always perpendicular to the velocity, so it does no work and the speed stays constant.']},
{h:'Circular motion in a magnetic field',b:['A charge moving perpendicular to a uniform B field moves in a circle, because the magnetic force provides the centripetal force.','qvB = mv²/r, so r = mv/qB. Faster or heavier particles make bigger circles. Stronger fields or bigger charges make smaller ones.','The period T = 2πm/qB does not depend on the speed.']},
{h:'Charges in uniform electric fields',b:['A charge feels a constant force qE, so it has a uniform acceleration.','Entering a field at right angles, it follows a parabola, just like a projectile.','Energy gained crossing a p.d. V: qV = ½mv².']},
{h:'Crossed electric and magnetic fields',b:['If the electric and magnetic forces are opposite and equal, qE = qvB, the particle goes straight through.','Only particles with v = E/B pass undeflected (a velocity selector).']}
],
D4:[
{h:'Magnetic flux',b:['Φ = BA cos θ, where θ is the angle between the field and the normal to the area. Unit: Wb = T m².','Maximum when the field is perpendicular to the coil\'s plane. Zero when the field is parallel to it.','Flux linkage = NΦ for a coil of N turns.']},
{h:'Faraday\'s law',b:['A changing flux linkage induces an emf: ε = −NΔΦ/Δt.','The size of the emf depends on how fast the flux changes, not on how big the flux is.','Ways to induce an emf: move the magnet or coil, rotate the coil, or change the current producing the field.'],t:'The emf is the gradient of a flux linkage–time graph. Where the flux graph is flat, the emf is zero.'},
{h:'Lenz\'s law',b:['The induced emf drives a current whose magnetic field opposes the change that caused it.','Flux increasing: the induced field opposes the external field. Flux decreasing: it supports it.','This is conservation of energy. Work must be done against the opposing force to generate electrical energy.']},
{h:'Moving conductors',b:['A straight conductor moving perpendicular to a field: ε = BvL (or NBvL for N conductors).','The magnetic force on the free electrons pushes them to one end, creating a p.d. across the rod.','A loop moving through a uniform field has an emf only while entering or leaving it, when the flux through it is changing.']},
{h:'Rotating coils and generators',b:['A coil rotating in a uniform field has a sinusoidally varying flux, so the induced emf is sinusoidal.','The emf is maximum when the flux is zero (coil plane parallel to B), and zero when the flux is maximum.','Rotating faster increases both the peak emf and the frequency. Doubling the rotation frequency doubles both.','Peak emf ε_{0} = NBAω (useful result, not stated in the guide).']}
]
};

    let sec=null,any=false;
    u.q.forEach(q=>{const ps=q.p.filter(keep); if(!ps.length)return; any=true;
      if(q.s!==sec){sec=q.s; if(sec)h+='<h2 class="sec">'+esc(sec)+'</h2>'} h+=qHTML(q,ps,view.filter=='rev')});
    if(!any)h+='<p class="empty">'+(view.filter=='todo'?'Everything in this sub unit is done.':'Nothing in this sub unit is marked for review.')+'</p>';
  } else {
    h+='<div class="top"><button type="button" class="back" data-home>← All units</button><div class="ttl">Marked for review</div></div>'; let any=false;
    DATA.themes.forEach(t=>t.units.forEach(u=>{const qs=u.q.map(q=>[q,q.p.filter(p=>S.rev[p.id])]).filter(x=>x[1].length); if(!qs.length)return; any=true;
      h+='<h2 class="sec">'+u.k+' '+u.n+'</h2>'+qs.map(x=>qHTML(x[0],x[1],true)).join('')}));
    if(!any)h+='<p class="empty">Nothing is marked for review yet. Use the ⚑ Review button on any question part.</p>';
  }
  main.innerHTML=h; tracker()}
function go(v){Object.assign(view,v); try{localStorage.setItem(LS+'-view',JSON.stringify(view))}catch(e){} render(); window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.tab)return go({tab:b.dataset.tab,name:'home',unit:null});
  if(b.dataset.nunit)return go({tab:'notes',name:'unit',unit:b.dataset.nunit});
  if(b.dataset.funit)return go({tab:'formulas',name:'unit',unit:b.dataset.funit});
  if('fall' in b.dataset)return go({tab:'formulas',name:'all',unit:null});
  if(b.dataset.unit)return go({tab:'ws',name:'unit',unit:b.dataset.unit,filter:'all'});
  if('home' in b.dataset)return go({name:'home',unit:null});
  if(b.id=='revBtn')return go({tab:'ws',name:'review',unit:null});
  if(b.dataset.filter){view.filter=b.dataset.filter;return render()}
  if(b.dataset.whole){const q=QBY[b.dataset.whole],box=b.nextElementSibling,open=box.hidden;
    if(open&&!box.innerHTML)box.innerHTML='<p class="eyebrow">Complete question</p>'+cropHTML(q,0,q.W,q.H);
    box.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Hide complete question':'Show complete question';return}
  const el=b.closest('.part'); if(!el)return; const id=el.dataset.id,act=b.dataset.act;
  if(act=='show'){const a=el.querySelector('.ans'),open=a.hidden;
    if(open&&!a.innerHTML)a.innerHTML='<p class="eyebrow">Model answer</p>'+fmt(PARTS[id].p.a);
    a.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Hide answer':'Show answer';return}
  const map=act=='done'?S.done:S.rev; if(map[id])delete map[id];else map[id]=1; const on=!!map[id];
  b.setAttribute('aria-pressed',on); el.classList.toggle(act=='done'?'is-done':'is-flag',on);
  if(act=='done')b.querySelector('.box').textContent=on?'✓':'';
  save(); tracker()});
load();
try{const v=JSON.parse(localStorage.getItem(LS+'-view')||'null'); if(v){v.tab=v.tab||'ws'; const ok=v.tab=='ws'?(v.name=='home'||v.name=='review'||(UNITS[v.unit]&&!UNITS[v.unit].hide)):(v.name=='home'||v.name=='all'||NOTES[v.unit]); if(ok)Object.assign(view,v)}}catch(e){}
render(); tick(); setInterval(tick,1000); connect();
</script>
