or one solar system, so T ∝ r^{3/2}."},{"id":"d1-11.1","l":"(b)(i)","m":1,"y":154,"w":873,"h":42,"a":"The mean (average) distance between the Earth and the Sun, about 1.5 × 10¹¹ m."},{"id":"d1-11.2","l":"(b)(ii)","m":3,"y":196,"w":873,"h":110,"a":"r = 5.9 × 10⁹ km = 5.9 × 10¹² m = (5.9 × 10¹² / 1.5 × 10¹¹) AU = 39.3 AU\nFor Earth, T = 1 year at r = 1 AU, so T = r^{3/2} with T in years and r in AU.\nT = 39.3^{3/2}\n**T ≈ 250 years** (247 years)"}]},{"id":"d1-12","t":"Question 12","s":"","W":942,"H":375,"p":[{"id":"d1-12.0","l":"(a)","m":4,"y":0,"w":942,"h":204,"a":"At the surface g = GM / R², so GM = gR².\nEscape speed: ½mv² = GMm / R, so v = √(2GM / R) = √(2gR)\nv = √(2 × 0.617 × 1.19 × 10⁶)\n**v = 1.21 × 10³ m s⁻¹**"},{"id":"d1-12.1","l":"(b)","m":3,"y":204,"w":873,"h":171,"a":"- Because Pluto rotates from east to west, an object on its surface is already moving towards the west with the tangential speed of the surface.\n- This speed is greatest at the equator, where the distance from the axis of rotation is greatest (v = ωr).\n- Launching westwards from the equator means the object already has this kinetic energy, so less additional speed (less fuel/energy) is needed to reach orbital or escape speed."}]},{"id":"d1-13","t":"Question 13","s":"","W":874,"H":574,"p":[{"id":"d1-13.0","l":"","m":1,"y":0,"w":874,"h":574,"a":"**C**\nA mass placed at a point is pulled towards each of the two masses.\nIn Z (right of M) both forces act to the left, so the field is to the left.\nIn X (left of 3M) both forces act to the right.\nIn Y the forces are opposite. Close to 3M, the pull of 3M (to the left) is larger, so the field can be to the left there."}]},{"id":"d1-14","t":"Question 14","s":"","W":872,"H":710,"p":[{"id":"d1-14.0","l":"","m":1,"y":0,"w":872,"h":710,"a":"**C**\nWork done by an external agent = mΔV.\nX and Y lie on equivalent inner equipotentials (the masses are identical), so no work is done from X to Y.\nThe inner surfaces are at the lowest (most negative) potential and the outer surface is at the highest potential shown. W lies between them.\nY to Z spans the largest increase in potential, so it needs the greatest external work. (W to Y gives negative work, and W to Z is a smaller increase.)"}]},{"id":"d1-15","t":"Question 15","s":"","W":942,"H":875,"p":[{"id":"d1-15.0","l":"","m":1,"y":0,"w":942,"h":875,"a":"**C**\nPotential is potential energy per unit mass, so E_{P} = mV, where V is the value of the gravitational potential at r = 3R."}]},{"id":"d1-16","t":"Question 16","s":"","W":874,"H":432,"p":[{"id":"d1-16.0","l":"","m":1,"y":0,"w":874,"h":432,"a":"**C**\nv_{esc} = √(2GM / R) and M = (4/3)πR³ρ, so v_{esc} ∝ R√ρ.\nFor Y: v = v_{esc} × ½ × √2 = **v_{esc}√2 / 2**"}]},{"id":"d1-17","t":"Question 17","s":"","W":942,"H":440,"p":[{"id":"d1-17.0","l":"(a)","m":2,"y":0,"w":942,"h":147,"a":"The gravitational force is always attractive, so work must be done by an external agent to move a mass away from the point mass out to infinity.\nThe potential therefore increases with distance and reaches its maximum value, zero, at infinity. At every other point it must be less than zero, so it is negative."},{"id":"d1-17.1","l":"(b)(i)","m":1,"y":147,"w":873,"h":135,"a":"The minimum speed an object needs at the surface of a planet to escape the planet's gravitational field completely (to reach infinity, where its total energy is zero) without any further energy input."},{"id":"d1-17.2","l":"(b)(ii)","m":3,"y":282,"w":873,"h":158,"a":"v_{esc}² = 2GM / R. Conservation of energy between the surface and the highest point (at distance r from the centre, where the speed is zero):\n½m(0.9v_{esc})² − GMm / R = −GMm / r\n0.81 GM / R − GM / R = −GM / r\n0.19 / R = 1 / r, so r = 5.26R\nHeight above the surface = r − R\n**h ≈ 4.3R**"}]},{"id":"d1-18","t":"Question 18","s":"","W":942,"H":448,"p":[{"id":"d1-18.0","l":"","m":1,"y":0,"w":942,"h":448,"a":"**B**\ng = GM / R², so g ∝ M / R².\ng_{Y} = g × 3 / 2² = **3g / 4**"}]},{"id":"d1-19","t":"Question 19","s":"","W":874,"H":781,"p":[{"id":"d1-19.0","l":"","m":1,"y":0,"w":874,"h":781,"a":"**A**\nField strength is a vector. Near M the resultant field points towards M and is large. It falls to zero at the point where the two fields cancel, which is closer to the smaller mass N. Beyond that point the field points towards N, so it has the opposite sign and grows rapidly near N.\nGraph A starts large, crosses zero nearer to N and then becomes large in the opposite direction."}]},{"id":"d1-20","t":"Question 20","s":"","W":943,"H":428,"p":[{"id":"d1-20.0","l":"","m":1,"y":0,"w":943,"h":428,"a":"**C**\nV = −GM / r. A point R above the surface is 2R from the centre, so the potential is halved in magnitude: **−V / 2**."}]},{"id":"d1-21","t":"Question 21","s":"","W":874,"H":480,"p":[{"id":"d1-21.0","l":"","m":1,"y":0,"w":874,"h":480,"a":"**C**\nField strength = acceleration = Δv / Δt\nΔv = 20.6 − 20.0 = 0.6 km s⁻¹ = 600 m s⁻¹ and Δt = 10 × 60 = 600 s\ng = 600 / 600 = **1 N kg⁻¹**"}]},{"id":"d1-22","t":"Question 22","s":"","W":943,"H":357,"p":[{"id":"d1-22.0","l":"","m":1,"y":0,"w":943,"h":357,"a":"**C**\nFor equal densities the surface potential is V = −GM / R = −(4/3)πGρR², so it is more negative on the larger planet X.\nPotentials add as scalars. C is on the surface of X on the side nearer to Y, so Y's (negative) potential adds most there. C is the most negative."}]},{"id":"d1-23","t":"Question 23","s":"","W":943,"H":1199,"p":[{"id":"d1-23.0","l":"(a)","m":1,"y":0,"w":943,"h":189,"a":"V_{g} = −GM / r and g = GM / r²\nSo GM = gr², and V_{g} = −gr² / r = **−gr**."},{"id":"d1-23.1","l":"(b)(i)","m":2,"y":189,"w":873,"h":715,"a":"From the graph, at r = 1.0 × 10⁷ m, V_{g} = −4.0 × 10⁷ J kg⁻¹.\ng = |V_{g}| / r = 4.0 × 10⁷ / 1.0 × 10⁷\n**g = 4.0 N kg⁻¹**\n(Or draw a tangent at r = 1.0 × 10⁷ m and find its gradient.)"},{"id":"d1-23.2","l":"(b)(ii)","m":1,"y":904,"w":873,"h":42,"a":"F = mg = 750 × 4.0\n**F = 3.0 × 10³ N**"},{"id":"d1-23.3","l":"(c)(i)","m":2,"y":946,"w":874,"h":178,"a":"g ∝ 1 / r². The change in radius, 2.0 km, is tiny compared with the orbital radius of 1.0 × 10⁴ km (a change of 0.02%).\nSo the fractional change in g is only about 0.04%, which is negligible."},{"id":"d1-23.4","l":"(c)(ii)","m":3,"y":1124,"w":873,"h":75,"a":"Total orbital energy E = −GMm / 2r = ½mV_{g}.\nFor a small change in radius: ΔE = (GMm / 2r²) Δr = ½mgΔr\nΔE = ½ × 750 × 4.0 × 2.0 × 10³\n**ΔE = 3.0 × 10⁶ J** (an increase)"}]},{"id":"d1-24","t":"Question 24","s":"","W":874,"H":1334,"p":[{"id":"d1-24.0","l":"(a)","m":2,"y":0,"w":874,"h":948,"a":"Free body diagram: an arrow from the probe pointing towards the centre of the asteroid (to the left), labelled gravitational force/weight, and a **shorter** arrow pointing away from the asteroid (to the right), labelled N.\nThe probe moves in a circle of radius R, so the resultant force towards the centre is the centripetal force:\nGMm / R² − N = mω²R\n**N = m(GM / R² − ω²R)**"},{"id":"d1-24.1","l":"(b)","m":1,"y":948,"w":873,"h":106,"a":"The probe stays on the surface only while the asteroid still pushes on it, so N ≥ 0.\nGM / R² − ω²R ≥ 0\nω² ≤ GM / R³, so **ω ≤ √(GM / R³)**"},{"id":"d1-24.2","l":"(c)(i)","m":2,"y":1054,"w":873,"h":203,"a":"Intensity follows an inverse square law, I ∝ 1 / r².\nAt Earth the intensity (solar constant) is 1.36 × 10³ W m⁻².\nI = 1.36 × 10³ / 4² = 1.36 × 10³ / 16\n**I = 85 W m⁻²**"},{"id":"d1-24.3","l":"(c)(ii)","m":2,"y":1257,"w":873,"h":77,"a":"At equilibrium, power absorbed per unit area = power emitted per unit area.\n85 = σT⁴\nT = (85 / 5.67 × 10⁻⁸)^{1/4}\n**T ≈ 200 K** (197 K)\n(This treats the absorbing and emitting areas as equal. If the probe is modelled as a sphere that absorbs over πr² and emits over 4πr², T = 139 K.)"}]},{"id":"d1-25","t":"Question 25","s":"","W":873,"H":1392,"p":[{"id":"d1-25.0","l":"(a)","m":2,"y":0,"w":873,"h":549,"a":"At the surface the potential energy is −GMm / R.\nTotal energy = 2GMm / 3R − GMm / R = −GMm / 3R\nThe total energy is negative (the kinetic energy is less than the GMm / R needed to reach infinity), so the projectile **will not escape**."},{"id":"d1-25.1","l":"(b)(i)","m":2,"y":549,"w":873,"h":707,"a":"g = ΔV / Δr\nΔr = 3R / 2 − R = R / 2 = 4.25 × 10⁶ m\ng = 2.2 × 10⁶ / 4.25 × 10⁶\n**g ≈ 0.52 N kg⁻¹**\n(This is the average value between the two surfaces.)"},{"id":"d1-25.2","l":"(b)(ii)","m":2,"y":1256,"w":873,"h":136,"a":"V ∝ −1/r. Let V₀ be the surface potential. Then V₁ = (2/3)V₀, so V₁ − V₀ = |V₀| / 3 = 2.2 × 10⁶, giving V₀ = −6.6 × 10⁶ J kg⁻¹ and V₁ = −4.4 × 10⁶ J kg⁻¹.\nV₂ = −4.4 × 10⁶ + 2.2 × 10⁶ = −2.2 × 10⁶ J kg⁻¹ = V₀ / 3, so r₂ = 3R.\nDraw a **circle centred on P with radius 3R** (three times the radius of P, twice the radius of E₁). Equal potential steps are further apart at greater distances."}]},{"id":"d1-26","t":"Question 26","s":"","W":943,"H":476,"p":[{"id":"d1-26.0","l":"","m":1,"y":0,"w":943,"h":476,"a":"**C**\ng = GM / R², so g_{X} = g × 300 / 10² = **3g**"}]},{"id":"d1-27","t":"Question 27","s":"","W":943,"H":425,"p":[{"id":"d1-27.0","l":"","m":1,"y":0,"w":943,"h":425,"a":"**C**\nTotal energy in a circular orbit = −GMm / 2r.\n−GMm / 2r = −GMm / 4R, so **r = 2R**"}]},{"id":"d1-28","t":"Question 28","s":"","W":943,"H":1415,"p":[{"id":"d1-28.0","l":"(a)","m":2,"y":0,"w":943,"h":211,"a":"g = GM / r²\nM = gr² / G = (2.7 × 10⁻³ × (2.3 × 10⁵)²) / 6.67 × 10⁻¹¹\n**M = 2.1 × 10¹⁸ kg**"},{"id":"d1-28.1","l":"(b)","m":1,"y":211,"w":873,"h":316,"a":"W = mg = 95 × 2.7 × 10⁻³\n**W = 0.26 N**"},{"id":"d1-28.2","l":"(c)(i)","m":3,"y":527,"w":873,"h":112,"a":"- The engine ejects exhaust gases at high speed towards the asteroid, giving the gases momentum in that direction (the engine exerts a force on the gases).\n- By Newton's third law the gases exert an equal and opposite force on the probe, away from the asteroid. (Equivalently, momentum is conserved.)\n- This force is greater than the weight and is opposite to the probe's velocity, so the probe decelerates."},{"id":"d1-28.3","l":"(c)(ii)","m":4,"y":639,"w":873,"h":147,"a":"Resultant force = thrust − weight = 12.0 − 0.26 = 11.7 N (upwards)\nDeceleration a = F / m = 11.7 / 95 = 0.124 m s⁻²\nt = Δv / a = 0.64 / 0.124 = 5.18 s\n**t = 5.2 s** (2 significant figures, matching the least precise data, 0.64 m s⁻¹)"},{"id":"d1-28.4","l":"(d)(i)","m":1,"y":786,"w":873,"h":111,"a":"For escape, kinetic energy at the surface = magnitude of the potential energy:\n½mv² = GMm / r, so v = √(2GM / r)\ng = GM / r², so GM = gr²\n**v_{esc} = √(2gr)**"},{"id":"d1-28.5","l":"(d)(ii)","m":1,"y":897,"w":873,"h":42,"a":"v_{esc} = √(2 × 2.7 × 10⁻³ × 2.3 × 10⁵)\n**v_{esc} = 35 m s⁻¹**"},{"id":"d1-28.6","l":"(e)","m":2,"y":939,"w":804,"h":476,"a":"Vertically, from rest: h = ½gt²\nt = √(2h / g) = √(2 × 1.9 / 2.7 × 10⁻³) = 37.5 s\nHorizontally the speed is constant:\ns = vt = 34 × 37.5\n**s ≈ 1.3 × 10³ m** (1.3 km)"}]},{"id":"d1-29","t":"Question 29","s":"","W":943,"H":459,"p":[{"id":"d1-29.0","l":"","m":1,"y":0,"w":943,"h":459,"a":"**C**\nF ∝ 1 / r². At the surface r = R and at height h the distance is 5R / 4.\nF_{surface} / F_{h} = (5/4)² = **25 / 16**"}]},{"id":"d1-30","t":"Question 30","s":"","W":874,"H":636,"p":[{"id":"d1-30.0","l":"","m":1,"y":0,"w":874,"h":636,"a":"**D**\nField (vector): P pulls towards the left with Gm / d². Q pulls towards the right with G(2m) / (2d)² = Gm / 2d².\nNet field = Gm / d² − Gm / 2d² = Gm / 2d²\nPotential (scalar): V = −Gm / d − G(2m) / 2d = −2Gm / d"}]},{"id":"d1-31","t":"Question 31","s":"","W":943,"H":420,"p":[{"id":"d1-31.0","l":"","m":1,"y":0,"w":943,"h":420,"a":"**A**\nv_{esc}² = 2GM / R, so GM / R = v_{esc}² / 2.\nOrbital radius r = R + R/4 = 5R / 4.\nTotal energy in orbit = −GMm / 2r = −2GMm / 5R = −mv_{esc}² / 5\nEnergy needed to reach infinity (total energy zero) = **mv_{esc}² / 5**"}]},{"id":"d1-32","t":"Question 32","s":"","W":874,"H":418,"p":[{"id":"d1-32.0","l":"","m":1,"y":0,"w":874,"h":418,"a":"**A**\nv_{esc} = √(2GM / R), so v_{esc} ∝ √(M / R).\nRatio = √(10 / 2) = **√5**"}]},{"id":"d1-33","t":"Question 33","s":"","W":943,"H":1447,"p":[{"id":"d1-33.0","l":"(a)","m":2,"y":0,"w":943,"h":297,"a":"g = GM / R², so\ng_{M} / g_{P} = (M_{M} / M_{P}) ÷ (R_{M} / R_{P})² = 0.055 / 0.27²\n**g_{M} / g_{P} = 0.75**"},{"id":"d1-33.1","l":"(b)(i)","m":2,"y":297,"w":873,"h":716,"a":"**Zero.**\nField strength equals the negative of the potential gradient (g = −ΔV / Δx), and the gradient of the graph is zero at O. Physically, the fields due to P and M are equal in magnitude and opposite in direction at O."},{"id":"d1-33.2","l":"(b)(ii)","m":2,"y":1013,"w":873,"h":42,"a":"Gravitational potential is defined as zero at infinity. Because the gravitational force is attractive, work must be done on a mass to move it from any point out to infinity, so the potential everywhere else is less than zero.\nThe potentials due to P and M are both negative and they add as scalars, so the total is negative."},{"id":"d1-33.3","l":"(b)(iii)","m":2,"y":1055,"w":873,"h":112,"a":"At the surface of P: V_{P} = −GM_{P} / R_{P} and g_{P} = GM_{P} / R_{P}²\nSo GM_{P} = g_{P}R_{P}²\nV_{P} = −g_{P}R_{P}² / R_{P} = **−g_{P}R_{P}**"},{"id":"d1-33.4","l":"(b)(iv)","m":2,"y":1167,"w":873,"h":169,"a":"From the graph the potential at the surface of P (x = 0) is about −66 MJ kg⁻¹.\nV_{M} / V_{P} = (M_{M} / M_{P}) ÷ (R_{M} / R_{P}) = 0.055 / 0.27 = 0.204\nV_{M} = 0.204 × (−66)\n**V_{M} ≈ −13 MJ kg⁻¹**"},{"id":"d1-33.5","l":"(b)(v)","m":1,"y":1336,"w":637,"h":111,"a":"Continue the curve from O with **zero gradient at O**, then curving **downwards with an increasingly steep negative gradient** until it reaches the surface of M at x = 100 Mm.\nIt ends at a value more negative than −13 MJ kg⁻¹ (roughly −15 to −20 MJ kg⁻¹), because the small potential due to P adds to that of M."}]},{"id":"d1-34","t":"Question 34","s":"","W":874,"H":724,"p":[{"id":"d1-34.0","l":"","m":1,"y":0,"w":874,"h":724,"a":"**C**\nAt X the two field strengths are equal in magnitude:\nGM_{E} / d² = GM_{M} / (D − d)²\n**M_{E} / d² = M_{M} / (D − d)²**"}]},{"id":"d1-35","t":"Question 35","s":"","W":944,"H":476,"p":[{"id":"d1-35.0","l":"","m":1,"y":0,"w":944,"h":476,"a":"**D**\nT² ∝ r³, so the more distant satellite Y has the greater period.\nTotal energy = −GMm / 2r. A larger r gives a less negative value, so Y has the greater total energy."}]},{"id":"d1-36","t":"Question 36","s":"","W":873,"H":1046,"p":[{"id":"d1-36.0","l":"(a)","m":2,"y":0,"w":873,"h":861,"a":"**Y** has the larger potential.\nThe arrows show the field directed from Y towards X. Electric potential decreases in the direction of the field (a positive charge would be accelerated from Y to X, losing potential energy), so Y is at the higher potential."},{"id":"d1-36.1","l":"(b)(i)","m":2,"y":861,"w":873,"h":75,"a":"Orbital radius r = 6.4 × 10⁶ + 5.0 × 10⁵ = 6.9 × 10⁶ m\nGMm / r² = mv² / r, so E_{K} = ½mv² = GMm / 2r\nE_{K} = (6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 8.0 × 10²) / (2 × 6.9 × 10⁶)\nE_{K} = 2.3 × 10¹⁰ J ≈ 2 × 10¹⁰ J"},{"id":"d1-36.2","l":"(b)(ii)","m":2,"y":936,"w":873,"h":110,"a":"Energy on the surface = −GMm / R = −(6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 800) / 6.4 × 10⁶ = −5.00 × 10¹⁰ J\nTotal energy in orbit = −GMm / 2r = −2.32 × 10¹⁰ J\nEnergy required = −2.32 × 10¹⁰ − (−5.00 × 10¹⁰)\n**= 2.7 × 10¹⁰ J**"}]},{"id":"a4-16","t":"Question 37","s":"","W":859,"H":962,"p":[{"id":"a4-16.0","l":"(a)","m":2,"y":0,"w":369,"h":81,"a":"The gravitational force between two point masses is proportional to the product of their masses and inversely proportional to the square of the distance between them."},{"id":"a4-16.1","l":"(b)","m":4,"y":81,"w":859,"h":687,"a":"The gravitational force on Io provides the centripetal force:\nGMm / (nR)² = m(nR)ω², with ω = 2π / T\nGM / n²R² = 4π²nR / T²\nMass of Jupiter M = density × volume = ρ × (4/3)πR³\nG × (4/3)πR³ρ / n²R² = 4π²nR / T²\n(4/3)πGρR = 4π²n³R / T²\n**ρT² = 3πn³ / G**"},{"id":"a4-16.2","l":"(c)(i)","m":3,"y":768,"w":855,"h":130,"a":"n = 4.32 × 10⁵ / 7.15 × 10⁴ = 6.04\nT = 42.5 × 3600 = 1.53 × 10⁵ s\nρ = 3πn³ / GT² = (3π × 6.04³) / (6.67 × 10⁻¹¹ × (1.53 × 10⁵)²)\n**ρ = 1.3 × 10³ kg m⁻³**"},{"id":"a4-16.3","l":"(c)(ii)","m":1,"y":898,"w":806,"h":64,"a":"Jupiter's mean density is about a quarter of the Earth's, so it cannot be made mainly of rock. It must be made mostly of much less dense material: gas and liquid (hydrogen and helium)."}]},{"id":"a4-17","t":"Question 38","s":"","W":907,"H":833,"p":[{"id":"a4-17.0","l":"(a)(i)","m":2,"y":0,"w":907,"h":509,"a":"- The centripetal force on each star is provided by the gravitational force that the other star exerts on it.\n- By Newton's third law these two forces are equal in magnitude and opposite in direction."},{"id":"a4-17.1","l":"(a)(ii)","m":2,"y":509,"w":607,"h":87,"a":"T = 4.0 × 365 × 24 × 3600 = 1.26 × 10⁸ s\nω = 2π / T = 2π / 1.26 × 10⁸\n**ω = 5.0 × 10⁻⁸ rad s⁻¹**"},{"id":"a4-17.2","l":"(b)(i)","m":3,"y":596,"w":571,"h":173,"a":"The centripetal forces are equal and both stars have the same ω. Star A orbits at radius d and star B at radius (2.8 × 10⁸ − d).\nM_{A}dω² = M_{B}(2.8 × 10⁸ − d)ω²\n(M_{A} / M_{B})d = 2.8 × 10⁸ − d\n3.0d = 2.8 × 10⁸ − d\n**d = 7.0 × 10⁷ km**"},{"id":"a4-17.3","l":"(b)(ii)","m":3,"y":769,"w":721,"h":64,"a":"The gravitational force between the stars provides the centripetal force on star A. The separation is D = 2.8 × 10¹¹ m and d = 7.0 × 10¹⁰ m.\nGM_{A}M_{B} / D² = M_{A}dω²\nM_{B} = dω²D² / G = (7.0 × 10¹⁰ × (5.0 × 10⁻⁸)² × (2.8 × 10¹¹)²) / 6.67 × 10⁻¹¹\n**M_{B} = 2.1 × 10²⁹ kg** (2.0 × 10²⁹ kg if ω is not rounded)"}]}]},{"k":"D2","n":"Electric and magnetic fields","q":[{"id":"d2-1","t":"Question 1","s":"","W":1000,"H":792,"p":[{"id":"d2-1.0","l":"","m":1,"y":0,"w":1000,"h":792,"a":"**C**\nConventional current flows from the sphere to the ground, so electrons flow from the ground onto the sphere. The sphere gains electrons and is left with a **negative** induced charge once the ground connection is removed.\nElectrons were attracted onto the sphere, so the rod must be **positive**."}]},{"id":"d2-2","t":"Question 2","s":"","W":1000,"H":568,"p":[{"id":"d2-2.0","l":"","m":1,"y":0,"w":1000,"h":568,"a":"**A**\nThe force on the electron is zero, so the resultant field at the electron is zero.\nk(1.0) / d² + kq / (2d)² = 0\nq = −4 × 1.0 = **−4.0 µC**"}]},{"id":"d2-3","t":"Question 3","s":"","W":1000,"H":313,"p":[{"id":"d2-3.0","l":"","m":1,"y":0,"w":1000,"h":313,"a":"**A**\nInside a charged conductor the electric field is zero, so no work is done moving a charge inside it. The potential is therefore constant inside, equal to the value at the surface (kQ/R). Outside, the potential decreases with distance."}]},{"id":"d2-4","t":"Question 4","s":"","W":1000,"H":2280,"p":[{"id":"d2-4.0","l":"(a)(i)","m":2,"y":0,"w":1000,"h":328,"a":"- Straight, parallel, **equally spaced** lines between the plates, perpendicular to them.\n- Arrows pointing **from the positive (top) plate to the negative (bottom) plate**.\nAt the edges the lines curve outwards slightly (edge effect)."},{"id":"d2-4.1","l":"(a)(ii)","m":2,"y":328,"w":1000,"h":170,"a":"E = V / d = 960 / 8.0 × 10⁻³\n**E = 1.2 × 10⁵ V m⁻¹** (N C⁻¹)"},{"id":"d2-4.2","l":"(b)","m":1,"y":498,"w":1000,"h":429,"a":"The drop rubs against the air and the wall of the tube. Friction transfers electrons between the drop and the tube/air, so the drop is left with a net charge."},{"id":"d2-4.3","l":"(c)(i)","m":3,"y":927,"w":1000,"h":190,"a":"Buoyancy force = weight of air displaced = ρ_{air}Vg\nWeight of drop = ρ_{oil}Vg\nBuoyancy / weight = ρ_{air} / ρ_{oil} = 1 / 730\nSo the buoyancy force is 730 times smaller than the weight (about 0.14% of it) and can be neglected."},{"id":"d2-4.4","l":"(c)(ii)","m":2,"y":1117,"w":938,"h":451,"a":"- An arrow vertically **downwards** from the drop, labelled weight (mg).\n- An arrow vertically **upwards** from the drop, labelled electric force (qE).\nThe two arrows have **equal length** because the drop is stationary."},{"id":"d2-4.5","l":"(c)(iii)","m":2,"y":1568,"w":791,"h":181,"a":"The drop is in equilibrium, so electric force = weight:\nqE = mg\nThe mass of the drop is m = ρ_{o}V, so qE = ρ_{o}Vg\n**q = ρ_{o}gV / E**"},{"id":"d2-4.6","l":"(c)(iv)","m":1,"y":1749,"w":938,"h":43,"a":"**Negative.** The field points downwards (from the positive top plate to the negative bottom plate) and the electric force on the drop must be upwards, opposite to the field."},{"id":"d2-4.7","l":"(d)(i)","m":2,"y":1792,"w":1000,"h":175,"a":"- At constant (terminal) speed the acceleration is zero, so the resultant force is zero.\n- The weight ρ_{o}gV (downwards) is balanced by the viscous drag force, given by Stokes' law as 6πηrv (upwards). Buoyancy is negligible."},{"id":"d2-4.8","l":"(d)(ii)","m":3,"y":1967,"w":1000,"h":232,"a":"From (c)(iii) and (d)(i): q = ρ_{o}gV / E = 6πηrv / E\nq = (6π × 1.60 × 10⁻⁵ × 1.36 × 10⁻⁶ × 0.140 × 10⁻³) / 1.2 × 10⁵\nq = 4.79 × 10⁻¹⁹ C ≈ 4.8 × 10⁻¹⁹ C"},{"id":"d2-4.9","l":"(d)(iii)","m":2,"y":2199,"w":1000,"h":81,"a":"Charge is quantized in units of e = 1.6 × 10⁻¹⁹ C.\n4.8 × 10⁻¹⁹ / 1.6 × 10⁻¹⁹ = 3, so the drop carries 3e. Each part must carry a whole number of e, and both are charged, so one part has **−1.6 × 10⁻¹⁹ C (e)** and the other **−3.2 × 10⁻¹⁹ C (2e)**."}]},{"id":"d2-5","t":"Question 5","s":"","W":1000,"H":439,"p":[{"id":"d2-5.0","l":"","m":1,"y":0,"w":1000,"h":439,"a":"**D**\nThe force on a negative charge is opposite to the field, so the field must point to the left. That is true at A and D (at B and C the field points to the right).\nThe field is stronger closer to the source, and D is closer to the source than A, so the force is greatest at D."}]},{"id":"d2-6","t":"Question 6","s":"","W":1000,"H":435,"p":[{"id":"d2-6.0","l":"","m":1,"y":0,"w":1000,"h":435,"a":"**A**\nUse the right hand grip rule for each wire. The field is tangent to a circle centred on the wire.\nP (current out of the page) gives anticlockwise field lines. R is to the right of P, so the field due to P points up the page.\nQ (current into the page) gives clockwise field lines. R is above Q, so the field due to Q points to the right.\nThe fields have equal magnitude, so the resultant points up and to the right: direction A."}]},{"id":"d2-7","t":"Question 7","s":"","W":1000,"H":255,"p":[{"id":"d2-7.0","l":"","m":1,"y":0,"w":1000,"h":255,"a":"**D**\nThe closer together the field lines, the stronger the field. Field lines never cross, they are perpendicular to equipotential surfaces, and they point from positive to negative."}]},{"id":"d2-8","t":"Question 8","s":"","W":1000,"H":687,"p":[{"id":"d2-8.0","l":"","m":1,"y":0,"w":1000,"h":687,"a":"**C**\nNewton's third law: the force X exerts on Y is equal in magnitude and opposite in direction to the force Y exerts on X."}]},{"id":"d2-9","t":"Question 9","s":"","W":1000,"H":428,"p":[{"id":"d2-9.0","l":"","m":1,"y":0,"w":1000,"h":428,"a":"**C**\nEach corner is d/2 from the centre. Potential is a scalar, so add:\nV = k(3Q + q) / (d/2) = 2k(3Q + q) / d = 10kQ / d\n3Q + q = 5Q, so **q = 2Q**"}]},{"id":"d2-10","t":"Question 10","s":"","W":1000,"H":609,"p":[{"id":"d2-10.0","l":"","m":1,"y":0,"w":1000,"h":609,"a":"**D**\nThe sphere is at rest, so electric force = weight.\nqE = mg and E = V / s\nqV / s = mg, so **q = mgs / V**"}]},{"id":"d2-11","t":"Question 11","s":"","W":932,"H":828,"p":[{"id":"d2-11.0","l":"","m":1,"y":0,"w":932,"h":828,"a":"**D**\nInside a hollow charged conductor the electric field is **zero**. The potential is therefore constant throughout the inside and equal to the potential at the surface, **kQ / R**."}]},{"id":"d2-12","t":"Question 12","s":"","W":1000,"H":886,"p":[{"id":"d2-12.0","l":"","m":1,"y":0,"w":1000,"h":886,"a":"**D**\nA positive charge moves from high potential to low potential, so it moves towards **Y**.\nIt starts midway, so it moves through half the potential difference.\nE_{K} = qΔV = **q(V_{X} − V_{Y}) / 2**"}]},{"id":"d2-13","t":"Question 13","s":"","W":1000,"H":1595,"p":[{"id":"d2-13.0","l":"(a)(i)","m":3,"y":0,"w":1000,"h":701,"a":"- The potential is positive everywhere and is **constant inside each sphere** (a horizontal line at the same maximum value across each sphere).\n- Between the spheres the curve falls from the surface of the left sphere to a **minimum at C that is not zero**, with zero gradient at C.\n- The curve is **symmetric about C**, rising again to the same value at the surface of the right sphere."},{"id":"d2-13.1","l":"(a)(ii)","m":2,"y":701,"w":1000,"h":261,"a":"C is D/2 = 0.60 m from each sphere. Potential is a scalar, so add:\nV_{C} = 2 × kQ / (D/2) = 4kQ / D = (4 × 8.99 × 10⁹ × 2.0 × 10⁻³) / 1.2 = 6.0 × 10⁷ V\nW = qV_{C} = 4.0 × 10⁻⁹ × 6.0 × 10⁷\n**W = 0.24 J**"},{"id":"d2-13.2","l":"(b)(i)","m":2,"y":962,"w":1000,"h":377,"a":"- The force is directly proportional to the displacement x from C (32kQq / D³ is constant).\n- The force is directed towards C, opposite to the displacement, because the positive charge q is repelled more strongly by the nearer sphere. It is a restoring force.\nThese are the conditions for simple harmonic motion (a ∝ −x)."},{"id":"d2-13.3","l":"(b)(ii)","m":2,"y":1339,"w":1000,"h":136,"a":"F = mω²x for SHM, so mω² = 32kQq / D³.\nFrom (a)(ii), W = 4kQq / D, so kQq = WD / 4 and\nω² = 8W / (mD²) = (8 × 0.24) / (0.025 × 1.2²) = 53.3\n**ω = 7.3 rad s⁻¹**"},{"id":"d2-13.4","l":"(c)","m":2,"y":1475,"w":1000,"h":120,"a":"**No.** The gravitational force is always attractive, so when m is displaced from C it is attracted more strongly by the nearer mass M. The resultant force is directed away from C, in the same direction as the displacement.\nIt is not a restoring force, so m does not oscillate. It accelerates away from C towards the nearer mass."}]},{"id":"d2-14","t":"Question 14","s":"","W":1000,"H":518,"p":[{"id":"d2-14.0","l":"","m":1,"y":0,"w":1000,"h":518,"a":"**A**\nFor the forces on Q to cancel they must act in opposite directions. Q is between the charges, so both must attract it or both must repel it: Q₁ and Q₂ have the **same** sign.\nF = kQ₁Q / r². Q₁ is further away, so it needs the larger magnitude to give an equal force: **Q₁ > Q₂**."}]},{"id":"d2-15","t":"Question 15","s":"","W":1000,"H":599,"p":[{"id":"d2-15.0","l":"","m":1,"y":0,"w":1000,"h":599,"a":"**A**\nIdentical charges sit at opposite corners. The fields at X from the two +Q charges are equal and opposite, so they cancel, and the same is true for the two −Q charges. E = 0.\nPotential is a scalar: V = k(+Q + Q − Q − Q) / r = 0."}]},{"id":"d2-16","t":"Question 16","s":"","W":1000,"H":675,"p":[{"id":"d2-16.0","l":"","m":1,"y":0,"w":1000,"h":675,"a":"**D**\nE = −ΔV / Δr. The field strength is the negative of the potential gradient, so it is the negative of the gradient of the tangent at s."}]},{"id":"d2-17","t":"Question 17","s":"","W":1000,"H":1776,"p":[{"id":"d2-17.0","l":"(a)(i)","m":2,"y":0,"w":1000,"h":249,"a":"Field at P due to one charge:\nE = kQ / r² = (8.99 × 10⁹ × 44 × 10⁻⁶) / 0.48² = 1.72 × 10⁶ N C⁻¹\nThe two fields are at 60° to each other, each at 30° to the perpendicular bisector. The components parallel to the line joining the charges cancel, and the components along the bisector add:\nE_{net} = 2E cos 30° = 2 × 1.72 × 10⁶ × cos 30°\nE_{net} = 3.0 × 10⁶ N C⁻¹ = 3 MN C⁻¹"},{"id":"d2-17.1","l":"(a)(ii)","m":1,"y":249,"w":982,"h":43,"a":"Along the perpendicular bisector (the dotted line), **directed away from the two charges** (vertically up the page)."},{"id":"d2-17.2","l":"(b)(i)","m":2,"y":292,"w":996,"h":394,"a":"- The force is proportional to the displacement x from the midpoint (F = 115x).\n- q is negative, so it is attracted by both positive charges. The resultant force points along the bisector towards the midpoint, opposite to the displacement.\nForce proportional to displacement and directed towards equilibrium is the condition for SHM."},{"id":"d2-17.3","l":"(b)(ii)","m":2,"y":686,"w":1000,"h":43,"a":"F = mω²x, so mω² = 115\nω = √(115 / 0.25) = 21.4 rad s⁻¹\nT = 2π / ω\n**T = 0.29 s**"},{"id":"d2-17.4","l":"(c)(i)","m":2,"y":729,"w":1000,"h":876,"a":"The capacitor is initially uncharged, so at t = 0 all of the cell's emf is across R.\nThe graph **starts at 12 V** and **decays exponentially towards zero** (a curve with a decreasing gradient that approaches the time axis) as the capacitor charges and the current falls.\n(Capacitors are not in the 2025 syllabus.)"},{"id":"d2-17.5","l":"(c)(ii)","m":2,"y":1605,"w":1000,"h":171,"a":"For a discharging capacitor V = V₀e^{−t/RC}.\n0.50 = e^{−5.0/RC}, so RC = 5.0 / ln 2 = 7.2 s\nC = 7.2 / 20 × 10⁶\n**C = 3.6 × 10⁻⁷ F** (0.36 µF)\n(Capacitors are not in the 2025 syllabus.)"}]},{"id":"d2-18","t":"Question 18","s":"","W":1000,"H":1080,"p":[{"id":"d2-18.0","l":"(a)","m":1,"y":0,"w":1000,"h":152,"a":"V = W / q = 4.5 × 10⁻⁶ / 0.25 × 10⁻⁶\n**V = 18 V**"},{"id":"d2-18.1","l":"(b)(i)","m":2,"y":152,"w":1000,"h":315,"a":"F = kq₁q₂ / r² = (8.99 × 10⁹ × 68 × 10⁻⁶ × 0.25 × 10⁻⁶) / 0.48²\n**F = 0.66 N**, directed away from P (both charges are positive, so the force is repulsive)."},{"id":"d2-18.2","l":"(b)(ii)","m":2,"y":467,"w":938,"h":43,"a":"- Q accelerates away from P along the straight line joining them, so its speed keeps increasing.\n- The force falls as 1/r² as the separation grows, so the **acceleration decreases**. The speed approaches a constant maximum value at large distance."},{"id":"d2-18.3","l":"(c)(i)","m":1,"y":510,"w":1000,"h":528,"a":"The current in X is into the page, so its field lines are clockwise circles centred on X. The field at Q is tangent to the circle through Q, so it is perpendicular to the line XQ.\nDraw the arrow at Q pointing **down and to the right, along the line from Q towards Y**."},{"id":"d2-18.4","l":"(c)(ii)","m":2,"y":1038,"w":1000,"h":42,"a":"The field due to Y has the same magnitude, 15 mT, and is perpendicular to YQ: it points up and to the right. The two fields are at 90° to each other.\nTheir vertical components cancel and the horizontal components add:\nB = 2 × 15 × cos 45° = √(15² + 15²)\n**B = 21 mT, directed to the right** (parallel to the line XY, in the direction from X to Y)"}]}]},{"k":"D3","n":"Motion in electromagnetic fields","q":[{"id":"d3-1","t":"Question 1","s":"","W":1000,"H":629,"p":[{"id":"d3-1.0","l":"(a)","m":2,"y":0,"w":1000,"h":159,"a":"**2.0 × 10⁻⁵ N**, in the opposite direction to the force on P.\nBy Newton's third law, the force that Q exerts on P is equal in magnitude and opposite in direction to the force that P exerts on Q (for the same length of wire)."},{"id":"d3-1.1","l":"(b)","m":2,"y":159,"w":996,"h":40,"a":"F = μ₀I_{P}I_{Q}L / 2πr\nI_{Q} = 2πrF / (μ₀I_{P}L) = (2π × 0.10 × 2.0 × 10⁻⁵) / (4π × 10⁻⁷ × 5.0 × 0.50)\n**I_{Q} = 4.0 A**"},{"id":"d3-1.2","l":"(c)(i)","m":1,"y":199,"w":997,"h":390,"a":"**Opposite to the direction of the current in P.**\nThe force on Q from R must cancel the force on Q from P. P and R are on the same side of Q, so one must attract Q and the other repel it. That needs the currents in P and R to be in opposite directions."},{"id":"d3-1.3","l":"(c)(ii)","m":2,"y":589,"w":934,"h":40,"a":"The two forces on Q are equal in magnitude. Force per unit length ∝ I / r, so:\nI_{P} / 0.10 = I_{R} / 0.05\nI_{R} = 5.0 × 0.05 / 0.10\n**I_{R} = 2.5 A**"}]},{"id":"d3-2","t":"Question 2","s":"","W":1000,"H":616,"p":[{"id":"d3-2.0","l":"(a)","m":1,"y":0,"w":926,"h":41,"a":"From F = μ₀I₁I₂L / 2πr, μ₀ has units N A⁻².\nIn fundamental units: **kg m s⁻² A⁻²**"},{"id":"d3-2.1","l":"(b)(i)","m":1,"y":41,"w":1000,"h":404,"a":"**Into the plane of the page.**\nRight hand grip rule: with the thumb along the current (up the page), the fingers curl into the page on the right hand side of the wire, where A is."},{"id":"d3-2.2","l":"(b)(ii)","m":1,"y":445,"w":525,"h":40,"a":"**To the right, away from the straight wire.**\nThe current in AB flows down the page, opposite to the current in the straight wire, and antiparallel currents repel. (Left hand rule: field into the page, current down the page, force to the right.)"},{"id":"d3-2.3","l":"(c)(i)","m":2,"y":485,"w":621,"h":91,"a":"Force on AB (0.30 m from the wire, repelled):\nF = μ₀I₁I₂L / 2πr = (4π × 10⁻⁷ × 2.0 × 1.0 × 0.20) / (2π × 0.30) = 2.67 × 10⁻⁷ N\nForce on CD (0.50 m from the wire, attracted):\nF = (4π × 10⁻⁷ × 2.0 × 1.0 × 0.20) / (2π × 0.50) = 1.60 × 10⁻⁷ N\nThe forces on BC and DA are equal and opposite, so they cancel.\nNet force = 2.67 × 10⁻⁷ − 1.60 × 10⁻⁷\n**= 1.1 × 10⁻⁷ N**"},{"id":"d3-2.4","l":"(c)(ii)","m":1,"y":576,"w":549,"h":40,"a":"**To the right, away from the straight wire**, because the repulsive force on the nearer side AB is larger than the attractive force on CD."}]},{"id":"d3-3","t":"Question 3","s":"","W":1000,"H":582,"p":[{"id":"d3-3.0","l":"(a)","m":4,"y":0,"w":1000,"h":493,"a":"The wires are in parallel, so they have the same potential difference.\nV = IR = 10 × 15 = 150 V\nCurrent in the 30 Ω wire = 150 / 30 = 5.0 A\nF = μ₀I₁I₂L / 2πr = (4π × 10⁻⁷ × 10 × 5.0 × 0.25) / (2π × 0.20)\n**F = 1.3 × 10⁻⁵ N** (1.25 × 10⁻⁵ N)\nThe currents are in the same direction, so the force is attractive: directed **towards the 30 Ω wire**."},{"id":"d3-3.1","l":"(b)","m":3,"y":493,"w":934,"h":89,"a":"Field at the 15 Ω wire due to the 30 Ω wire:\nB = μ₀I / 2πr = (4π × 10⁻⁷ × 5.0) / (2π × 0.20) = 5.0 × 10⁻⁶ T = 5 µT\nThe Earth's field (45 µT) is about 9 times stronger than this, so the force it could exert on the wire (up to BIL = 45 × 10⁻⁶ × 10 × 0.25 = 1.1 × 10⁻⁴ N) is larger than the force between the wires.\nThe assumption is **not justified**, unless the wires happen to lie parallel to the Earth's field, in which case the Earth's field exerts no force on them."}]},{"id":"d3-4","t":"Question 4","s":"","W":1000,"H":447,"p":[{"id":"d3-4.0","l":"(a)(i)","m":2,"y":0,"w":758,"h":240,"a":"- **Concentric circles** centred on A, with the spacing between circles **increasing** with distance from A (the field gets weaker).\n- Arrows showing a **clockwise** direction (right hand grip rule with the thumb pointing into the page)."},{"id":"d3-4.1","l":"(a)(ii)","m":3,"y":240,"w":1000,"h":72,"a":"- At B, the field due to A is tangent to the circle through B, so it points down the page, in the plane of the paper.\n- The current in B is into the page, perpendicular to this field, so a magnetic force acts on B.\n- By the left hand rule the force is perpendicular to both the field and the current: it lies in the plane of the paper and is directed **towards A**. (Parallel currents attract.)"},{"id":"d3-4.2","l":"(b)","m":2,"y":312,"w":1000,"h":135,"a":"F = μ₀I₁I₂L / 2πr = (4π × 10⁻⁷ × 12 × 12 × 7.5) / (2π × 0.25)\n**F = 8.6 × 10⁻⁴ N** (attractive)"}]},{"id":"d3-11","t":"Question 5","s":"","W":1000,"H":659,"p":[{"id":"d3-11.0","l":"(a)","m":2,"y":0,"w":1000,"h":539,"a":"- The magnetic force on the proton is always perpendicular to its velocity (and to the field), and it has constant magnitude qvB.\n- A force of constant magnitude that is always perpendicular to the velocity changes the direction but not the speed, so it acts as a centripetal force and the path is a circle."},{"id":"d3-11.1","l":"(b)(i)","m":2,"y":539,"w":580,"h":40,"a":"The magnetic force provides the centripetal force:\nqvB = mv² / r\nr = mv / qB = (1.67 × 10⁻²⁷ × 2.0 × 10⁶) / (1.60 × 10⁻¹⁹ × 0.35)\nr = 0.060 m = 6 cm"},{"id":"d3-11.2","l":"(b)(ii)","m":2,"y":579,"w":608,"h":40,"a":"T = 2πr / v = (2π × 0.060) / 2.0 × 10⁶\n**T = 1.9 × 10⁻⁷ s**\n(Or T = 2πm / qB.)"},{"id":"d3-11.3","l":"(c)","m":2,"y":619,"w":663,"h":40,"a":"- The magnetic force is always perpendicular to the velocity (the displacement) of the proton, so it does no work on the proton.\n- With no work done the speed does not change, so the kinetic energy is constant."}]}]},{"k":"D4","n":"Induction","q":[{"id":"d4-1","t":"Question 1","s":"","W":960,"H":1318,"p":[{"id":"d4-1.0","l":"(a)(i)","m":2,"y":0,"w":960,"h":160,"a":"The magnitude of the induced emf is directly proportional to (equal to) the rate of change of magnetic flux linkage."},{"id":"d4-1.1","l":"(a)(ii)","m":2,"y":160,"w":904,"h":100,"a":"ε = NΔΦ / Δt\nε = induced emf (V)\nN = number of turns on the coil\nΔΦ = change in magnetic flux through the coil (Wb), so NΔΦ is the change in flux linkage\nΔt = time taken for the change (s)"},{"id":"d4-1.2","l":"(b)","m":3,"y":260,"w":947,"h":464,"a":"The **direction** of an induced emf is always set up in a way such that it **opposes** the change in magnetic flux **linkage** that causes it."},{"id":"d4-1.3","l":"(c)","m":1,"y":724,"w":651,"h":41,"a":"ε = −NΔΦ / Δt\nThe negative sign shows that the induced emf opposes the change producing it."},{"id":"d4-1.4","l":"(d)","m":2,"y":765,"w":923,"h":553,"a":"Any two of:\n- Move the coil towards or away from the solenoid (or move the solenoid).\n- Rotate or tilt the coil.\n- Change the current in the solenoid, for example switch it on or off, vary it, or use an alternating supply.\n- Push an iron core into or pull it out of the solenoid.\nEach one changes the magnetic flux linkage through the coil."}]},{"id":"d4-2","t":"Question 2","s":"","W":930,"H":1069,"p":[{"id":"d4-2.0","l":"(a)(i)","m":2,"y":0,"w":305,"h":41,"a":"Magnetic flux is the product of the magnetic flux density and the area perpendicular to the field through which it passes.\nΦ = BA"},{"id":"d4-2.1","l":"(a)(ii)","m":1,"y":41,"w":899,"h":67,"a":"**Φ = BA cos θ**\nθ is the angle between the magnetic field and the normal to the area."},{"id":"d4-2.2","l":"(b)","m":3,"y":108,"w":930,"h":684,"a":"Φ = BA = 80 × 10⁻³ × 0.1\n**Φ = 8.0 × 10⁻³ Wb**"},{"id":"d4-2.3","l":"(c)(i)","m":1,"y":792,"w":929,"h":133,"a":"Magnetic flux linkage is the product of the magnetic flux through the coil and the number of turns on the coil: NΦ."},{"id":"d4-2.4","l":"(c)(ii)","m":2,"y":925,"w":826,"h":41,"a":"Initial flux linkage = NΦ = 500 × 8.0 × 10⁻³ = 4.0 Wb\nAfter rotating through 90° the plane of the coil is parallel to the field, so the flux linkage is zero.\n**Change in flux linkage = 4.0 Wb** (Wb turns)"},{"id":"d4-2.5","l":"(d)","m":3,"y":966,"w":868,"h":103,"a":"ε = Δ(NΦ) / Δt = 4.0 / 300 × 10⁻³\n**ε = 13 V**"}]},{"id":"d4-3","t":"Question 3","s":"","W":963,"H":3262,"p":[{"id":"d4-3.0","l":"(a)","m":4,"y":0,"w":963,"h":693,"a":"magnetic flux: symbol Φ, unit **Wb**\nmagnetic flux linkage: symbol **NΦ**, unit Wb (Wb turns)\nelectromotive force: symbol **ε**, unit **V**\n**magnetic flux density**: symbol B, unit **T**"},{"id":"d4-3.1","l":"(b)(i)","m":1,"y":693,"w":904,"h":999,"a":"The needle points **straight up at zero** (the centre). There is no change in flux linkage while the magnet is at rest, so no emf is induced."},{"id":"d4-3.2","l":"(b)(ii)","m":3,"y":1692,"w":904,"h":312,"a":"The needle deflects to the **left** (the opposite direction), and by a **larger angle** than in Fig. 1.1b.\nRemoving the magnet reverses the change in flux linkage, so the emf is reversed. The change happens in a shorter time, so the rate of change of flux linkage, and the emf, is greater."},{"id":"d4-3.3","l":"(c)(i)","m":1,"y":2004,"w":904,"h":952,"a":"The moving magnet changes the magnetic flux linkage through the coil, and by Faraday's law a changing flux linkage induces an emf."},{"id":"d4-3.4","l":"(c)(ii)","m":2,"y":2956,"w":904,"h":101,"a":"- The induced emf is proportional to the rate of change of flux linkage.\n- This rate is not constant: the field is stronger nearer the magnet, and the magnet is momentarily at rest each time it changes direction. The emf is greatest when the flux linkage is changing fastest and zero when the magnet reverses."},{"id":"d4-3.5","l":"(c)(iii)","m":2,"y":3057,"w":904,"h":101,"a":"- When the magnet moves towards the coil the flux linkage increases, and when it moves away the flux linkage decreases.\n- The emf is proportional to the rate of change of flux linkage, so reversing the change reverses the direction of the emf (Lenz's law)."},{"id":"d4-3.6","l":"(d)","m":3,"y":3158,"w":933,"h":104,"a":"ε = Δ(NΦ) / Δt\nΔ(NΦ) = εΔt = 1.5 × 10⁻³ × 2.0\n**Δ(NΦ) = 3.0 × 10⁻³ Wb**"}]},{"id":"d4-4","t":"Question 4","s":"","W":960,"H":1158,"p":[{"id":"d4-4.0","l":"(a)(i)","m":2,"y":0,"w":960,"h":100,"a":"Magnetic flux is the product of the magnetic flux density and the area through which the field passes, where the area is perpendicular to the field (Φ = BA cos θ)."},{"id":"d4-4.1","l":"(a)(ii)","m":2,"y":100,"w":904,"h":102,"a":"The induced emf is directly proportional to the rate of change of magnetic flux linkage."},{"id":"d4-4.2","l":"(b)","m":2,"y":202,"w":901,"h":854,"a":"Reversing the current reverses the flux, so the change in flux is twice the original flux.\nΔΦ = 2 × 6.8 × 10⁻⁶ × 3.5 = 4.76 × 10⁻⁵ Wb\nε = NΔΦ / Δt = (96 × 4.76 × 10⁻⁵) / 2.4 × 10⁻³\n**ε = 1.9 V**"},{"id":"d4-4.3","l":"(c)","m":2,"y":1056,"w":800,"h":102,"a":"- The emf is **alternating (sinusoidal)**, with the **same frequency** as the supply.\n- It is 90° out of phase with the current: the emf is a maximum when the current is changing fastest (passing through zero) and zero when the current is at its peak."}]},{"id":"d4-5","t":"Question 5","s":"","W":938,"H":824,"p":[{"id":"d4-5.0","l":"(a)","m":1,"y":0,"w":938,"h":583,"a":"The flux density B is the same for both, because the smaller solenoid is inside the uniform field of the larger one.\nΦ = BA, so the flux in the larger solenoid is 7.8 / 1.2 = **6.5 times greater** than in the smaller solenoid."},{"id":"d4-5.1","l":"(b)","m":1,"y":583,"w":598,"h":41,"a":"Flux linkage = NBA.\nLarger: 800 × 7.8 × 10⁻³ × B = 6.24B. Smaller: 2000 × 1.2 × 10⁻³ × B = 2.40B\nThe flux linkage in the larger solenoid is **2.6 times greater**."},{"id":"d4-5.2","l":"(c)","m":2,"y":624,"w":503,"h":41,"a":"The direction of an induced emf (or current) is such that its effects oppose the change in magnetic flux linkage that produced it."},{"id":"d4-5.3","l":"(d)","m":3,"y":665,"w":925,"h":159,"a":"- As the smaller solenoid is removed, the magnetic flux linkage through it decreases, so an emf is induced in it.\n- Its terminals are connected, so there is a complete circuit and an induced current flows. This current produces its own magnetic field.\n- By Lenz's law this field opposes the change: it is in the same direction as the field of the larger solenoid, so the solenoids attract. A force is needed to overcome this attraction, and the work done becomes electrical (then thermal) energy."}]},{"id":"d4-6","t":"Question 6","s":"","W":943,"H":1615,"p":[{"id":"d4-6.0","l":"(a)","m":2,"y":0,"w":355,"h":41,"a":"Magnetic flux linkage is the product of the magnetic flux through a coil and the number of turns on the coil, NΦ.\nThe magnetic flux is the product of the flux density and the area perpendicular to the field, so flux linkage = NBA."},{"id":"d4-6.1","l":"(b)","m":3,"y":41,"w":932,"h":1178,"a":"At t = 0.30 s, B = 200 mT = 0.200 T.\nArea A = 0.10 × 0.10 = 0.010 m²\nNΦ = NBA = 5 × 0.200 × 0.010\n**NΦ = 0.010 Wb** (Wb turns)"},{"id":"d4-6.2","l":"(c)(i)","m":1,"y":1219,"w":943,"h":130,"a":"The graph is a straight line, so its gradient is constant. The flux density, and so the flux linkage, changes at a constant rate, and the emf equals the rate of change of flux linkage."},{"id":"d4-6.3","l":"(c)(ii)","m":2,"y":1349,"w":904,"h":102,"a":"ε = Δ(NΦ) / Δt = 0.010 / 0.30\n**ε = 0.033 V** (33 mV)"},{"id":"d4-6.4","l":"(d)","m":3,"y":1451,"w":887,"h":164,"a":"- The coil is now a complete circuit, so the induced emf drives a **current** in the coil.\n- By Lenz's law the current produces a magnetic field that opposes the increase in flux: its field is out of the page inside the coil, so the current is anticlockwise.\n- The coil heats up as energy is dissipated in its resistance (and the sides of the coil experience inward forces, tending to reduce its area)."}]},{"id":"d4-7","t":"Question 7","s":"","W":939,"H":2028,"p":[{"id":"d4-7.0","l":"(a)","m":6,"y":0,"w":902,"h":1318,"a":"**Left hand diagram (magnet approaching) is correct.**\n- The flux linkage through the coil is increasing, so an emf and current are induced (Faraday's law).\n- By Lenz's law the coil must oppose the approaching S pole, so the top of the coil becomes an S pole to repel it, as the student has drawn.\n**Right hand diagram (magnet leaving) is incorrect.**\n- The flux linkage is now decreasing, so the induced emf and current reverse. The student's ammeter correctly deflects the other way.\n- But the poles are wrong. To oppose the magnet leaving, the bottom of the coil must attract the magnet's N pole, so the bottom should be an S pole and the top an N pole. The student has left the poles (and current arrows) unchanged, which would repel the magnet and speed it up, contradicting Lenz's law and conservation of energy.\n- The magnet is moving faster when it leaves, so the rate of change of flux linkage is greater and the second deflection should be larger."},{"id":"d4-7.1","l":"(b)","m":3,"y":1318,"w":939,"h":638,"a":"- A pulse of emf in one direction as the magnet enters the coil, returning to **zero** when the magnet is in the middle.\n- A second pulse in the **opposite direction** as the magnet leaves.\n- The second pulse has a **larger peak and a shorter duration**, because the magnet is accelerating. (The areas under the two pulses are equal.)"},{"id":"d4-7.2","l":"(c)","m":3,"y":1956,"w":902,"h":72,"a":"**Zero.**\nWhen the magnet is midway, the flux linkage through the coil is at its maximum and is momentarily not changing (as much flux is entering the coil as is leaving it). By Faraday's law the emf equals the rate of change of flux linkage, which is zero at this instant."}]},{"id":"d4-8","t":"Question 8","s":"","W":931,"H":2266,"p":[{"id":"d4-8.0","l":"(a)","m":5,"y":0,"w":931,"h":718,"a":"- As each ring enters (and leaves) the field, the magnetic flux through it changes, so an emf is induced in both rings.\n- A is a complete ring, so an induced current flows around it.\n- By Lenz's law this current is in a direction that opposes the change: the current in the field experiences an upward magnetic force opposing the motion. A falls with an acceleration less than g, and some of its energy is dissipated as heat.\n- B has a slit, so the circuit is incomplete and no current can flow around it. There is no opposing force.\n- B falls freely with acceleration g and reaches the bottom before A."},{"id":"d4-8.1","l":"(b)","m":5,"y":718,"w":912,"h":840,"a":"The emf is the negative of the gradient of the flux linkage graph (ε = −ΔNΦ / Δt).\n- From 0 to t₁: flux linkage **zero** (or constant), because ε = 0.\n- From t₁ to t₂: a **straight line with constant positive gradient**, because ε is constant and negative.\n- From t₂ to t₃: **constant** at the maximum value (horizontal line), because ε = 0.\n- From t₃ to t₄: a **straight line with constant negative gradient** of the same size, because ε is positive with the same magnitude.\n- The line returns to **zero at t₄**, since the two time intervals are equal."},{"id":"d4-8.2","l":"(c)","m":2,"y":1558,"w":927,"h":708,"a":"- An emf is only induced when the magnetic flux linkage through the coil changes (Faraday's law). Between t₂ and t₃ the whole coil is inside the uniform field, so the flux through it is constant: as much flux enters at the leading edge as leaves at the trailing edge.\n- Emfs are induced in both the leading and trailing sides as they cut field lines, but they are equal and act in opposite senses around the loop, so they cancel and the net emf is zero."}]},{"id":"d3-10","t":"Question 9: Square loop","s":"","W":1000,"H":1371,"p":[{"id":"d3-10.0","l":"(a)","m":1,"y":0,"w":1000,"h":435,"a":"The loop enters at t = 0 and has completely left at t = 3.5 s, so it travels the length of the field plus its own length.\ndistance = 65 + 5.0 = 70 cm\nv = 70 / 3.5 = 20 cm s⁻¹"},{"id":"d3-10.1","l":"(b)(i)","m":1,"y":435,"w":957,"h":357,"a":"The loop takes 5.0 / 20 = 0.25 s to enter and 0.25 s to leave.\n- **Linear increase from zero** between t = 0 and t = 0.25 s.\n- **Constant** maximum value from 0.25 s to 3.25 s.\n- **Linear decrease to zero** between 3.25 s and 3.50 s."},{"id":"d3-10.2","l":"(b)(ii)","m":1,"y":792,"w":945,"h":338,"a":"The emf is the rate of change of flux linkage (the gradient of the previous graph).\n- A **constant non zero** value from t = 0 to 0.25 s.\n- **Zero** from 0.25 s to 3.25 s.\n- The **same constant magnitude** from 3.25 s to 3.50 s."},{"id":"d3-10.3","l":"(c)(i)","m":2,"y":1130,"w":1000,"h":39,"a":"ε = NBLv = 85 × 0.94 × 0.050 × 0.20\n**ε = 0.80 V**\n(Or: maximum flux linkage = NBA = 85 × 0.94 × 0.050² = 0.20 Wb, changing in 0.25 s.)"},{"id":"d3-10.4","l":"(c)(ii)","m":2,"y":1169,"w":955,"h":90,"a":"I = ε / R = 0.80 / 2.4 = 0.33 A\nThe force acts on the side of the loop that is inside the field (N turns):\nF = NBIL = 85 × 0.94 × 0.33 × 0.050\n**F = 1.3 N**"},{"id":"d3-10.5","l":"(d)(i)","m":2,"y":1259,"w":846,"h":40,"a":"Energy is only dissipated while there is a current, which is for 0.25 s on entering and 0.25 s on leaving: t = 0.50 s.\nP = ε² / R = 0.80² / 2.4 = 0.266 W\nE = Pt = 0.266 × 0.50 = 0.13 J"},{"id":"d3-10.6","l":"(d)(ii)","m":2,"y":1299,"w":1000,"h":72,"a":"E = mcΔT\nΔT = 0.13 / (0.018 × 385)\n**ΔT = 0.019 K** (about 0.02 K)"}]}]}]},{"k":"+","n":"Tools","units":[{"k":"Tools","n":"Vectors, units and uncertainties","q":[{"id":"a1-1","t":"Question 1","s":"","W":266,"H":230,"p":[{"id":"a1-1.0","l":"","m":1,"y":0,"w":266,"h":230,"a":"**A**\nA vector has both magnitude and direction. Electric field strength is force per unit charge, so it has the direction of the force on a positive charge. Energy, mass and temperature have magnitude only."}]},{"id":"a1-2","t":"Question 2","s":"","W":537,"H":234,"p":[{"id":"a1-2.0","l":"","m":1,"y":0,"w":537,"h":234,"a":"**B**\nMass is the quantity of matter in an object. Weight is the gravitational force on that mass, and density is mass per unit volume."}]},{"id":"a1-3","t":"Question 3","s":"","W":822,"H":285,"p":[{"id":"a1-3.0","l":"","m":1,"y":0,"w":822,"h":285,"a":"**A**\nMass and energy are scalars. Weight (a force) and acceleration are vectors.\nB fails because gravitational field strength is a vector. C fails because momentum is a vector and distance is a scalar. D fails because temperature is a scalar."}]},{"id":"a1-4","t":"Question 4","s":"","W":613,"H":164,"p":[{"id":"a1-4.0","l":"","m":1,"y":0,"w":613,"h":164,"a":"**C**\nMass, density and energy have magnitude only, so they are scalars. Momentum (p = mv) takes the direction of the velocity, so it is a vector. Three scalars."}]},{"id":"a1-5","t":"Question 5","s":"","W":339,"H":235,"p":[{"id":"a1-5.0","l":"","m":1,"y":0,"w":339,"h":235,"a":"**C**\nTime has magnitude only. Acceleration, force and velocity all have a direction."}]},{"id":"a1-6","t":"Question 6","s":"","W":266,"H":234,"p":[{"id":"a1-6.0","l":"","m":1,"y":0,"w":266,"h":234,"a":"**D**\nWeight is a force (W = mg) acting towards the centre of the Earth, so it is a vector. Density, mass and pressure are scalars."}]},{"id":"a1-7","t":"Question 7","s":"","W":634,"H":242,"p":[{"id":"a1-7.0","l":"","m":1,"y":0,"w":634,"h":242,"a":"**B**\nForce and velocity are vectors. Distance and mass are scalars. That is two of each.\nA has three scalars and one vector. C has three scalars and one vector. D has three vectors and one scalar."}]},{"id":"a1-8","t":"Question 8","s":"","W":515,"H":275,"p":[{"id":"a1-8.0","l":"","m":1,"y":0,"w":515,"h":275,"a":"**B**\nIntensity = power / area.\nPower has units J s⁻¹ = kg m² s⁻³.\nIntensity units = kg m² s⁻³ / m² = **kg s⁻³**."}]},{"id":"a1-10","t":"Question 9","s":"","W":552,"H":480,"p":[{"id":"a1-10.0","l":"","m":1,"y":0,"w":552,"h":480,"a":"**D**\nv_{X} − v_{Y} = v_{X} + (−v_{Y}).\nv_{X} points up and to the right. v_{Y} points up and to the left, so −v_{Y} points down and to the right.\nAdding them, the vertical components cancel and the horizontal components add, giving a vector pointing to the right."}]},{"id":"a1-12","t":"Question 10","s":"","W":866,"H":1211,"p":[{"id":"a1-12.0","l":"(a)","m":1,"y":0,"w":866,"h":442,"a":"Ticks next to **charge** and **power** only.\nAcceleration, momentum and upthrust (a force) are vectors."},{"id":"a1-12.1","l":"(b)(i)","m":1,"y":442,"w":856,"h":565,"a":"D: (0.1 / 26.2) × 100 = **0.4%** (0.38%)\nL: (1 / 162) × 100 = **0.6%** (0.62%)"},{"id":"a1-12.2","l":"(b)(ii)","m":2,"y":1007,"w":819,"h":103,"a":"Convert to SI units: M = 0.247 kg, D = 0.0262 m, L = 0.162 m.\nρ = 4M / (πD²L) = (4 × 0.247) / (π × 0.0262² × 0.162)\n**ρ = 2830 kg m⁻³**"},{"id":"a1-12.3","l":"(b)(iii)","m":2,"y":1110,"w":824,"h":101,"a":"Percentage uncertainties add, and the power of 2 doubles the uncertainty in D.\n% uncertainty in ρ = %M + 2 × %D + %L\n= 0.4 + 2 × 0.38 + 0.62\n**= 1.8%**"}]},{"id":"a1-14","t":"Question 11","s":"","W":904,"H":574,"p":[{"id":"a1-14.0","l":"(a)","m":2,"y":0,"w":904,"h":320,"a":"**Systematic errors:** every reading is shifted by the same amount in the same direction, so the mean differs from the true value (for example a zero error on the micrometer). Repeating readings does not remove it.\n**Random errors:** readings are scattered above and below the true value by different amounts (for example the wire is not perfectly uniform, or the ratchet is tightened differently each time). Repeating and averaging reduces the effect."},{"id":"a1-14.1","l":"(b)","m":2,"y":320,"w":894,"h":254,"a":"**Precision:** how close repeated readings are to each other, so a small spread or range of values. It depends on the smallest division of the instrument.\n**Accuracy:** how close the measured value is to the true value of the diameter."}]},{"id":"a1-15","t":"Question 12","s":"","W":852,"H":1064,"p":[{"id":"a1-15.0","l":"(a)","m":2,"y":0,"w":852,"h":279,"a":"**Scalar:** a quantity that has magnitude only.\n**Vector:** a quantity that has both magnitude and direction."},{"id":"a1-15.1","l":"(b)","m":2,"y":279,"w":842,"h":273,"a":"power: scalar\ntemperature: scalar\nmomentum: vector"},{"id":"a1-15.2","l":"(c)(i)","m":1,"y":552,"w":844,"h":411,"a":"The wind blows from the south east towards the north west, so it adds a small northward component to the westward velocity.\nDraw R from the junction pointing to the left and slightly upwards, between west and the wind direction, at about 13° north of west."},{"id":"a1-15.3","l":"(c)(ii)","m":2,"y":963,"w":795,"h":101,"a":"The angle between the two velocity vectors is 65°. Using the cosine rule on the vector triangle (the angle inside the triangle is 180° − 65° = 115°):\nR² = 95² + 28² − 2 × 95 × 28 × cos 115°\nR² = 9025 + 784 + 2248 = 12 057\n**R = 110 m s⁻¹**\n(Alternative: resolve. West component = 95 + 28 cos 65° = 106.8, north component = 28 sin 65° = 25.4, R = √(106.8² + 25.4²) = 110 m s⁻¹.)"}]},{"id":"a1-17","t":"Question 13","s":"","W":902,"H":598,"p":[{"id":"a1-17.0","l":"","m":1,"y":0,"w":902,"h":598,"a":"**B**\nXY and XZ are perpendicular, so the components form a right angled triangle with the 5 m s⁻¹ velocity as the hypotenuse.\n5² = 4² + v²\nv = √(25 − 16) = **3 m s⁻¹**"}]},{"id":"a1-19","t":"Question 14","s":"","W":898,"H":1240,"p":[{"id":"a1-19.0","l":"(a)(i)","m":2,"y":0,"w":898,"h":232,"a":"A scalar quantity has magnitude only.\nA vector quantity has both magnitude and direction."},{"id":"a1-19.1","l":"(a)(ii)","m":3,"y":232,"w":847,"h":346,"a":"1. temperature: **scalar**\n2. acceleration of free fall: **vector**\n3. electrical resistance: **scalar**"},{"id":"a1-19.2","l":"(b)","m":3,"y":578,"w":805,"h":662,"a":"R is at 35° to the vertical, so the slope is at 35° to the horizontal.\nThe block is in equilibrium. Resolving along the slope:\nT = component of weight down the slope = 25 sin 35°\n**T = 14 N** (14.3 N)\n(R is perpendicular to the slope so it has no component along it. A scale drawing of the closed triangle of forces gives the same value.)"}]},{"id":"a1-20","t":"Question 15","s":"","W":899,"H":1134,"p":[{"id":"a1-20.0","l":"(a)(i)","m":1,"y":0,"w":899,"h":399,"a":"% uncertainty in T = (0.03 / 1.93) × 100\n**= 1.6%**"},{"id":"a1-20.1","l":"(a)(ii)","m":1,"y":399,"w":847,"h":103,"a":"% uncertainty in L = (1 / 92) × 100\n**= 1.1%**"},{"id":"a1-20.2","l":"(b)","m":1,"y":502,"w":887,"h":230,"a":"% uncertainty in g = %L + 2 × %T (T is squared, so its uncertainty is doubled)\n= 1.1 + 2 × 1.6\n**= 4.2%** (accept 4.3%)"},{"id":"a1-20.3","l":"(c)(i)","m":1,"y":732,"w":887,"h":220,"a":"L is only known to 2 significant figures and T to 3, so g cannot be quoted to 4 significant figures. The uncertainty in g is about ±0.4 m s⁻², so the second and later decimal places are meaningless."},{"id":"a1-20.4","l":"(c)(ii)","m":2,"y":952,"w":849,"h":182,"a":"Absolute uncertainty = 4.2% of 9.751 = 0.042 × 9.751 = 0.41 m s⁻²\nQuote the uncertainty to 1 significant figure and g to the same decimal place:\n**g = 9.8 ± 0.4 m s⁻²**"}]}]}]}],"total":606};
// Condensed revision notes, written from the Revision Dojo cheat sheet topics and the 2025 guide.
// Each section: h = heading, b = bullets, t = exam tip (optional). Markup: **bold**, _{sub}, ^{sup}.
const NOTES={
A1:[
{h:'Distance, displacement, speed, velocity',b:['Distance is the total path length (scalar). Displacement is the straight line change in position from start to finish (vector).','Speed is the rate of change of distance. Velocity is the rate of change of displacement, so it carries a sign or direction.','Displacement can be zero when distance is not, for example after one full lap of a track.','Average velocity = total displacement ÷ total time. Instantaneous velocity = gradient of the tangent on a displacement–time graph.'],t:'Constant speed in a circle still means changing velocity, because the direction keeps changing.'},
{h:'Acceleration',b:['Acceleration is the rate of change of velocity.','A negative acceleration means slowing down while moving in the positive direction, or speeding up in the negative direction.','Uniform acceleration lets you use the suvat equations. Non-uniform acceleration needs graphs.']},
{h:'Motion graphs',b:['**Displacement–time:** gradient = velocity. A flat line means stationary, a curve means changing velocity.','**Velocity–time:** gradient = acceleration, area under the graph = displacement.','**Acceleration–time:** area under the graph = change in velocity. A flat line means constant acceleration.'],t:'Gradient means rate of change and area means accumulated change. Every motion graph question uses one of these two ideas.'},
{h:'Equations of motion (suvat)',b:['Only valid when acceleration is constant.','Pick the equation that contains the three quantities you know and the one you want, and leaves out the one you don\'t care about.','Choose a positive direction at the start and keep every vector consistent with it, for example taking g as −9.81 m s^{−2} when up is positive.']},
{h:'Projectile motion',b:['Treat horizontal and vertical motion separately. They share only the time of flight.','Horizontal: no force (ignoring air), so constant velocity, u cos θ.','Vertical: constant acceleration g downwards, starting from u sin θ.','At maximum height the vertical velocity is zero but the horizontal velocity is not.','Without air resistance the path is a parabola and the motion is symmetric.'],t:'If the question does not mention air resistance, assume it is negligible.'},
{h:'Fluid resistance and terminal speed',b:['Drag acts opposite to the velocity and increases with speed. It depends on shape, area and fluid density.','With drag: lower maximum height, shorter range, and the descent is steeper than the ascent.','Terminal speed is reached when drag equals weight, so the resultant force and acceleration are zero.']}
],
A2:[
{h:'Newton\'s laws',b:['**First law:** a body stays at rest or moves at constant velocity unless a resultant external force acts on it (inertia).','**Second law:** resultant force = rate of change of momentum, F = Δp/Δt. For constant mass this is F = ma, with a in the direction of the resultant force.','**Third law:** if A pushes on B, B pushes on A with a force equal in size, opposite in direction, of the same type, acting on a different body.'],t:'Third law pairs never act on the same object, so they never cancel each other in a free body diagram.'},
{h:'Free body diagrams',b:['Isolate one object and draw only the external forces on it, as labelled arrows from the object.','Arrow length shows relative size. Do not draw "centripetal force" as an extra force.','On a slope: weight straight down, normal force perpendicular to the surface, friction along the surface opposing motion. Resolve weight into mg sin θ (along) and mg cos θ (into the slope).']},
{h:'Contact and field forces',b:['**Normal force:** perpendicular to the surface.','**Friction:** opposes relative motion. Static friction can take any value up to μ_{s}F_{N}. Once sliding, dynamic friction is μ_{d}F_{N}.','**Tension:** along the string, pulling away from the object.','**Elastic (Hooke):** F_{H} = −kx, restoring the object towards equilibrium.','**Viscous drag** on a small sphere: Stokes\' law F_{d} = 6πηrv.','**Buoyancy:** upthrust equals the weight of fluid displaced, F_{b} = ρVg.','**Field forces:** gravitational (mg), electric and magnetic.']},
{h:'Momentum and impulse',b:['Momentum p = mv is a vector.','Impulse J = FΔt = Δp. For a varying force, impulse = area under the force–time graph.','Total momentum is conserved whenever no resultant external force acts.'],t:'A rebound reverses the velocity, so Δp is bigger than for simply stopping. Watch the signs.'},
{h:'Collisions and explosions',b:['**Elastic:** momentum and kinetic energy both conserved.','**Inelastic:** momentum conserved, kinetic energy is not (some becomes heat, sound, deformation).','**Perfectly inelastic:** the bodies stick together, so the loss of kinetic energy is greatest.','**Explosion:** starts from one body, momentum conserved, kinetic energy increases from stored energy.','Useful link: E_{k} = p²/2m.']},
{h:'Circular motion',b:['Uniform circular motion has constant speed but changing velocity, so there is an acceleration towards the centre.','Centripetal acceleration a = v²/r = ω²r = 4π²r/T².','The centripetal force is the resultant inward force. It is provided by something real, such as tension, friction, gravity or the normal force.','It acts perpendicular to the velocity, so it does no work and the speed stays constant.','Angular velocity ω = Δθ/Δt in rad s^{−1}, v = ωr, and one revolution is 2π rad.'],t:'In a vertical circle, the tension or normal force is largest at the bottom: T − mg = mv²/r.'}
],
A3:[
{h:'Work',b:['Work is the energy transferred when a force moves its point of application. W = Fs cos θ, where θ is the angle between force and displacement.','Only the component of force along the displacement does work. A perpendicular force does no work.','Work is a scalar and can be negative, for example friction opposing motion (θ = 180°).','No displacement means no work, however large the force.']},
{h:'Energy stores',b:['**Kinetic:** E_{k} = ½mv² = p²/2m.','**Gravitational (near Earth):** ΔE_{p} = mgΔh, measured from a reference level you choose.','**Elastic:** E_{H} = ½k(Δx)², which is the area under a force–extension graph.','**Work–energy theorem:** the work done by the resultant force equals the change in kinetic energy.']},
{h:'Conservation of energy',b:['Energy is never created or destroyed, only transferred.','Mechanical energy (E_{k} + E_{p} + E_{H}) is only conserved when there is no friction or drag.','Friction and drag convert mechanical energy to thermal energy and sound. The total energy is still conserved.'],t:'For a slope with friction: loss of E_{p} = gain of E_{k} + work done against friction.'},
{h:'Power and efficiency',b:['Power is the rate of doing work: P = ΔW/Δt. For a constant force at constant velocity, P = Fv.','Efficiency = useful output ÷ total input, using energy or power. It is always below 100% in real systems.','At constant velocity the driving force equals the resistive force, so P = (resistive force) × v.']},
{h:'Sankey diagrams',b:['Arrow width is proportional to the energy (or power) in that transfer.','Input on the left, useful output straight on, wasted energy bending away.','Efficiency = useful arrow width ÷ input arrow width.']},
{h:'Energy density',b:['Energy released per unit mass (J kg^{−1}, specific energy) or per unit volume (J m^{−3}) of a fuel.','Petrol has a much higher energy per kilogram than batteries, which is why fuel is used for long range vehicles.']}
],
A4:[
{h:'Torque',b:['Torque is the turning effect of a force: τ = Fr sin θ, where r is the distance from the axis and θ the angle between r and F.','Maximum torque when the force is perpendicular to the lever arm. Zero when the force acts along it.','Unit: N m.']},
{h:'Equilibrium',b:['Translational equilibrium: resultant force ΣF = 0.','Rotational equilibrium: resultant torque Στ = 0, so clockwise moments = anticlockwise moments about any point.','A rigid body in equilibrium needs both.'],t:'Take moments about the point with the unknown force you do not need, so it drops out of the equation.'},
{h:'Rotational motion',b:['Angular displacement θ (rad), angular velocity ω (rad s^{−1}) and angular acceleration α (rad s^{−2}) are the rotational versions of s, v and a.','For constant α, the rotational equations of motion match suvat exactly.','Link to linear motion at radius r: s = rθ, v = ωr, a = αr.']},
{h:'Moment of inertia',b:['Moment of inertia is the rotational equivalent of mass: resistance to angular acceleration.','It depends on the total mass and on how far that mass is from the axis. For point masses I = Σmr².','The same body has a different I about a different axis. Mass further out means a larger I.']},
{h:'Newton\'s second law for rotation',b:['τ = Iα. A larger torque gives a larger angular acceleration, and a larger I gives a smaller one.','For a string wound round a pulley or cylinder, write F = ma for the hanging mass and τ = Iα for the cylinder, then link them with a = αr.']},
{h:'Rotational kinetic energy and rolling',b:['E_{k} = ½Iω² = L²/2I.','A body rolling without slipping has both translational and rotational kinetic energy, with v = ωr.','Rolling down a slope: mgh = ½mv² + ½Iω². Objects with a larger I for their mass (hoops) reach the bottom more slowly than solid spheres.']},
{h:'Angular momentum',b:['Angular momentum L = Iω.','L is conserved when no external torque acts. If I decreases, ω increases (a skater pulling their arms in).','Angular impulse: ΔL = τΔt, the area under a torque–time graph.'],t:'When I changes, angular momentum is conserved but rotational kinetic energy usually is not. Work is done by or on the system.'}
],
B1:[
{h:'States of matter',b:['**Solids:** particles vibrate about fixed positions, strong forces, fixed shape and volume.','**Liquids:** particles close together but can move past each other, fixed volume but no fixed shape.','**Gases:** particles far apart, moving randomly, negligible forces, no fixed shape or volume.','Density ρ = m/V.']},
{h:'Temperature and internal energy',b:['Kelvin temperature is a measure of the average random kinetic energy of the particles: E_{k} = (3/2)k_{B}T.','T(K) = θ(°C) + 273. A temperature change has the same value in K and °C.','Internal energy = total random kinetic energy + total intermolecular potential energy of the particles.','Temperature difference decides which way thermal energy flows.'],t:'Temperature and internal energy are not the same. A bath of warm water has more internal energy than a hot cup of tea.'},
{h:'Specific heat and latent heat',b:['Heating without a change of state: Q = mcΔT, where c is the specific heat capacity.','Change of state at constant temperature: Q = mL, where L is the specific latent heat.','During a phase change the energy goes into intermolecular potential energy, so the average kinetic energy and temperature stay constant.','Latent heat of vaporization is larger than of fusion, because particles must be separated completely.'],t:'In mixing problems: energy lost by the hot body = energy gained by the cold body. Include every stage (warming the ice, melting it, warming the melt water).'},
{h:'Conduction, convection, radiation',b:['**Conduction:** energy passed by particle collisions (and free electrons in metals). Rate ΔQ/Δt = kA ΔT/Δx.','**Convection:** bulk movement of a fluid caused by density differences. Warm fluid rises, cool fluid sinks. Not possible in solids.','**Radiation:** emission of electromagnetic waves. Needs no medium, so it is the only way energy crosses space.']},
{h:'Black body radiation',b:['A black body absorbs all radiation that hits it and is the best possible emitter at its temperature.','Stefan–Boltzmann law: L = σAT⁴, where L is the luminosity (total power emitted).','Wien\'s law: λ_{max}T = 2.9 × 10^{−3} m K. Hotter bodies peak at shorter wavelengths, which is how star temperatures are found.']},
{h:'Luminosity and apparent brightness',b:['Luminosity L is the total power a body emits. It is intrinsic.','Apparent brightness b is the power received per unit area at a distance d: b = L/4πd².','Brightness follows an inverse square law: doubling the distance quarters the brightness.']},
{h:'Solar constant',b:['The solar constant S is the intensity of the Sun\'s radiation at Earth\'s mean distance from the Sun, at the top of the atmosphere, on a surface facing the Sun. S = 1.36 × 10^{3} W m^{−2} (given in the data booklet constants).','It is the apparent brightness of the Sun seen from Earth: S = L_{☉}/4πd², with L_{☉} ≈ 3.8 × 10^{26} W and d = 1 AU = 1.50 × 10^{11} m.','Earth catches sunlight over a disc of area πR² but spreads it over its whole surface of area 4πR², so the mean incoming intensity is S/4 ≈ 340 W m^{−2}.','Mean intensity absorbed = (1 − α) × S/4, where α is the albedo. This feeds into the B2 energy balance.','A planet at distance d from the Sun receives S × (1 AU / d)², by the inverse square law.'],t:'S is the value at the top of the atmosphere on a surface facing the Sun. Divide by 4 whenever the question wants the average over the whole planet.'}
],
B2:[
{h:'Energy balance',b:['Earth\'s temperature settles where incoming solar power absorbed = outgoing thermal power emitted.','The equilibrium temperature of a planet comes from setting these equal.']},
{h:'Emissivity and albedo',b:['**Emissivity** e = power radiated per unit area ÷ σT⁴. A black body has e = 1, real surfaces 0 < e < 1.','**Albedo** = total scattered (reflected) power ÷ total incident power. 0 means everything absorbed, 1 means everything reflected.','Snow and ice have high albedo. Oceans and forests have low albedo. Earth\'s albedo is about 0.3 and varies with cloud cover and latitude.']},
{h:'Solar constant',b:['The solar constant S ≈ 1360 W m^{−2} is the intensity of sunlight at Earth\'s distance, at the top of the atmosphere.','Earth intercepts sunlight over a disc of area πR² but spreads it over a sphere of area 4πR², so the mean incoming intensity is S/4.','Power absorbed per square metre on average = (1 − albedo) × S/4.'],t:'The solar constant is the top of atmosphere value, not what reaches the ground.'},
{h:'Greenhouse gases',b:['The main greenhouse gases are CO_{2}, CH_{4}, H_{2}O and N_{2}O, from both natural sources and human activity.','They let short wavelength sunlight through but absorb the long wavelength infrared emitted by the surface.','Absorption happens because the infrared frequency matches the natural frequency of the molecules\' vibrations (resonance), or the gaps between their energy levels.','The gas then re-emits infrared in all directions, so some returns to the surface.','N_{2} and O_{2} do not absorb infrared, because their vibrations do not change the molecule\'s dipole.']},
{h:'Natural and enhanced greenhouse effect',b:['The natural greenhouse effect keeps the mean surface temperature near 288 K instead of about 255 K.','The enhanced greenhouse effect is the extra warming caused by human activity raising greenhouse gas concentrations, mainly by burning fossil fuels.','Feedback: melting ice lowers albedo, so more radiation is absorbed and warming increases.']}
],
B3:[
{h:'Pressure and the mole',b:['Pressure P = F/A, with F perpendicular to the surface. Unit: Pa = N m^{−2}.','Amount of substance n = N/N_{A}, where N_{A} = 6.02 × 10^{23} mol^{−1}.','Molar mass in g mol^{−1} gives the mass of one mole.']},
{h:'Gas laws',b:['For a fixed mass of ideal gas, PV/T = constant.','**Boyle (constant T):** P ∝ 1/V. **Charles (constant P):** V ∝ T. **Gay-Lussac (constant V):** P ∝ T.','Ideal gas equation: PV = nRT = Nk_{B}T.'],t:'Always convert to kelvin before using any gas law.'},
{h:'Kinetic model of an ideal gas',b:['Assumptions: point particles, random motion, elastic collisions, no intermolecular forces except during collisions, collisions take negligible time.','Pressure arises because molecules change momentum when they bounce off the walls. Many collisions per second give a steady force per unit area.','More molecules per unit volume, or faster molecules, means more frequent and harder collisions, so higher pressure.','P = ⅓ρ⟨c²⟩, where ⟨c²⟩ is the mean square speed.']},
{h:'Internal energy of an ideal gas',b:['An ideal gas has no intermolecular forces, so no potential energy. Its internal energy is all random kinetic energy.','U = (3/2)Nk_{B}T = (3/2)nRT for a monatomic ideal gas.','U depends only on temperature: double T and U doubles.']},
{h:'Real gases',b:['Real gases behave like ideal gases at high temperature, low pressure and low density.','At high pressure the volume of the molecules matters. At low temperature intermolecular forces matter and the gas can liquefy.']}
],
B4:[
{h:'First law of thermodynamics',b:['Q = ΔU + W, which is conservation of energy for a closed system.','Q > 0: thermal energy enters the gas. W > 0: the gas does work (expands). ΔU > 0: temperature rises.','For an ideal gas ΔU = (3/2)Nk_{B}ΔT = (3/2)nRΔT.'],t:'Sign conventions cost marks. Write down which way W is defined before you start.'},
{h:'Work done by a gas',b:['At constant pressure W = PΔV.','In general, work = area under the P–V graph.','Expansion: the gas does work (W > 0). Compression: work is done on the gas (W < 0).']},
{h:'The four processes',b:['**Isovolumetric (isochoric):** V constant, W = 0, so Q = ΔU.','**Isobaric:** P constant, W = PΔV.','**Isothermal:** T constant, ΔU = 0, so Q = W. P–V curve is P ∝ 1/V.','**Adiabatic:** Q = 0, so W = −ΔU. Expansion cools the gas, compression heats it. For a monatomic ideal gas PV^{5/3} = constant (steeper than an isotherm).']},
{h:'Cycles and heat engines',b:['A cycle returns the gas to its starting state, so ΔU = 0 over a cycle and net Q = net W.','Net work in a cycle = area enclosed by the loop on a P–V diagram.','A clockwise loop is a heat engine. An anticlockwise loop is a refrigerator or heat pump.','Efficiency η = useful work out ÷ energy in.']},
{h:'Carnot cycle',b:['The ideal reversible cycle: isothermal expansion at T_{h}, adiabatic expansion, isothermal compression at T_{c}, adiabatic compression.','It sets the maximum possible efficiency: η_{Carnot} = 1 − T_{c}/T_{h}, with temperatures in kelvin.','It depends only on the reservoir temperatures, not on the working substance.']},
{h:'Entropy and the second law',b:['Entropy S measures disorder, the number of ways the particles can be arranged.','Macroscopic: ΔS = ΔQ/T. Microscopic: S = k_{B} ln Ω, where Ω is the number of microstates.','Second law: the total entropy of an isolated system never decreases. Real processes are irreversible, so entropy increases.','Entropy can fall locally (inside a fridge) only if the surroundings gain at least as much.','No engine can turn all its input heat into work: some must be released to a cold reservoir.']}
],
B5:[
{h:'Current and potential difference',b:['Current is the rate of flow of charge: I = Δq/Δt. Unit: A = C s^{−1}. Conventional current flows from + to −.','Potential difference is the work done per unit charge between two points: V = W/q.','Conductors have many mobile charge carriers. Insulators have very few.']},
{h:'Resistance and resistivity',b:['Resistance R = V/I. Unit: Ω.','Resistivity ρ = RA/L depends only on the material and temperature, not the shape. Longer wire means more R, thicker wire means less R.','**Ohm\'s law:** for an ohmic conductor at constant temperature, V ∝ I (a straight V–I line through the origin).','A filament lamp is non-ohmic: as it heats up its resistance increases, so the I–V graph curves.']},
{h:'Power',b:['P = IV = I²R = V²/R. Pick the form that uses the quantities you know.','Energy transferred = Pt = VIt.','Resistors dissipate energy as heat because charge carriers collide with the lattice ions.']},
{h:'Series and parallel',b:['**Series:** same current everywhere. Potential differences add. R_{total} = R_{1} + R_{2} + …','**Parallel:** same potential difference across each branch. Currents add. 1/R_{total} = 1/R_{1} + 1/R_{2} + …','Adding a resistor in parallel always lowers the total resistance.','Ideal ammeter: zero resistance, in series. Ideal voltmeter: infinite resistance, in parallel.']},
{h:'Emf and internal resistance',b:['Emf ε is the energy supplied per unit charge by a source. It is not a force.','A real cell has internal resistance r: ε = I(R + r), so terminal p.d. V = ε − Ir.','As current increases, more p.d. is "lost" inside the cell, so the terminal voltage drops.','The terminal voltage equals the emf only when no current flows.'],t:'To find r experimentally, plot terminal voltage against current: the gradient is −r and the y-intercept is ε.'},
{h:'Variable resistors',b:['**Thermistor (NTC):** resistance falls as temperature rises.','**LDR:** resistance falls as light intensity rises.','**Potentiometer / potential divider:** splits the supply p.d. in the ratio of the resistances, giving a variable output voltage.']},
{h:'Cells',b:['Primary cells cannot be recharged. Secondary cells can.','Chemical cells convert chemical energy to electrical energy. Solar cells convert light to electrical energy.','Capacity is often given in A h (charge = current × time).']}
],
C1:[
{h:'Conditions for SHM',b:['The acceleration (restoring force) is proportional to the displacement from equilibrium and always directed towards equilibrium.','a = −ω²x. The minus sign shows the acceleration opposes the displacement.'],t:'In a "show that it is SHM" question, state both conditions: proportional to x and opposite in direction.'},
{h:'Describing oscillations',b:['Amplitude x_{0}: maximum displacement. Period T: time for one oscillation. Frequency f = 1/T.','Angular frequency ω = 2πf = 2π/T.','For SHM the period does not depend on the amplitude (isochronous).']},
{h:'Mass–spring and pendulum',b:['Mass–spring: T = 2π√(m/k). Heavier mass gives a longer period, stiffer spring a shorter one.','Simple pendulum: T = 2π√(l/g), valid only for small angles (about 10° or less). The mass does not matter.']},
{h:'Graphs of SHM',b:['Displacement, velocity and acceleration are all sinusoidal.','Velocity is a quarter cycle (π/2) ahead of displacement. Acceleration is in antiphase with displacement.','Velocity is maximum at equilibrium and zero at the extremes. Acceleration is maximum at the extremes and zero at equilibrium.']},
{h:'Energy in SHM',b:['Without damping, total energy is constant and swaps between kinetic and potential.','E_{k} is maximum at equilibrium. E_{p} is maximum at the extremes.','E_{k} and E_{p} against displacement are parabolas. Against time they vary at twice the oscillation frequency.']},
{h:'Phase angle and equations (HL)',b:['x = x_{0} sin(ωt + φ) and v = ωx_{0} cos(ωt + φ). The phase angle φ sets the starting point.','Use sine when the motion starts at equilibrium, cosine when it starts at maximum displacement.','v = ±ω√(x_{0}² − x²), so v_{max} = ωx_{0} and a_{max} = ω²x_{0}.','E_{T} = ½mω²x_{0}² and E_{p} = ½mω²x².'],t:'Put your calculator in radians for these equations.'}
],
C2:[
