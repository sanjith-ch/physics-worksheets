 bungs, the thermometer and the surrounding air, and not all of the shot falls through the full distance d each time. The measured Δθ is therefore smaller than Ngd / c predicts, so the calculated value of c is too large."}]},{"id":"b4-18","t":"Question 23","s":"","W":897,"H":665,"p":[{"id":"b4-18.0","l":"","m":4,"y":0,"w":897,"h":665,"a":"Energy the drink must lose to fall to 58.0 °C:\nE = mcΔθ = 0.275 × 3750 × (71.5 − 58.0) = 1.39 × 10⁴ J\nEnergy 4.0 g of ice absorbs in melting and then warming to 58.0 °C:\nE = mL + mcΔθ = (0.0040 × 3.34 × 10⁵) + (0.0040 × 4190 × 58.0) = 1336 + 972 = 2.3 × 10³ J\n2.3 × 10³ J is much less than 1.39 × 10⁴ J, so **4.0 g of ice is not enough**. (The final temperature would be about 69 °C.)"}]},{"id":"b4-19","t":"Question 24","s":"","W":897,"H":1227,"p":[{"id":"b4-19.0","l":"","m":6,"y":0,"w":897,"h":1227,"a":"Mass of chocolate m = ρV = 1325 × 1250 = 1.66 × 10⁶ kg\nEnergy to warm to the melting point = mcΔθ = 1.66 × 10⁶ × 1.30 × 10³ × (36.0 − 28.5) = 1.61 × 10¹⁰ J\nEnergy to melt = mL = 1.66 × 10⁶ × 4.5 × 10⁴ = 7.45 × 10¹⁰ J\nTotal energy = 9.1 × 10¹⁰ J\nTime = E / P = 9.1 × 10¹⁰ / 7.5 × 10⁵ = 1.2 × 10⁵ s = 34 hours\nOne day is 24 hours (8.64 × 10⁴ s), so the palace takes longer than a day to melt. **The statement is not correct.**"}]}]},{"k":"B2","n":"Greenhouse effect","q":[{"id":"b4-11","t":"Question 1","s":"","W":828,"H":870,"p":[{"id":"b4-11.0","l":"(a)","m":3,"y":0,"w":828,"h":556,"a":"Energy to warm the ice to 0 °C = mcΔθ = 3.53 × 10⁵ × 2.09 × 10³ × 18.0 = 1.33 × 10¹⁰ J\nEnergy to melt the ice = mL = 3.53 × 10⁵ × 3.36 × 10⁵ = 1.19 × 10¹¹ J\nTotal = 1.33 × 10¹⁰ + 1.19 × 10¹¹ = 1.32 × 10¹¹ J ≈ **1.3 × 10¹¹ J**"},{"id":"b4-11.1","l":"(b)","m":6,"y":556,"w":815,"h":314,"a":"Intensity reaching the surface = (1 − 0.44) × 1370 = 767 W m⁻²\nSurface area of floe = volume / thickness = 385 / 0.85 = 453 m²\nPower received = intensity × area = 767 × 453 = 3.47 × 10⁵ W\nTime to melt = energy / power = 1.32 × 10¹¹ / 3.47 × 10⁵ = 3.8 × 10⁵ s\nIn days: 3.8 × 10⁵ / 8.64 × 10⁴ = **4.4 days**\nThis is less than 7 days, so **the claim is not correct** (assuming all the radiation reaching the ice is absorbed)."}]}]},{"k":"B3","n":"Gas laws","q":[{"id":"bt-1","t":"Question 1","s":"","W":851,"H":316,"p":[{"id":"bt-1.0","l":"","m":1,"y":0,"w":851,"h":316,"a":"**A**\nThe piston is moving towards the gas. A molecule that collides with the moving piston rebounds with a greater speed than it arrived with (the piston does work on it). The mean kinetic energy of the molecules rises, so the temperature rises.\nB, C and D describe why the pressure rises, not why the temperature rises."}]},{"id":"bt-2","t":"Question 2","s":"","W":717,"H":318,"p":[{"id":"bt-2.0","l":"","m":1,"y":0,"w":717,"h":318,"a":"**B**\nn = mass / molar mass = 0.50 / 4.0 = 0.125 mol\nN = nN_{A} = 0.125 × 6.02 × 10²³ = **7.5 × 10²²**"}]},{"id":"bt-4","t":"Question 3","s":"","W":674,"H":260,"p":[{"id":"bt-4.0","l":"","m":1,"y":0,"w":674,"h":260,"a":"**B**\nThe kinetic model assumes all collisions (with the walls and between particles) are elastic. Particles have a range of speeds, move in random directions, and their momentum changes at every collision."}]},{"id":"bt-7","t":"Question 4","s":"","W":861,"H":353,"p":[{"id":"bt-7.0","l":"","m":1,"y":0,"w":861,"h":353,"a":"**C**\npV = nRT, so at constant temperature the mass of gas is proportional to pV.\nNew pV = 3P × 2V = 6PV, so the new mass = 6 × 10 = 60 mg.\nMass added = 60 − 10 = **50 mg**"}]},{"id":"bt-12","t":"Question 5","s":"","W":903,"H":506,"p":[{"id":"bt-12.0","l":"(a)","m":2,"y":0,"w":903,"h":124,"a":"A gas that obeys pV = nRT (pV / T = constant) at all pressures, volumes and temperatures.\n(Equivalent: a gas with no intermolecular forces except during elastic collisions, so its internal energy is entirely kinetic.)"},{"id":"bt-12.1","l":"(b)(i)","m":3,"y":124,"w":897,"h":137,"a":"p = ⅓ρ⟨c²⟩\n⟨c²⟩ = 3p / ρ = (3 × 1.6 × 10⁵) / 1.9 = 2.53 × 10⁵ m² s⁻²\nc_{rms} = √(2.53 × 10⁵) = 503 m s⁻¹ ≈ **500 m s⁻¹**"},{"id":"bt-12.2","l":"(b)(ii)","m":2,"y":261,"w":858,"h":153,"a":"Mean kinetic energy of a molecule: ½m⟨c²⟩ = (3/2)kT\nT = m⟨c²⟩ / 3k = (4.7 × 10⁻²⁶ × 2.53 × 10⁵) / (3 × 1.38 × 10⁻²³)\n**T = 290 K** (287 K)"},{"id":"bt-12.3","l":"(c)","m":3,"y":414,"w":896,"h":92,"a":"An ideal gas has no intermolecular forces, so it has no potential energy. Its internal energy is the total random kinetic energy of its molecules.\nU = N × (3/2)kT = (3/2)nRT\nU = 1.5 × 6.0 × 8.31 × 287\n**U = 2.1 × 10⁴ J**"}]},{"id":"bt-15","t":"Question 6","s":"","W":899,"H":1451,"p":[{"id":"bt-15.0","l":"(a)(i)","m":1,"y":0,"w":899,"h":126,"a":"The number of particles (atoms or molecules) in one mole of a substance, 6.02 × 10²³ mol⁻¹."},{"id":"bt-15.1","l":"(a)(ii)","m":1,"y":126,"w":860,"h":120,"a":"**k = R / N_{A}**"},{"id":"bt-15.2","l":"(b)(i)","m":4,"y":246,"w":897,"h":672,"a":"Pressure (pV = NkT): X: **NkT / V**. Y: 2NkT / 2V = **NkT / V**\nAmount of substance (n = N / N_{A}): X: **N / N_{A}**. Y: **2N / N_{A}**\nMean square speed (½m⟨c²⟩ = (3/2)kT): X: **3kT / m**. Y: **3kT / 2m**\nInternal energy (N × (3/2)kT): X: **(3/2)NkT**. Y: **3NkT**"},{"id":"bt-15.3","l":"(b)(ii)","m":2,"y":918,"w":859,"h":533,"a":"½m⟨c²⟩ = (3/2)kT, so c_{rms} ∝ √T.\nSketch a **curve starting at the origin** that rises with a **decreasing gradient** (the shape of y = √x). It must not be a straight line and must not level off completely."}]},{"id":"bt-17","t":"Question 7","s":"","W":861,"H":1210,"p":[{"id":"bt-17.0","l":"(a)(i)","m":2,"y":0,"w":861,"h":216,"a":"A gas that obeys pV = nRT (pV ∝ T) for all values of pressure, volume and temperature."},{"id":"bt-17.1","l":"(a)(ii)","m":1,"y":216,"w":819,"h":100,"a":"**−273 °C** (−273.15 °C)"},{"id":"bt-17.2","l":"(b)(i)","m":3,"y":316,"w":855,"h":214,"a":"T = 227 + 273 = 500 K\npV = NkT\nN = pV / kT = (1.37 × 10⁵ × 0.640) / (1.38 × 10⁻²³ × 500)\n**N = 1.27 × 10²⁵**"},{"id":"bt-17.3","l":"(b)(ii)","m":1,"y":530,"w":819,"h":100,"a":"Mass of one molecule = total mass / N = 0.0424 / 1.27 × 10²⁵\n**m = 3.34 × 10⁻²⁷ kg**"},{"id":"bt-17.4","l":"(b)(iii)","m":3,"y":630,"w":824,"h":102,"a":"pV = ⅓Nm⟨c²⟩, where Nm is the total mass of gas (0.0424 kg)\n⟨c²⟩ = 3pV / Nm = (3 × 1.37 × 10⁵ × 0.640) / 0.0424 = 6.20 × 10⁶ m² s⁻²\n**v = 2490 m s⁻¹** (2.5 × 10³ m s⁻¹)\n(Or use ½m⟨c²⟩ = (3/2)kT.)"},{"id":"bt-17.5","l":"(c)","m":2,"y":732,"w":855,"h":478,"a":"v ∝ √T. Sketch a **curve from the origin (0, 0) to the point (500, v)** with a **decreasing gradient**. The speed is zero at absolute zero."}]},{"id":"b4-9","t":"Question 8","s":"","W":715,"H":591,"p":[{"id":"b4-9.0","l":"","m":1,"y":0,"w":715,"h":591,"a":"**A**\nAt constant pressure V ∝ T (in kelvin), so the graph is a straight line through the origin.\nB does not pass through the origin, and C and D are not linear."}]},{"id":"b4-10","t":"Question 9","s":"","W":813,"H":387,"p":[{"id":"b4-10.0","l":"","m":1,"y":0,"w":813,"h":387,"a":"**D**\nAt constant volume p / T = constant, with T in kelvin.\nT₁ = 27 + 273 = 300 K\nT₂ = T₁ × p₂ / p₁ = 300 × 200 / 190 = 315.8 K\nT₂ = 315.8 − 273 = **42.8 °C**"}]},{"id":"b4-14","t":"Question 10","s":"","W":895,"H":946,"p":[{"id":"b4-14.0","l":"(a)","m":3,"y":0,"w":895,"h":543,"a":"T = 25 + 273 = 298 K\npV = NkT\nN = pV / kT = (1.24 × 10⁵ × 7.08 × 10⁻²) / (1.38 × 10⁻²³ × 298)\nN = 2.13 × 10²⁴ ≈ **2 × 10²⁴**"},{"id":"b4-14.1","l":"(b)","m":2,"y":543,"w":891,"h":403,"a":"V and T are constant, so N ∝ p.\nN remaining = 2.13 × 10²⁴ × (3.45 × 10⁴ / 1.24 × 10⁵) = 5.9 × 10²³\nNumber escaped = 2.13 × 10²⁴ − 0.59 × 10²⁴\n**= 1.5 × 10²⁴**"}]},{"id":"b4-16","t":"Question 11","s":"","W":903,"H":941,"p":[{"id":"b4-16.0","l":"(a)","m":3,"y":0,"w":903,"h":488,"a":"T = 20 + 273 = 293 K\npV = NkT\np = NkT / V = (7.5 × 10²⁴ × 1.38 × 10⁻²³ × 293) / 6.0 × 10⁻²\n**p = 5.1 × 10⁵ Pa**"},{"id":"b4-16.1","l":"(b)","m":2,"y":488,"w":897,"h":453,"a":"V is constant, so N ∝ p / T. New temperature = 293 − 5 = 288 K.\nN₂ / N₁ = (p₂ / T₂) ÷ (p₁ / T₁) = (4.50 × 10⁵ / 288) ÷ (5.05 × 10⁵ / 293) = 0.906\n**Percentage remaining = 91%**"}]},{"id":"b4-20","t":"Question 12","s":"","W":898,"H":1576,"p":[{"id":"b4-20.0","l":"(a)","m":4,"y":0,"w":897,"h":1177,"a":"- The same number of molecules now occupy a smaller volume, so there are more molecules per unit volume.\n- Molecules therefore collide with the walls of the tube more frequently.\n- Each collision produces a change in momentum, so the rate of change of momentum at the walls is greater, giving a greater force on the walls.\n- Pressure = force / area, so the pressure increases. (The temperature is constant, so the mean speed of the molecules is unchanged.)"},{"id":"b4-20.1","l":"(b)","m":2,"y":1177,"w":898,"h":399,"a":"pV = NkT\nN = pV / kT = (1.05 × 10⁵ × 2.43 × 10⁻⁵) / (1.38 × 10⁻²³ × 293)\n**N = 6.3 × 10²⁰**"}]}]},{"k":"B4","n":"Thermodynamics","q":[{"id":"bt-16","t":"Question 1","s":"","W":863,"H":1231,"p":[{"id":"bt-16.0","l":"(a)","m":2,"y":0,"w":863,"h":216,"a":"Q = ΔU + W\nQ is the thermal energy supplied to the system, ΔU is the increase in internal energy of the system, and W is the work done by the system.\n(Equivalent form: ΔU = q + W, where W is the work done on the system.)"},{"id":"bt-16.1","l":"(b)(i)","m":4,"y":216,"w":854,"h":729,"a":"**A to B:** change in internal energy: **decrease**. Work done on gas: **positive**.\nThe volume decreases at constant pressure, so the gas is compressed (work is done on it). pV decreases, so T and the internal energy decrease.\n**B to C:** change in internal energy: **increase**. Work done on gas: **zero**.\nThe volume is constant, so no work is done. The pressure rises, so T and the internal energy increase."},{"id":"bt-16.2","l":"(b)(ii)","m":3,"y":945,"w":818,"h":286,"a":"- The gas returns to its original state, so over one cycle the change in internal energy is zero (ΔU = 0).\n- The gas does more work expanding at high pressure (C to D) than is done on it during compression at low pressure (A to B), so there is net work done by the gas, equal to the area enclosed by the cycle.\n- By the first law, Q = ΔU + W = W, so there is a net supply of thermal energy to the gas equal to the net work done by the gas."}]},{"id":"bt-18","t":"Question 2","s":"","W":862,"H":1806,"p":[{"id":"bt-18.0","l":"(a)(i)","m":2,"y":0,"w":862,"h":286,"a":"A gas that obeys pV = nRT (pV / T = constant) at all pressures, volumes and temperatures."},{"id":"bt-18.1","l":"(a)(ii)","m":2,"y":286,"w":819,"h":100,"a":"T = 17 + 273 = 290 K\nn = pV / RT = (1.2 × 10⁵ × 0.24) / (8.31 × 290)\n**n = 12 mol**"},{"id":"bt-18.2","l":"(b)(i)","m":2,"y":386,"w":859,"h":871,"a":"At constant pressure W = pΔV.\nW = 1.2 × 10⁵ × (0.24 − 0.08) = 1.92 × 10⁴ J = **19.2 kJ**"},{"id":"bt-18.3","l":"(b)(ii)","m":5,"y":1257,"w":820,"h":549,"a":"Use ΔU = (thermal energy supplied) + (work done on gas) for each row.\n**AB:** work done on gas = **+19.2**, thermal energy = −48.0, ΔU = −48.0 + 19.2 = **−28.8**\n**CA:** work done on gas = −31.6. Temperature is constant so ΔU = **0**, and thermal energy supplied = **+31.6**\n**BC:** constant volume so work done = **0**. Over the full cycle the total ΔU is zero, so ΔU = **+28.8**, and thermal energy supplied = **+28.8**\n(all values in kJ)"}]},{"id":"bt-19","t":"Question 3","s":"","W":861,"H":1117,"p":[{"id":"bt-19.0","l":"(a)","m":2,"y":0,"w":861,"h":221,"a":"The thermal energy per unit mass needed to change a substance from liquid to gas (vapour) at constant temperature."},{"id":"bt-19.1","l":"(b)(i)","m":1,"y":221,"w":856,"h":194,"a":"q = mL = 0.37 × 2.3 × 10⁶\n**q = 8.5 × 10⁵ J**"},{"id":"bt-19.2","l":"(b)(ii)","m":3,"y":415,"w":820,"h":168,"a":"n = 370 / 18 = 20.6 mol\nT = 100 + 273 = 373 K\nV = nRT / p = (20.6 × 8.31 × 373) / 1.0 × 10⁵\nV = 0.637 m³ ≈ **0.64 m³**"},{"id":"bt-19.3","l":"(b)(iii)","m":2,"y":583,"w":825,"h":191,"a":"W = pΔV = 1.0 × 10⁵ × 0.64\n**W = 6.4 × 10⁴ J**"},{"id":"bt-19.4","l":"(b)(iv)","m":2,"y":774,"w":825,"h":123,"a":"First law: Q = ΔU + W, where W is the work done by the water on the atmosphere.\nΔU = Q − W = 8.51 × 10⁵ − 0.64 × 10⁵\n**ΔU = 7.9 × 10⁵ J**\nThe energy supplied is larger than the increase in internal energy because some of it is used to do work pushing back the atmosphere."},{"id":"bt-19.5","l":"(c)","m":2,"y":897,"w":856,"h":220,"a":"L is the energy supplied per unit mass: q = ΔU + pΔV. At a greater external pressure, more work is done against that pressure for a given change in volume, so more thermal energy must be supplied for the same increase in internal energy. The specific latent heat is therefore **greater**."}]}]},{"k":"B5","n":"Current and circuits","q":[{"id":"b5-1","t":"Question 1","s":"","W":1000,"H":1763,"p":[{"id":"b5-1.0","l":"(a)","m":1,"y":0,"w":1000,"h":825,"a":"P is ohmic, so use any point on its straight line, for example (10 V, 200 mA).\nR = V / I = 10 / 0.200\n**R = 50 Ω**"},{"id":"b5-1.1","l":"(b)","m":1,"y":825,"w":956,"h":180,"a":"The resistance of Q **increases** as the current increases. The ratio V / I gets larger along the curve (for example about 13 Ω at 80 mA but about 47 Ω at 170 mA)."},{"id":"b5-1.2","l":"(c)","m":1,"y":1005,"w":957,"h":595,"a":"The voltmeter is across Q, so read the current in Q at V = 3.0 V from the graph. P and Q are in series, so the ammeter shows the same current.\n**I = 120 mA**"},{"id":"b5-1.3","l":"(d)","m":2,"y":1600,"w":861,"h":163,"a":"The same current, 120 mA, flows in P.\nV_{P} = IR = 0.120 × 50 = 6.0 V\nThe cell has negligible internal resistance, so emf = V_{P} + V_{Q} = 6.0 + 3.0\n**emf = 9.0 V**"}]},{"id":"b5-2","t":"Question 2","s":"","W":1000,"H":2204,"p":[{"id":"b5-2.0","l":"(a)","m":2,"y":0,"w":1000,"h":664,"a":"ε = I(R + r)\nr = ε / I − R = 3.00 / 0.0590 − 50.0 = 50.85 − 50.0\n**r = 0.85 Ω**"},{"id":"b5-2.1","l":"(b)(i)","m":2,"y":664,"w":957,"h":666,"a":"Adding R in parallel reduces the total resistance of the external circuit.\nThe ammeter is in the main branch, so it reads the total current, I = ε / (R_{total} + r). The emf is unchanged, so the current **increases** and the ammeter reading is larger."},{"id":"b5-2.2","l":"(b)(ii)","m":2,"y":1330,"w":956,"h":322,"a":"The voltmeter reads the terminal potential difference, V = ε − Ir.\nThe current in the cell has increased, so the potential difference across the internal resistance (the \"lost volts\" Ir) is greater. The voltmeter reading **decreases**."},{"id":"b5-2.3","l":"(c)","m":3,"y":1652,"w":957,"h":552,"a":"R = ρL / A, and R = kL, so k = ρ / A.\nk = 4.9 × 10⁻⁷ / 3.1 × 10⁻⁸\n**k = 16 Ω m⁻¹** (15.8)"}]},{"id":"b5-3","t":"Question 3","s":"","W":1000,"H":2716,"p":[{"id":"b5-3.0","l":"(a)","m":1,"y":0,"w":1000,"h":572,"a":"**Conservation of electric charge.** Charge cannot build up at the junction, so the charge per second arriving equals the charge per second leaving."},{"id":"b5-3.1","l":"(b)(i)","m":2,"y":572,"w":956,"h":708,"a":"Current in the circuit I = V / R = 1.20 / 5.00 = 0.240 A\nPotential difference across the internal resistance = 1.50 − 1.20 = 0.30 V\nr = 0.30 / 0.240\n**r = 1.25 Ω**"},{"id":"b5-3.2","l":"(b)(ii)","m":2,"y":1280,"w":956,"h":702,"a":"The total external resistance is now smaller (2.50 Ω), so the current in the cell increases.\nThe potential difference across the internal resistance, Ir, increases, so the terminal potential difference V = ε − Ir is smaller. The voltmeter reading **decreases**."},{"id":"b5-4.0","l":"(c)(i)","m":1,"y":1982,"w":956,"h":398,"a":"Arrow drawn at the proton, tangent to the circle, pointing **down the page** (the proton moves anticlockwise).\nCheck with the left hand rule: field into the page, current (velocity of the positive charge) down the page, so the force points to the right, towards the centre of the circle."},{"id":"b5-4.1","l":"(c)(ii)","m":3,"y":2380,"w":956,"h":336,"a":"The magnetic force provides the centripetal force:\nevB = m_{p}v² / r\nso v = eBr / m_{p}\nThe proton travels one circumference in one period: v = 2πr / T = 2πrf\n2πrf = eBr / m_{p}\n**f = eB / 2πm_{p}**\nThe radius cancels, so the frequency does not depend on the speed."}]},{"id":"b5-5","t":"Question 4","s":"","W":1000,"H":2385,"p":[{"id":"b5-5.0","l":"(a)(i)","m":1,"y":0,"w":1000,"h":729,"a":"P = V² / R\nR = V² / P = 12² / 150\n**R = 0.96 Ω**"},{"id":"b5-5.1","l":"(a)(ii)","m":3,"y":729,"w":956,"h":378,"a":"R = ρL / A\nA = ρL / R = (1.5 × 10⁻⁶ × 5.0) / 0.96 = 7.8 × 10⁻⁶ m²\nA = πr², so r = √(7.8 × 10⁻⁶ / π)\n**r = 1.6 × 10⁻³ m** (1.6 mm)"},{"id":"b5-5.2","l":"(b)","m":3,"y":1107,"w":956,"h":584,"a":"The wire has 8 horizontal sections, so the dotted area has height 7 × 0.030 = 0.21 m.\nArea = 0.60 × 0.21 = 0.126 m²\nMass of ice = density × area × thickness = 900 × 0.126 × 0.50 × 10⁻³ = 0.0567 kg\nEnergy needed = mL = 0.0567 × 0.336 × 10⁶ = 1.9 × 10⁴ J\nt = E / P = 1.9 × 10⁴ / 150\n**t = 130 s** (127 s)\nThis is the minimum because it assumes all the energy from the heater goes into the ice."},{"id":"b5-5.3","l":"(c)","m":2,"y":1691,"w":956,"h":285,"a":"A nearly discharged battery has a lower terminal potential difference (lower emf and/or greater internal resistance).\nThe power dissipated in the heater, V² / R, is therefore less than 150 W, so the ice takes **longer** to melt than calculated in (b)."},{"id":"b5-5.4","l":"(d)","m":2,"y":1976,"w":956,"h":409,"a":"Any two of:\n- Renewable sources such as solar and wind are intermittent, so energy must be stored to match supply with demand.\n- Better batteries allow electric vehicles to replace fossil fuel engines, reducing greenhouse gas emissions and air pollution.\n- Demand for portable devices is growing, which needs batteries with greater energy density and longer lifetimes.\n- Current batteries rely on scarce or toxic materials, so more sustainable, cheaper and safer alternatives are needed."}]},{"id":"b5-6","t":"Question 5","s":"","W":956,"H":1692,"p":[{"id":"b5-6.0","l":"(a)(i)","m":3,"y":0,"w":956,"h":1118,"a":"From the graph, when the current in P is 0.40 A the potential difference across P is 1.5 V.\nP and R are in parallel and in series with Q, so V_{Q} = 6.0 − 1.5 = 4.5 V.\nFrom the graph, at 4.5 V the current in Q is **0.45 A**."},{"id":"b5-6.1","l":"(a)(ii)","m":2,"y":1118,"w":956,"h":321,"a":"Current in R = I_{Q} − I_{P} = 0.45 − 0.40 = 0.05 A\nPotential difference across R = 1.5 V (same as P)\nR = V / I = 1.5 / 0.05\n**R = 30 Ω**"},{"id":"b5-6.2","l":"(a)(iii)","m":1,"y":1439,"w":956,"h":181,"a":"Total current from the cell = current in Q = 0.45 A\nP = εI = 6.0 × 0.45\n**P = 2.7 W**"},{"id":"b5-6.3","l":"(b)","m":2,"y":1620,"w":956,"h":72,"a":"Removing P increases the resistance of the parallel section, so the total resistance of the circuit increases and the current in Q decreases.\nFrom the graph, Q is non ohmic and its resistance (V / I) is smaller at smaller currents, so the resistance of Q **decreases**."}]},{"id":"d3-5","t":"Question 6: Heated pad","s":"","W":1000,"H":2085,"p":[{"id":"d3-5.0","l":"(a)","m":1,"y":0,"w":1000,"h":752,"a":"Power P = 15 W and P = I²R\nI = √(P / R) = √(15 / 4.2)\n**I = 1.9 A**"},{"id":"d3-5.1","l":"(b)(i)","m":3,"y":752,"w":931,"h":564,"a":"Resistivity needed: ρ = RA / L = (4.2 × 9.6 × 10⁻⁶) / 1.25 = 3.2 × 10⁻⁵ Ω m\nThe pad operates between 20 °C and 35 °C, that is 293 K to 308 K.\nFrom the graph, the resistivity of carbon fibre at about 300 K is about 3 × 10⁻⁵ Ω m, which matches the required value, so carbon fibre is suitable."},{"id":"d3-5.2","l":"(b)(ii)","m":2,"y":1316,"w":1000,"h":135,"a":"From the graph, the resistivity (and so the resistance) of carbon fibre **decreases** as the temperature increases.\nThe potential difference across the resistor is constant (negligible internal resistance), and I = V / R, so the **current increases**."},{"id":"d3-6.0","l":"(c)(i)","m":1,"y":1451,"w":915,"h":140,"a":"The currents in PQ and RS are in opposite directions, so the force on RS is **repulsive: directed away from PQ** (towards TU), in the plane of the pad."},{"id":"d3-6.1","l":"(c)(ii)","m":2,"y":1591,"w":958,"h":41,"a":"**Zero.**\nThe current in TU is also opposite to the current in RS, so TU repels RS back towards PQ. PQ and TU carry the same current and are the same distance from RS, so the two forces are equal in magnitude and opposite in direction."},{"id":"d3-7.0","l":"(d)","m":3,"y":1632,"w":987,"h":453,"a":"- Trapped air is a poor thermal conductor (an insulator), so it reduces energy transfer by conduction to the floor and surroundings.\n- Because the air is trapped it cannot circulate, so energy loss by convection is also reduced.\n- The resistor is close to the top surface, so there is only a thin layer between it and the pet. The temperature gradient is large there, so most of the energy is conducted upwards to the pet."}]},{"id":"d3-8","t":"Question 7: Cell with internal resistance","s":"","W":1000,"H":991,"p":[{"id":"d3-8.0","l":"(a)","m":1,"y":0,"w":955,"h":476,"a":"A voltmeter with infinite resistance, so that no current flows through it."},{"id":"d3-8.1","l":"(b)(i)","m":1,"y":476,"w":533,"h":40,"a":"I = V / R = 1.47 / 50.0 = 0.0294 A\n**I = 29.4 mA**"},{"id":"d3-8.2","l":"(b)(ii)","m":2,"y":516,"w":683,"h":40,"a":"ε = I(R + r) for both circuits:\nε = 1.47 + 0.0294r\nε = 0.139 × (10.0 + r) = 1.39 + 0.139r\nSubtracting: 1.47 − 1.39 = (0.139 − 0.0294)r\nr = 0.080 / 0.110 = 0.73 Ω ≈ 0.7 Ω"},{"id":"d3-8.3","l":"(b)(iii)","m":2,"y":556,"w":395,"h":40,"a":"ε = 1.47 + 0.0294 × 0.73\n**ε = 1.49 V**"},{"id":"d3-9.0","l":"(c)(i)","m":2,"y":596,"w":1000,"h":355,"a":"- The current is a flow of charge carriers (electrons) moving along the wire. Each moving charge in the magnetic field experiences a force F = qvB, perpendicular to its velocity and to the field.\n- The electrons are confined to the wire, so they pass these forces on to the lattice of the wire through collisions. The sum of the forces on all the charge carriers is the force on the wire (F = BIL)."},{"id":"d3-9.1","l":"(c)(ii)","m":1,"y":951,"w":653,"h":40,"a":"**Into the plane of the page.**\nThe field points from N to S (down the page) and the current is to the right. By the left hand rule the force is into the page."}]}]}]},{"k":"C","n":"Wave behaviour","units":[{"k":"C1","n":"Simple harmonic motion","q":[{"id":"c1-1","t":"Question 1: Floating wood","s":"","W":953,"H":3189,"p":[{"id":"c1-1.0","l":"(a)(i)","m":1,"y":0,"w":953,"h":854,"a":"Arrow drawn on the wood pointing **vertically upwards**.\nIn diagram 3 the wood is displaced downwards from its equilibrium position, so the upthrust is greater than the weight. The acceleration is towards the equilibrium position, opposite to the displacement x."},{"id":"c1-1.1","l":"(a)(ii)","m":2,"y":854,"w":854,"h":373,"a":"- 14 / l is a constant, so the acceleration is directly proportional to the displacement x.\n- The negative sign shows that the acceleration is in the opposite direction to the displacement, so it is always directed towards the equilibrium position.\nThese are the two defining conditions for simple harmonic motion (a = −ω²x)."},{"id":"c1-1.2","l":"(a)(iii)","m":3,"y":1227,"w":854,"h":256,"a":"Comparing with a = −ω²x gives ω² = 14 / l.\nω = 2π / T = 2π / 1.4 = 4.49 rad s⁻¹\nl = 14 / ω² = 14 / 4.49² = 0.695 m ≈ **0.70 m**"},{"id":"c1-1.3","l":"(b)","m":1,"y":1483,"w":906,"h":242,"a":"One complete cycle of a **sine curve starting at v = 0** when t = 0.\nThe wood is released from rest at maximum displacement, so v = 0 at t = 0. It then moves upwards, reaches maximum speed at T/4, is at rest at T/2, has maximum speed in the opposite direction at 3T/4 and is at rest again at T. (With downwards taken as positive, this is a negative sine curve. Either sign is accepted.)"},{"id":"c1-1.4","l":"(c)(i)","m":2,"y":1725,"w":906,"h":253,"a":"a_{max} = ω²A = (14 / l) × A = (14 / 0.70) × 0.12\n**a_{max} = 2.4 m s⁻²**"},{"id":"c1-1.5","l":"(c)(ii)","m":1,"y":1978,"w":854,"h":66,"a":"P at any point where the graph crosses the time axis (v = 0), that is at t = 0, T/2 or T.\nThe acceleration is greatest at maximum displacement, which is where the velocity is zero."},{"id":"c1-2.0","l":"(d)(i)","m":2,"y":2044,"w":944,"h":833,"a":"From the graph, successive peaks are at 0.35 s and 1.75 s, so T = 1.4 s.\nv = fλ = λ / T = 0.45 / 1.4\n**v = 0.32 m s⁻¹**"},{"id":"c1-2.1","l":"(d)(ii)","m":2,"y":2877,"w":854,"h":193,"a":"Displacement at t = 1.75 s is 2.8 cm. Displacement at t = 0.35 s is 3.7 cm.\nRatio = 2.8 / 3.7 = **0.76**"},{"id":"c1-2.2","l":"(d)(iii)","m":1,"y":3070,"w":854,"h":119,"a":"Energy ∝ amplitude²\nRatio = 0.76² = **0.57**"}]},{"id":"c1-3","t":"Question 2: Simple pendulum","s":"","W":953,"H":3150,"p":[{"id":"c1-3.0","l":"(a)(i)","m":1,"y":0,"w":953,"h":775,"a":"A at any point of **maximum displacement**: the start of the graph (t = 0), the trough at T/2, or the peak at the end.\na = −ω²x, so the acceleration is greatest where the displacement is greatest."},{"id":"c1-3.1","l":"(a)(ii)","m":1,"y":775,"w":854,"h":66,"a":"V at either point where the graph **crosses the time axis** (displacement zero, at T/4 or 3T/4).\nAt the equilibrium position all the energy is kinetic, so the speed is a maximum."},{"id":"c1-3.2","l":"(b)","m":3,"y":841,"w":906,"h":256,"a":"- At the midpoint the bob is moving along the arc of a circle, so it has a centripetal acceleration directed upwards, towards the point of suspension.\n- There must therefore be a resultant upward force on the bob.\n- The resultant force is tension − weight, so the tension must be greater than the weight: T = mg + mv² / r."},{"id":"c1-3.3","l":"(c)(i)","m":2,"y":1097,"w":906,"h":709,"a":"Loss of gravitational potential energy = gain in kinetic energy\nmgh = ½mv²\nv = √(2gh) = √(2 × 9.81 × 0.025)\nv = 0.70 m s⁻¹"},{"id":"c1-3.4","l":"(c)(ii)","m":3,"y":1806,"w":854,"h":283,"a":"At the lowest point the resultant force provides the centripetal force:\nT − mg = mv² / r\nT = mg + mv² / r = (0.057 × 9.81) + (0.057 × 0.70² / 0.80)\nT = 0.559 + 0.035\n**T = 0.59 N**"},{"id":"c1-4.0","l":"(d)(i)","m":2,"y":2089,"w":906,"h":622,"a":"A resonance curve:\n- The amplitude starts at a small non zero value at low frequency and rises to a **single sharp peak**.\n- Beyond the peak the amplitude falls and tends towards zero at high frequency.\nThe peak is at the natural frequency of the pendulum, and it is tall and narrow because the damping is light."},{"id":"c1-4.1","l":"(d)(ii)","m":2,"y":2711,"w":854,"h":193,"a":"Resonance is when the amplitude of the driven oscillation is a maximum, shown by the peak of the graph.\nIt occurs when the driving frequency equals the natural frequency of the pendulum, when energy is transferred most efficiently from the driver to the pendulum."},{"id":"c1-4.2","l":"(e)","m":2,"y":2904,"w":906,"h":246,"a":"The water increases the damping. Any two of:\n- the amplitude is lower at all frequencies, so the peak is much lower\n- the peak is broader (less sharp)\n- the peak moves to a slightly lower frequency"}]},{"id":"cw-1","t":"Question 3","s":"","W":959,"H":278,"p":[{"id":"cw-1.0","l":"","m":1,"y":0,"w":959,"h":278,"a":"**A**\nThe defining condition of simple harmonic motion is that the restoring force (and so the acceleration) is proportional to the displacement from equilibrium and directed towards equilibrium: F = −kx."}]},{"id":"cw-2","t":"Question 4","s":"","W":949,"H":824,"p":[{"id":"cw-2.0","l":"","m":1,"y":0,"w":949,"h":824,"a":"**B**\nFor SHM a = −ω²x, so the graph of a against x is a straight line through the origin with a negative gradient.\nA has a positive gradient (acceleration away from equilibrium). C and D are not straight lines."}]},{"id":"cw-3","t":"Question 5","s":"","W":960,"H":695,"p":[{"id":"cw-3.0","l":"","m":1,"y":0,"w":960,"h":695,"a":"**D**\na = −ω²x, so the acceleration graph is the displacement graph turned upside down (in antiphase).\nThe displacement starts at zero and goes negative first, so the acceleration starts at zero and goes positive first. Only D does this.\nA starts at a maximum, B starts at a minimum, and C starts at zero but goes negative first (the same shape as the displacement)."}]},{"id":"cw-4","t":"Question 6","s":"","W":960,"H":679,"p":[{"id":"cw-4.0","l":"","m":1,"y":0,"w":960,"h":679,"a":"**C**\nVelocity is the gradient of the displacement–time graph.\nAt t = 0 the displacement is a maximum, so the gradient (velocity) is zero. The displacement then decreases, so the velocity becomes negative first. The graph that starts at zero and goes negative is C."}]},{"id":"cw-5","t":"Question 7","s":"","W":960,"H":826,"p":[{"id":"cw-5.0","l":"","m":1,"y":0,"w":960,"h":826,"a":"**C**\nThe height varies between about 0.5 m and 13.5 m, a range of 13 m, so the amplitude is half of this: 6.5 m.\nSuccessive high tides are at about 1, 13, 25 and 37 hours, so the period is 12 hours."}]},{"id":"cw-6","t":"Question 8","s":"","W":960,"H":558,"p":[{"id":"cw-6.0","l":"","m":1,"y":0,"w":960,"h":558,"a":"**C**\nAt t = 0 the particle is at maximum displacement, so it is at rest and E_{K} = 0.\nKinetic energy is never negative, and it reaches a maximum twice in each period (each time the particle passes through equilibrium), so the graph has two humps in time T."}]},{"id":"cw-7","t":"Question 9","s":"","W":960,"H":1255,"p":[{"id":"cw-7.0","l":"(a)","m":2,"y":0,"w":960,"h":322,"a":"1. The acceleration (or restoring force) is proportional to the displacement from the equilibrium position.\n2. The acceleration (or restoring force) is always directed towards the equilibrium position (opposite in direction to the displacement)."},{"id":"cw-7.1","l":"(b)(i)","m":1,"y":322,"w":905,"h":749,"a":"The maximum displacement read from the graph:\n**amplitude = 1.5 × 10⁻¹⁰ m**"},{"id":"cw-7.2","l":"(b)(ii)","m":2,"y":1071,"w":850,"h":184,"a":"From the graph, two complete oscillations take 0.22 × 10⁻¹³ s, so T = 0.11 × 10⁻¹³ s = 1.1 × 10⁻¹⁴ s.\nf = 1 / T = 1 / 1.1 × 10⁻¹⁴\nf = 9.1 × 10¹³ Hz"}]},{"id":"cw-8","t":"Question 10","s":"","W":960,"H":499,"p":[{"id":"cw-8.0","l":"","m":3,"y":0,"w":960,"h":499,"a":"Sketch a **cosine curve**: it starts at maximum positive displacement at t = 0, crosses the time axis at T/4, reaches maximum negative displacement at T/2, crosses the axis again at 3T/4 and returns to the maximum at T. Repeat for a second cycle, with constant amplitude.\n- **A** (maximum velocity): any point where the curve crosses the time axis, for example t = T/4.\n- **B** (zero velocity): any peak or trough, for example t = 0 or T/2.\n- **C** (maximum acceleration): also any peak or trough, because a = −ω²x is greatest at maximum displacement."}]},{"id":"cw-9","t":"Question 11","s":"","W":912,"H":361,"p":[{"id":"cw-9.0","l":"(a)","m":1,"y":0,"w":803,"h":154,"a":"k = −a / x, so its units are (m s⁻²) / m = **s⁻²**"},{"id":"cw-9.1","l":"(b)","m":2,"y":154,"w":912,"h":207,"a":"k = ω², so ω = √k.\nFor S₂ the constant is 4k, so its angular frequency is √4 = 2 times greater.\nS₂ therefore oscillates with **twice the frequency and half the period** of S₁."}]},{"id":"cw-10","t":"Question 12","s":"","W":960,"H":740,"p":[{"id":"cw-10.0","l":"(a)–(c)","m":3,"y":0,"w":960,"h":740,"a":"Both graphs have period T = 2.0 s. The green curve peaks at t = 0 and the red curve peaks at t = 0.25 s.\n**(a)** Time difference = **0.25 s**\n**(b)** Phase difference = (Δt / T) × 2π = (0.25 / 2.0) × 2π = **π/4 rad** (0.79 rad)\n**(c)** (0.25 / 2.0) × 360° = **45°**"}]}]},{"k":"C2","n":"Wave model","q":[{"id":"cw-11","t":"Question 1","s":"","W":960,"H":1110,"p":[{"id":"cw-11.0","l":"","m":1,"y":0,"w":960,"h":1110,"a":"**D**\nWavelength is the distance between two neighbouring points in phase, for example crest to crest. Amplitude is the maximum displacement from the equilibrium (zero) line.\nIn A and C the λ arrow only spans half a wavelength. In A and B the a arrow runs from crest to trough, which is twice the amplitude."}]},{"id":"cw-12","t":"Question 2","s":"","W":960,"H":253,"p":[{"id":"cw-12.0","l":"","m":1,"y":0,"w":960,"h":253,"a":"**C**\nWave speed is the speed at which energy (or a wavefront) is transferred through the medium. It is not the speed of the oscillating particles."}]},{"id":"cw-13","t":"Question 3","s":"","W":960,"H":710,"p":[{"id":"cw-13.0","l":"","m":1,"y":0,"w":960,"h":710,"a":"**C**\nOn graph P, t₁ and t₂ are successive times of zero displacement, so t₂ − t₁ = T/2.\nOn graph Q, x₁ and x₂ are neighbouring positions of zero displacement, so x₂ − x₁ = λ/2.\nv = λ / T = (λ/2) / (T/2) = (x₂ − x₁) / (t₂ − t₁)"}]},{"id":"cw-14","t":"Question 4","s":"","W":905,"H":724,"p":[{"id":"cw-14.0","l":"","m":1,"y":0,"w":905,"h":724,"a":"**B**\nIn a time T/4 the whole wave profile moves a distance λ/4 in the direction of travel (to the right).\nAt t = 0 the displacement at x = 0 is at a trough. After the shift, the zero crossing that was a quarter wavelength to the left has arrived at x = 0, and the trough is now a quarter wavelength to the right. The graph starts at zero and goes negative first, which is B."}]},{"id":"cw-15","t":"Question 5","s":"","W":960,"H":433,"p":[{"id":"cw-15.0","l":"","m":1,"y":0,"w":960,"h":433,"a":"**D**\nFrom the graph, one complete wave occupies 2.0 cm, so λ = 2.0 cm.\nv = fλ = 10 × 2.0 = **20 cm s⁻¹**"}]},{"id":"cw-16","t":"Question 6","s":"","W":960,"H":396,"p":[{"id":"cw-16.0","l":"","m":1,"y":0,"w":960,"h":396,"a":"**A**\nThe cork only moves vertically. It does not travel along with the wave.\nIt starts on a crest. One quarter of a period later it has moved from maximum displacement to the equilibrium position, directly below where it started. That is position A."}]},{"id":"cw-17","t":"Question 7","s":"","W":960,"H":672,"p":[{"id":"cw-17.0","l":"","m":1,"y":0,"w":960,"h":672,"a":"**D**\nThe wave moves to the left, so each point will next take the displacement of the part of the wave currently just to its right.\nJust to the right of X the string is below the equilibrium line, so X moves **downwards**.\nY is at a trough (maximum negative displacement). It can only move back towards equilibrium, so Y moves **upwards**."}]},{"id":"cw-18","t":"Question 8","s":"","W":960,"H":469,"p":[{"id":"cw-18.0","l":"","m":1,"y":0,"w":960,"h":469,"a":"**B**\nCoils to the left of B are displaced to the left and coils to the right of B are displaced to the right, so the coils on either side of B have moved apart. B is the centre of a rarefaction, where the separation of adjacent coils is greatest. (D is the centre of a compression.)\nNote: the wording on the sheet is unclear. If the question is read as asking where a coil's own displacement is greatest, the answer would be C."}]},{"id":"cw-19","t":"Question 9","s":"","W":960,"H":344,"p":[{"id":"cw-19.0","l":"","m":1,"y":0,"w":960,"h":344,"a":"**B**\nVisible light has wavelengths from about 400 nm (violet) to 700 nm (red). 4 × 10⁻⁷ m = 400 nm."}]},{"id":"cw-20","t":"Question 10","s":"","W":959,"H":158,"p":[{"id":"cw-20.0","l":"","m":1,"y":0,"w":959,"h":158,"a":"**A**\nIn order of increasing frequency: radio, microwaves, infrared, visible, ultraviolet, X rays, gamma rays. Only ultraviolet has a higher frequency than visible light."}]},{"id":"cw-21","t":"Question 11","s":"","W":952,"H":1337,"p":[{"id":"cw-21.0","l":"(a)(i)","m":1,"y":0,"w":952,"h":892,"a":"From graph 2, neighbouring troughs are at x = 0.075 cm and x = 0.375 cm.\n**λ = 0.30 cm** (3.0 × 10⁻³ m)"},{"id":"cw-21.1","l":"(a)(ii)","m":2,"y":892,"w":850,"h":110,"a":"From graph 1 the period is T = 0.25 ms.\nf = 1 / T = 1 / 0.25 × 10⁻³\n**f = 4000 Hz**"},{"id":"cw-21.2","l":"(a)(iii)","m":1,"y":1002,"w":850,"h":109,"a":"v = fλ = 4000 × 3.0 × 10⁻³\n**v = 12 m s⁻¹**"},{"id":"cw-21.3","l":"(b)(i)","m":1,"y":1111,"w":905,"h":110,"a":"A vertical line drawn from the time axis (y = 0) up to a peak (y = 2.0 mm), labelled amplitude. The blue arrow on graph 1 shows this."},{"id":"cw-21.4","l":"(b)(ii)","m":2,"y":1221,"w":850,"h":116,"a":"In a time T/4 the wave moves λ/4 = 0.075 cm to the right, so redraw the same curve shifted 0.075 cm to the right, with the same amplitude and wavelength.\nThe new curve has y = +2.0 mm at x = 0, crosses zero at 0.075 cm, has troughs at 0.15 cm and 0.45 cm, crosses zero at 0.225 cm and peaks at 0.30 cm."}]},{"id":"cw-22","t":"Question 12","s":"","W":906,"H":1564,"p":[{"id":"cw-22.0","l":"(a)(i)","m":1,"y":0,"w":905,"h":327,"a":"Transverse wave: redraw the double headed arrow (the oscillation) and add the energy transfer arrow **perpendicular** to it, for example pointing vertically up the page."},{"id":"cw-22.1","l":"(a)(ii)","m":1,"y":327,"w":850,"h":101,"a":"Longitudinal wave: redraw the double headed arrow and add the energy transfer arrow **parallel** to it, pointing horizontally left or right."},{"id":"cw-22.2","l":"(b)(i)","m":1,"y":428,"w":906,"h":591,"a":"Arrow at M pointing **vertically downwards**.\nThe wave is moving to the left, so the trough just to the right of M is about to arrive at M."},{"id":"cw-22.3","l":"(b)(ii)","m":1,"y":1019,"w":839,"h":62,"a":"A marks the vertical distance from the dotted equilibrium line to the top of a crest (or to the bottom of a trough)."},{"id":"cw-22.4","l":"(b)(iii)","m":1,"y":1081,"w":839,"h":62,"a":"λ marks the horizontal distance between two neighbouring crests (or any two neighbouring points in phase), for example from the crest left of M to the crest on the right."},{"id":"cw-22.5","l":"(b)(iv)","m":2,"y":1143,"w":839,"h":118,"a":"Redraw the same curve displaced **a quarter of a wavelength to the left**, with the same amplitude and wavelength.\nThe trough that was to the right of M is now at M's horizontal position, so N is drawn directly below M at the bottom of the trough."},{"id":"cw-22.6","l":"(c)(i)","m":1,"y":1261,"w":905,"h":210,"a":"f = v / λ = 10 / 5.0\n**f = 2.0 Hz**"},{"id":"cw-22.7","l":"(c)(ii)","m":2,"y":1471,"w":839,"h":93,"a":"In a quarter of a period the wave moves a quarter of a wavelength.\nT = 1 / f = 0.50 s, so t = T/4 = 0.125 s\ndistance = vt = 10 × 0.125\n**= 1.25 cm**"}]},{"id":"cw-23","t":"Question 13","s":"","W":960,"H":1019,"p":[{"id":"cw-23.0","l":"(a)","m":1,"y":0,"w":960,"h":575,"a":"**Longitudinal.** Sound in air is a series of compressions and rarefactions, with the particles oscillating parallel to the direction of energy transfer."},{"id":"cw-23.1","l":"(b)(i)","m":1,"y":575,"w":894,"h":157,"a":"From the graph there are two complete waves in 1.0 m.\n**λ = 0.50 m**"},{"id":"cw-23.2","l":"(b)(ii)","m":1,"y":732,"w":839,"h":109,"a":"**amplitude = 0.50 mm**"},{"id":"cw-23.3","l":"(b)(iii)","m":2,"y":841,"w":839,"h":178,"a":"v = fλ = 660 × 0.50\n**v = 330 m s⁻¹**"}]},{"id":"cw-24","t":"Question 14","s":"","W":959,"H":773,"p":[{"id":"cw-24.0","l":"","m":1,"y":0,"w":959,"h":773,"a":"**C**\nThe scale bar shows that 1 cm is half of a large grid square. The wavefronts have radii of about 1.0 cm, 2.5 cm and 4.0 cm, so the wavelength (distance between successive wavefronts) is 1.5 cm.\nv = fλ = 10.0 × 1.5 = **15 cm s⁻¹**"}]},{"id":"cw-25","t":"Question 15","s":"","W":960,"H":201,"p":[{"id":"cw-25.0","l":"","m":1,"y":0,"w":960,"h":201,"a":"**C**\nA path difference of one wavelength corresponds to a phase difference of 2π.\nPhase difference = (λ/4 ÷ λ) × 2π = **π/2 rad**"}]},{"id":"cw-34","t":"Question 16","s":"","W":959,"H":409,"p":[{"id":"cw-34.0","l":"(a)","m":2,"y":0,"w":959,"h":253,"a":"For a point source, intensity is inversely proportional to the square of the distance: I ∝ 1 / r².\nI₂ = I₁ (r₁ / r₂)² = 2.0 × 10⁻⁴ × (15 / 120)²\nI₂ = 3.1 × 10⁻⁶ W m⁻² ≈ 3.0 × 10⁻⁶ W m⁻²"},{"id":"cw-34.1","l":"(b)","m":2,"y":253,"w":908,"h":156,"a":"Intensity ∝ amplitude², so amplitude ∝ √I ∝ 1 / r.\nThe distance is 8 times greater (the intensity is 64 times smaller), so the amplitude **decreases to 1/8** of its value at 15 m."}]},{"id":"c1-5","t":"Question 17: Longitudinal wave","s":"","W":908,"H":4008,"p":[{"id":"c1-5.0","l":"(a)(i)","m":1,"y":0,"w":906,"h":972,"a":"The amplitude stays constant (2.0 cm) from one oscillation to the next."},{"id":"c1-5.1","l":"(a)(ii)","m":2,"y":972,"w":854,"h":293,"a":"From the graph T = 0.20 s and x₀ = 2.0 cm.\nω = 2π / T = 2π / 0.20 = 31.4 rad s⁻¹\na_{max} = ω²x₀ = 31.4² × 2.0 × 10⁻²\n**a_{max} = 20 m s⁻²** (19.7)"},{"id":"c1-5.2","l":"(a)(iii)","m":2,"y":1265,"w":854,"h":293,"a":"x = x₀ cos ωt, so v = −ωx₀ sin ωt (calculator in radians)\nv = −31.4 × 2.0 × 10⁻² × sin(31.4 × 0.12)\n**speed = 0.37 m s⁻¹**\n(Or read x = −1.6 cm at t = 0.12 s and use v = ω√(x₀² − x²). Or find the gradient of the tangent at t = 0.12 s.)"},{"id":"c1-5.3","l":"(a)(iv)","m":1,"y":1558,"w":854,"h":183,"a":"**To the right.** At t = 0.12 s the displacement is changing from −2 cm towards zero, so the gradient of the graph (the velocity) is positive."},{"id":"c1-6.0","l":"(b)(i)","m":2,"y":1741,"w":906,"h":876,"a":"From graph 1 the period is T = 0.20 s.\nf = 1 / T = 1 / 0.20\n**f = 5.0 Hz**"},{"id":"c1-6.1","l":"(b)(ii)","m":2,"y":2617,"w":854,"h":183,"a":"From graph 2 the wavelength is λ = 16 cm = 0.16 m.\nv = fλ = 5.0 × 0.16\n**v = 0.80 m s⁻¹**"},{"id":"c1-6.2","l":"(c)(i)","m":3,"y":2800,"w":908,"h":1141,"a":"Read each particle's displacement from graph 2 and add it to its equilibrium position (positive is to the right).\n- d = 0: displacement 0, cross at **0 cm**\n- d = 4: displacement +2, cross at **6 cm**\n- d = 8: displacement 0, cross at **8 cm**\n- d = 12: displacement −2, cross at **10 cm**\n- d = 16: displacement 0, cross at **16 cm**\n- d = 20: displacement +2, cross at **22 cm**"},{"id":"c1-6.3","l":"(c)(ii)","m":1,"y":3941,"w":854,"h":67,"a":"The particle at **d = 8 cm**.\nParticles to its left are displaced to the right and particles to its right are displaced to the left, so the particles are crowded together there. (The particle at 16 cm is at the centre of a rarefaction.)"}]}]},{"k":"C3","n":"Wave phenomena","q":[{"id":"cw-26","t":"Question 1","s":"","W":960,"H":292,"p":[{"id":"cw-26.0","l":"","m":1,"y":0,"w":960,"h":292,"a":"**A**\nThe principle of superposition: the resultant displacement at a point is the (vector) sum of the individual displacements. Amplitudes only add when the waves are exactly in phase."}]},{"id":"cw-27","t":"Question 2","s":"","W":960,"H":839,"p":[{"id":"cw-27.0","l":"","m":1,"y":0,"w":960,"h":839,"a":"**B**\nSuperposition adds displacements, taking sign into account. At time T the first wave has displacement +x₁ and the second has displacement −x₂.\nResultant = x₁ + (−x₂) = **x₁ − x₂**"}]},{"id":"cw-28","t":"Question 3","s":"","W":960,"H":472,"p":[{"id":"cw-28.0","l":"","m":1,"y":0,"w":960,"h":472,"a":"**B**\nWhen the pulses overlap, the displacements add at every point. A rectangle of constant height plus a triangle whose height falls from left to right gives a shape with a vertical left edge, a top that slopes downwards to the right (from twice the height down to the height of the rectangle) and a vertical right edge."}]},{"id":"cw-29","t":"Question 4","s":"","W":960,"H":587,"p":[{"id":"cw-29.0","l":"","m":1,"y":0,"w":960,"h":587,"a":"**B**\nPulses pass through each other unchanged. Afterwards the crest (which was moving right) is on the right and the trough (which was moving left) is on the left, each with its original shape and size."}]},{"id":"cw-30","t":"Question 5","s":"","W":960,"H":712,"p":[{"id":"cw-30.0","l":"","m":1,"y":0,"w":960,"h":712,"a":"**A**\nMeasure the path difference to each point in wavelengths (the source separation is 2.5λ).\nAt P: S₂P − S₁P = λ, so the waves arrive in phase and interfere constructively: **maximum**.\nAt Q: S₁Q − S₂Q = 1.5λ, so the waves arrive in antiphase and interfere destructively: **minimum**."}]},{"id":"cw-37","t":"Question 6","s":"","W":959,"H":519,"p":[{"id":"cw-37.0","l":"","m":1,"y":0,"w":959,"h":519,"a":"**D**\nSnell's law uses angles measured from the normal. W is the angle between the ray and the normal in water, and Y is the angle between the ray and the normal in air.\nsin W / sin Y = n_{air} / n_{water} = constant, so **sin W = constant × sin Y**.\nZ and X are measured from the surface, so they are not the angles in Snell's law."}]},{"id":"cw-38","t":"Question 7","s":"","W":960,"H":402,"p":[{"id":"cw-38.0","l":"","m":1,"y":0,"w":960,"h":402,"a":"**A**\nFrequency is fixed by the source, so it is unchanged. Light travels more slowly in glass, and v = fλ, so the wavelength decreases by the same factor as the speed."}]},{"id":"cw-39","t":"Question 8","s":"","W":960,"H":396,"p":[{"id":"cw-39.0","l":"","m":1,"y":0,"w":960,"h":396,"a":"**C**\nThe wave speeds up as it enters warm air, so it refracts away from the normal (sin θ₂ / sin θ₁ = v₂ / v₁ > 1).\nThe incident direction is at about 58° to the normal. Arrow II is almost undeviated, arrow I bends towards the normal, and arrow IV would be a reflection straight back down. Only arrow III has a larger angle to the normal."}]},{"id":"cw-40","t":"Question 9","s":"","W":960,"H":512,"p":[{"id":"cw-40.0","l":"","m":1,"y":0,"w":960,"h":512,"a":"**B**\nEntering the glass the ray slows down and bends towards the normal. Leaving the glass it speeds up and bends away from the normal. At both faces of a prism this deviates the ray towards the base, so the emerging ray slopes downwards, symmetric with the incoming ray."}]},{"id":"cw-41","t":"Question 10","s":"","W":960,"H":796,"p":[{"id":"cw-41.0","l":"","m":1,"y":0,"w":960,"h":796,"a":"**A**\nThe frequency is unchanged and the speed is lower in Y, so the wavelength is shorter: the wavefronts are closer together in Y.\nThe wave slows down, so it bends towards the normal, which turns the wavefronts to be more nearly parallel to the boundary. Only A shows closer wavefronts tilted towards the boundary."}]},{"id":"cw-42","t":"Question 11","s":"","W":960,"H":734,"p":[{"id":"cw-42.0","l":"","m":1,"y":0,"w":960,"h":734,"a":"**A**\nAt a fixed end the pulse is inverted (a phase change of π) and its direction is reversed. The gentle slope was the leading edge going in, so it is still the leading edge coming out. The reflected pulse is below the string, with the gentle slope on the left (leading, moving left) and the steep edge on the right."}]},{"id":"cw-43","t":"Question 12","s":"","W":960,"H":544,"p":[{"id":"cw-43.0","l":"","m":1,"y":0,"w":960,"h":544,"a":"**C**\nThe trough reaches the fixed support first and is reflected inverted, so it returns as a crest moving left. This reflected crest then meets the incoming crest, and by superposition they add to give a single crest of double height near the support."}]},{"id":"cw-44","t":"Question 13","s":"","W":949,"H":157,"p":[{"id":"cw-44.0","l":"","m":1,"y":0,"w":949,"h":157,"a":"**D**\nDiffraction is a property of all waves."}]},{"id":"cw-45","t":"Question 14","s":"","W":960,"H":513,"p":[{"id":"cw-45.0","l":"","m":1,"y":0,"w":960,"h":513,"a":"**D**\nIf the obstacle is much smaller than the wavelength, the wave diffracts around it and very little is reflected, so the bat receives no echo."}]},{"id":"cw-46","t":"Question 15","s":"","W":959,"H":721,"p":[{"id":"cw-46.0","l":"","m":1,"y":0,"w":959,"h":721,"a":"**A**\nThe waves pass the lower edge of the barrier and diffract into the region behind it. The wavelength does not change. The part of each wavefront in the shadow region curves back towards the barrier, so the wavefronts are straight lower down and curved at the top, behind the barrier."}]},{"id":"cw-47","t":"Question 16","s":"","W":959,"H":525,"p":[{"id":"cw-47.0","l":"","m":1,"y":0,"w":959,"h":525,"a":"**C**\nLight from the single slit diffracts and illuminates both S₁ and S₂ from the same wavefront, so the light at the two slits has a constant phase relationship (it is coherent)."}]},{"id":"cw-48","t":"Question 17","s":"","W":959,"H":184,"p":[{"id":"cw-48.0","l":"","m":1,"y":0,"w":959,"h":184,"a":"**A**\nAn observable (stable) interference pattern needs coherent sources, meaning a constant phase difference. Equal amplitudes only improve the contrast."}]},{"id":"cw-49","t":"Question 18","s":"","W":959,"H":679,"p":[{"id":"cw-49.0","l":"","m":1,"y":0,"w":959,"h":679,"a":"**C**\nAt a bright fringe the amplitudes add: the sum is now smaller, so the bright fringes are less bright.\nAt a dark fringe the amplitudes subtract: they no longer cancel completely, so the dark fringes become brighter."}]},{"id":"cw-50","t":"Question 19","s":"","W":959,"H":506,"p":[{"id":"cw-50.0","l":"","m":1,"y":0,"w":959,"h":506,"a":"**D**\nLines along which no wavefronts are drawn are nodal lines (destructive interference), where the path difference is (n + ½)λ.\nCounting outwards from the central maximum: the first gap (line III) is 0.5λ, the next band of wavefronts is λ, and the next gap (line IV) is **1.5λ**.\nLines I and II pass through wavefronts, so they are lines of constructive interference."}]},{"id":"cw-51","t":"Question 20","s":"","W":959,"H":595,"p":[{"id":"cw-51.0","l":"","m":1,"y":0,"w":959,"h":595,"a":"**A**\nPath difference = 3 − 1 = 2 m = one wavelength.\nThe sources are in phase, so the waves arrive at P in phase and interfere constructively.\nResultant amplitude = a + a = **2a**"}]},{"id":"cw-52","t":"Question 21","s":"","W":959,"H":1110,"p":[{"id":"cw-52.0","l":"(a)(i)","m":2,"y":0,"w":959,"h":750,"a":"The critical angle is the angle of incidence in the optically denser medium for which the angle of refraction is 90°, so the refracted ray travels along the boundary.\nFor angles of incidence greater than this, all the light is reflected (total internal reflection)."},{"id":"cw-52.1","l":"(a)(ii)","m":2,"y":750,"w":839,"h":86,"a":"Two rays leave the point of incidence:\n- A **reflected ray** in medium 1, with angle of reflection equal to the angle of incidence.\n- A **refracted ray** in medium 2 that bends **away from the normal** (angle of refraction greater than the angle of incidence), because n₁ > n₂."},{"id":"cw-52.2","l":"(b)","m":2,"y":836,"w":894,"h":274,"a":"At the critical angle the angle of refraction is 90°.\nSnell's law: n₁ sin φ_{c} = n₂ sin 90°\n**sin φ_{c} = n₂ / n₁**"}]},{"id":"cw-53","t":"Question 22","s":"","W":960,"H":1543,"p":[{"id":"cw-53.0","l":"(a)","m":3,"y":0,"w":960,"h":544,"a":"- Draw a ray **in the glass** travelling towards the boundary, and the normal at the point where it meets the boundary.\n- Draw the refracted ray travelling **along the boundary** (angle of refraction 90°). A weak reflected ray in the glass may also be shown.\n- Label the angle between the incident ray and the normal as c."},{"id":"cw-53.1","l":"(b)","m":4,"y":544,"w":906,"h":564,"a":"sin c = 1 / n = 1 / 1.5, so c = 41.8°\nThe ray always makes the angle c with the normal to the fibre wall, so it makes the angle c with a line across the fibre.\nFor every length x travelled along the axis, the light travels a path x / sin c.\nTotal path = 1.2 / sin c = 1.2 × 1.5\n**= 1.8 km**"},{"id":"cw-53.2","l":"(c)(i)","m":1,"y":1108,"w":905,"h":257,"a":"t = distance / speed = 1.2 × 10³ / 2.0 × 10⁸\n**t = 6.0 × 10⁻⁶ s**"},{"id":"cw-53.3","l":"(c)(ii)","m":1,"y":1365,"w":839,"h":178,"a":"t = 1.8 × 10³ / 2.0 × 10⁸\n**t = 9.0 × 10⁻⁶ s**"}]},{"id":"cw-54","t":"Question 23","s":"","W":960,"H":979,"p":[{"id":"cw-54.0","l":"(a)","m":3,"y":0,"w":960,"h":625,"a":"**Medium 1.**\n- The wavefronts are further apart in medium 1, so the wavelength is greater in medium 1.\n- The frequency does not change when a wave crosses a boundary.\n- v = fλ, so the speed is greater in medium 1.\n(Equivalent: the wavefronts make a smaller angle with the boundary in medium 2, so the wave has bent towards the normal, which means it has slowed down.)"},{"id":"cw-54.1","l":"(b)","m":3,"y":625,"w":917,"h":354,"a":"Measure the angle between the wavefronts and the boundary on each side (these equal the angles of incidence and refraction).\nMedium 1: θ₁ ≈ 60°. Medium 2: θ₂ ≈ 20°.\nv₁ / v₂ = sin θ₁ / sin θ₂ = sin 60° / sin 20°\n**v₁ / v₂ ≈ 2.5**\n(Or measure the perpendicular separation of the wavefronts in each medium and use v₁ / v₂ = λ₁ / λ₂.)"}]},{"id":"cw-55","t":"Question 24","s":"","W":960,"H":3820,"p":[{"id":"cw-55.0","l":"(a)(i)","m":1,"y":0,"w":960,"h":542,"a":"From F, the point where the wavefront meets the boundary, draw a straight line in medium R **parallel to the part of wavefront CD that is inside medium R**, ending level with D."},{"id":"cw-55.1","l":"(a)(ii)","m":3,"y":542,"w":850,"h":248,"a":"**Medium I.**\n- In medium R the wavefronts are closer together (and make a smaller angle with the boundary), so the wavelength is smaller in R.\n- The frequency is the same in both media.\n- v = fλ, so the speed is lower in R and higher in medium I."},{"id":"cw-55.2","l":"(b)(i)","m":2,"y":790,"w":905,"h":677,"a":"The velocity varies periodically (sinusoidally) with time and repeatedly changes sign, so the particle keeps reversing its direction of motion. It moves back and forth about a fixed position."},{"id":"cw-55.3","l":"(b)(ii)","m":2,"y":1467,"w":839,"h":156,"a":"From the graph the period is T = 3.0 ms.\nf = 1 / T = 1 / 3.0 × 10⁻³\n**f = 330 Hz**"},{"id":"cw-55.4","l":"(b)(iii)","m":1,"y":1623,"w":850,"h":86,"a":"M at any time where the velocity is zero: t = 0, 1.5 ms, 3.0 ms, 4.5 ms or 6.0 ms.\nThe particle is momentarily at rest at maximum displacement."},{"id":"cw-55.5","l":"(b)(iv)","m":2,"y":1709,"w":839,"h":178,"a":"Count squares under the first half cycle (or use the mean value of a sine curve, 2/π × peak).\nArea ≈ (2/π) × 6.0 × 1.5 × 10⁻³\n**Area ≈ 5.7 × 10⁻³ m** (accept 5.0 to 6.0 × 10⁻³ m)"},{"id":"cw-55.6","l":"(b)(v)","m":1,"y":1887,"w":839,"h":109,"a":"The area under a velocity–time graph is displacement. Between t = 0 and t = 1.5 ms the particle moves from one extreme to the other, so the area is **twice the amplitude** of the oscillation."},{"id":"cw-55.7","l":"(c)(i)","m":2,"y":1996,"w":894,"h":155,"a":"When two or more waves meet at a point, the resultant displacement is the vector sum of the individual displacements of each wave at that point."},{"id":"cw-55.8","l":"(c)(ii)","m":4,"y":2151,"w":905,"h":863,"a":"- At M the path difference is 550 − 550 = 0, so the waves arrive in phase and interfere constructively. The sound is loud (maximum).\n- At P the path difference is 580 − 560 = 20 cm, which is half a wavelength.\n- The waves arrive at P in antiphase and interfere destructively, giving a minimum (almost zero) loudness.\n- So the loudness **decreases** from a maximum at M to a minimum at P."},{"id":"cw-55.9","l":"(c)(iii)","m":4,"y":3014,"w":839,"h":332,"a":"**At M:** the resultant amplitude is now 2A + A = 3A instead of 2A. Intensity ∝ amplitude², so the intensity rises by a factor of 9/4. The sound is **louder**.\n**At P:** the amplitudes no longer cancel. The resultant amplitude is 2A − A = A instead of zero, so sound is now heard at P. The sound is **louder** (no longer a minimum of zero)."},{"id":"cw-55.10","l":"(c)(iv)","m":1,"y":3346,"w":839,"h":134,"a":"Two separate light sources are **not coherent**. The phase difference between them changes randomly and very rapidly, so no stable interference pattern is formed."},{"id":"cw-55.11","l":"(d)(i)","m":1,"y":3480,"w":905,"h":230,"a":"The source is stationary, so the wavefronts in the air are not changed.\n**λ = c / f**"},{"id":"cw-55.12","l":"(d)(ii)","m":1,"y":3710,"w":850,"h":110,"a":"The observer moves towards the oncoming waves, so the speed of the waves relative to the observer is\n**c + v**\n(The observed frequency is therefore f′ = (c + v) / λ = f (c + v) / c.)"}]},{"id":"cw-56","t":"Question 25","s":"","W":905,"H":2272,"p":[{"id":"cw-56.0","l":"(a)","m":3,"y":0,"w":905,"h":1385,"a":"- Each point on the wavefront in the slit acts as a source of secondary wavelets (the light diffracts at the slit).\n- The wavelets travel different distances to a point on the screen, so they arrive with different phases and superpose.\n- In the straight through direction all the wavelets are in phase, giving the bright central maximum. At the angle φ the path difference across the slit is one wavelength, so the wavelets cancel in pairs and the intensity is zero. At larger angles the cancellation is only partial, giving much weaker secondary maxima."},{"id":"cw-56.1","l":"(b)","m":2,"y":1385,"w":894,"h":283,"a":"From the geometry, for a small angle φ = d / D.\nφ = λ / b, so d / D = λ / b\n**d = Dλ / b**"},{"id":"cw-56.2","l":"(c)","m":2,"y":1668,"w":905,"h":604,"a":"The double slit fringes are drawn **inside the dotted single slit envelope**, touching it at their peaks.\nWith slit separation 2b, the fringe maxima are at θ = nλ / 2b, which is half the angular half width of the envelope (λ / b).\n- A central maximum at θ = 0 reaching the top of the envelope.\n- One maximum on each side at θ = ±λ / 2b (halfway out to the first envelope minimum), with zeros between at ±λ / 4b and ±3λ / 4b.\n- The next maxima would fall at θ = ±λ / b, exactly on the envelope minimum, so they are missing."}]},{"id":"cw-57","t":"Question 26","s":"","W":960,"H":1034,"p":[{"id":"cw-57.0","l":"(a)","m":2,"y":0,"w":960,"h":764,"a":"The fringe spacing does not change, because it depends only on λ, s and the distance to the screen.\nWider slits diffract the light less, so the single slit diffraction envelope is narrower. **Fewer fringes** are seen within the central maximum of the envelope."},{"id":"cw-57.1","l":"(b)","m":3,"y":764,"w":894,"h":270,"a":"- Wider slits transmit more light (more energy per second).\n- The amplitude of the wave from each slit is greater, and intensity ∝ amplitude².\n- The light is also spread over a narrower envelope, so the bright fringes are **more intense**."}]},{"id":"cw-58","t":"Question 27","s":"","W":960,"H":1199,"p":[{"id":"cw-58.0","l":"(a)","m":3,"y":0,"w":960,"h":794,"a":"For double slit fringes the angular separation is θ = λ / d.\nd = λ / θ = 633 × 10⁻⁹ / 4.00 × 10⁻⁴\n**d = 1.58 × 10⁻³ m** (1.58 mm)"},{"id":"cw-58.1","l":"(b)","m":2,"y":794,"w":905,"h":111,"a":"The principal maxima are at the **same positions** as before, but they are **much narrower (sharper)** and **more intense**, with nearly dark regions (very weak secondary maxima) between them."},{"id":"cw-58.2","l":"(c)","m":2,"y":905,"w":905,"h":294,"a":"- The central fringe is white, because the path difference is zero for every wavelength.\n- The other fringes are coloured (spectra), with blue/violet nearest the centre and red furthest out, because the fringe spacing is proportional to wavelength. Further out the colours overlap, so only a few fringes can be seen."}]},{"id":"c1-7","t":"Question 28: Toy train and double slit","s":"","W":954,"H":4208,"p":[{"id":"c1-7.0","l":"(a)","m":3,"y":0,"w":954,"h":1438,"a":"- Light diffracts at each slit and the two beams overlap. The slits act as coherent sources, so the light interferes.\n- Where the path difference from the two slits is a whole number of wavelengths (nλ), the waves arrive in phase and interfere constructively, giving maximum intensity and a voltage peak.\n- Between these positions the path difference is (n + ½)λ, giving destructive interference and minimum voltage. As the train moves, the sensor passes through successive bright fringes, producing a series of peaks."},{"id":"c1-7.1","l":"(b)(i)","m":1,"y":1438,"w":954,"h":250,"a":"s = λD / d = (6.3 × 10⁻⁷ × 5.0) / 1.5 × 10⁻³\n**s = 2.1 × 10⁻³ m**"},{"id":"c1-7.2","l":"(b)(ii)","m":2,"y":1688,"w":954,"h":255,"a":"From the graph the time between successive peaks is 25 ms.\nv = s / t = 2.1 × 10⁻³ / 25 × 10⁻³\n**v = 0.084 m s⁻¹**"},{"id":"c1-7.3","l":"(c)(i)","m":2,"y":1943,"w":954,"h":896,"a":"Angle to the first single slit minimum: θ = 0.13 / 5.0 = 0.026 rad\nθ = λ / b\nb = λ / θ = 6.3 × 10⁻⁷ / 0.026\n**b = 2.4 × 10⁻⁵ m**"},{"id":"c1-7.4","l":"(c)(ii)","m":2,"y":2839,"w":954,"h":276,"a":"A further series of voltage peaks is observed with the same spacing in time, but with a much smaller maximum voltage than the central set. The peaks rise and then fall again as the sensor crosses the secondary maximum of the single slit diffraction envelope."},{"id":"c1-7.5","l":"(d)","m":2,"y":3115,"w":954,"h":1093,"a":"The sound reflects from the barrier. The incident and reflected waves have the same frequency and amplitude and travel in opposite directions, so they superpose to form a standing wave.\nAs the train moves, the sensor passes alternately through nodes (minimum signal) and antinodes (maximum signal), so the output voltage varies between a minimum and a maximum."}]},{"id":"c1-8","t":"Question 29: Sodium light","s":"","W":954,"H":2494,"p":[{"id":"c1-8.0","l":"(a)(i)","m":2,"y":0,"w":954,"h":588,"a":"The double slit fringes are modulated by the single slit diffraction pattern of each slit. A is at the first minimum of the single slit envelope.\nAt this angle the path difference between light from the two edges of one slit is one wavelength, so light from each half of the slit cancels light from the other half (destructive interference). No light reaches A from either slit, so the intensity is zero."},{"id":"c1-8.1","l":"(a)(ii)","m":2,"y":588,"w":954,"h":537,"a":"θ = 4.1 × 10⁻² / 7.0 = 5.86 × 10⁻³ rad\nFor the first single slit minimum, θ = λ / b\nb = 590 × 10⁻⁹ / 5.86 × 10⁻³\n**b = 1.0 × 10⁻⁴ m**"},{"id":"c1-8.2","l":"(a)(iii)","m":2,"y":1125,"w":954,"h":254,"a":"A is where the third double slit maximum would be, so there are 3 fringe spacings between the centre and A.\ns = 4.1 × 10⁻² / 3 = 1.37 × 10⁻² m\nd = λD / s = (590 × 10⁻⁹ × 7.0) / 1.37 × 10⁻²\n**d = 3.0 × 10⁻⁴ m**"},{"id":"c1-8.3","l":"(b)(i)","m":3,"y":1379,"w":954,"h":692,"a":"Any three, each with its reason:\n- The maxima are **much sharper/narrower**, because many more slits contribute and destructive interference occurs at all angles except the principal maxima.\n- The maxima are **brighter**, because more light is transmitted and more beams superpose.\n- The maxima are **much further apart** (larger angles), because the slit separation is far smaller and sin θ = nλ / d.\n- The maxima have nearly equal intensity, because the slits are very narrow so the single slit envelope is very wide."},{"id":"c1-8.4","l":"(b)(ii)","m":3,"y":2071,"w":954,"h":423,"a":"Resolvance R = λ / Δλ = mN\nΔλ = 589.592 − 588.995 = 0.597 nm and mean λ = 589.29 nm\nR = 589.29 / 0.597 = 987\nN = R / m = 987 / 2 = 494 slits illuminated\nBeam width = 494 / 600 mm\n**= 0.82 mm**\n(Resolvance of a grating is from the older syllabus and is not examined in the 2025 guide.)"}]},{"id":"c1-9","t":"Question 30: Light from a distant galaxy","s":"","W":954,"H":3099,"p":[{"id":"c1-9.0","l":"(a)(i)","m":3,"y":0,"w":954,"h":791,"a":"- Light diffracts at each slit, and the waves from the two slits overlap and superpose at the screen.\n- At a dark fringe the path difference between the two waves is an odd number of half wavelengths, (n + ½)λ.\n- The waves arrive in antiphase (phase difference π), so they interfere destructively and the resultant amplitude is zero."},{"id":"c1-9.1","l":"(a)(ii)","m":1,"y":791,"w":954,"h":172,"a":"Coherent light has a constant phase difference between the waves from the two slits. Without this the positions of the maxima and minima would change continually and the pattern would average out, so no fringes would be seen."},{"id":"c1-9.2","l":"(a)(iii)","m":2,"y":963,"w":954,"h":302,"a":"A dark fringe and the next bright fringe are half a fringe spacing apart, so s = 2 × 4.50 = 9.00 mm.\ns = λD / d\nD = sd / λ = (9.00 × 10⁻³ × 0.300 × 10⁻³) / 633.0 × 10⁻⁹\n**D = 4.27 m**"},{"id":"c1-9.3","l":"(b)(i)","m":3,"y":1265,"w":954,"h":779,"a":"Counting from the central peak, the missing peak is the **4th** maximum.\nd sin θ = nλ, and for small angles sin θ ≈ θ\nθ = 4λ / d = (4 × 633.0 × 10⁻⁹) / 0.300 × 10⁻³\n**θ = 8.44 × 10⁻³ rad** (3 significant figures, matching the data. This is 0.484°.)"},{"id":"c1-9.4","l":"(b)(ii)","m":2,"y":2044,"w":954,"h":246,"a":"The peak is missing because it coincides with the first minimum of the single slit diffraction envelope, where θ = λ / b.\nb = λ / θ = 633.0 × 10⁻⁹ / 8.44 × 10⁻³ = 7.50 × 10⁻⁵ m\n**b = 0.0750 mm** (one quarter of the slit separation)"},{"id":"c1-9.5","l":"(c)","m":2,"y":2290,"w":954,"h":319,"a":"The observed wavelength (633.0 nm) is longer than the emitted wavelength (621.4 nm), so the light is red shifted.\nBy the Doppler effect, the galaxy and the Earth are **moving away from each other**."},{"id":"c1-9.6","l":"(d)(i)","m":1,"y":2609,"w":954,"h":244,"a":"λ_{water} = λ / n = 633.0 / 1.33\n**λ = 476 nm**"},{"id":"c1-9.7","l":"(d)(ii)","m":2,"y":2853,"w":954,"h":246,"a":"The wavelength is shorter, so any two of:\n- the fringes are closer together (s = λD / d is smaller)\n- the central diffraction envelope is narrower (θ = λ / b is smaller)\n- the intensity is lower, because some light is absorbed or reflected by the water"}]}],"hide":1},{"k":"C4","n":"Standing waves and resonance","q":[{"id":"cw-35","t":"Question 1","s":"","W":960,"H":1884,"p":[{"id":"cw-35.0","l":"(a)","m":2,"y":0,"w":960,"h":249,"a":"When two or more waves meet at a point, the resultant displacement at that point is the vector sum of the displacements that each wave would produce on its own."},{"id":"cw-35.1","l":"(b)","m":4,"y":249,"w":905,"h":1635,"a":"The standing wave is the sum of X and Y, so at this instant the two displacements add up to the pattern shown (amplitude 4 squares, two complete waves between A and B).\nThe wire is at its maximum displacement, so the two travelling waves are exactly in phase at this instant and are identical:\n- Wave X: a sine curve with the **same wavelength and the same phase** as the diagram (crests and troughs in the same places), but with **half the amplitude** (2 squares).\n- Wave Y: **identical to wave X**."}]},{"id":"cw-59","t":"Question 2","s":"","W":959,"H":253,"p":[{"id":"cw-59.0","l":"","m":1,"y":0,"w":959,"h":253,"a":"**A**\nA wave travelling along the pipe is reflected at the ends. The reflected wave superposes with the incident wave travelling the other way, producing a standing wave."}]},{"id":"cw-60","t":"Question 3","s":"","W":960,"H":253,"p":[{"id":"cw-60.0","l":"","m":1,"y":0,"w":960,"h":253,"a":"**B**\nAll particles in a standing wave oscillate with the same frequency, and those between two successive nodes are in phase. Their amplitudes are different: zero at the nodes and greatest at the antinode."}]},{"id":"cw-61","t":"Question 4","s":"","W":960,"H":438,"p":[{"id":"cw-61.0","l":"","m":1,"y":0,"w":960,"h":438,"a":"**B**\nA standing wave does not transfer energy along its length (energy is stored between the nodes). The amplitude varies with position, from zero at a node to a maximum at an antinode."}]},{"id":"cw-62","t":"Question 5","s":"","W":960,"H":360,"p":[{"id":"cw-62.0","l":"","m":1,"y":0,"w":960,"h":360,"a":"**D**\nPoints in neighbouring loops move in antiphase, and points two loops apart move in phase. U is two loops away from T, so it moves in the same direction as T: downwards. Points on a string only move perpendicular to the string, so A and C are impossible."}]},{"id":"cw-63","t":"Question 6","s":"","W":960,"H":781,"p":[{"id":"cw-63.0","l":"","m":1,"y":0,"w":960,"h":781,"a":"**A**\nPoints half a wavelength apart on a standing wave are in neighbouring loops, so they oscillate in antiphase (phase difference π) with the same frequency. When X moves up from zero, Y moves down from zero, so Y's graph is X's graph inverted."}]},{"id":"cw-64","t":"Question 7","s":"","W":960,"H":613,"p":[{"id":"cw-64.0","l":"","m":1,"y":0,"w":960,"h":613,"a":"**A**\nSound is a longitudinal wave, so the air oscillates parallel to the length of the pipe (horizontal arrows).\nThe diagram shows a node at the left hand end and an antinode at the right hand end. Q is nearer the antinode, so it has a larger amplitude than P."}]},{"id":"cw-65","t":"Question 8","s":"","W":960,"H":192,"p":[{"id":"cw-65.0","l":"","m":1,"y":0,"w":960,"h":192,"a":"**A**\nA pipe open at both ends has an antinode at each end, so for the first harmonic L = λ/2 and λ = 2L.\nf = v / λ = **v / 2L**"}]},{"id":"cw-66","t":"Question 9","s":"","W":960,"H":710,"p":[{"id":"cw-66.0","l":"","m":1,"y":0,"w":960,"h":710,"a":"**B**\nEvery point on a standing wave oscillates with the same period. P is near a node and has a small amplitude, while Q is near an antinode and has a large amplitude. Q travels further in the same time, so the average speeds are different."}]},{"id":"cw-67","t":"Question 10","s":"","W":960,"H":183,"p":[{"id":"cw-67.0","l":"","m":1,"y":0,"w":960,"h":183,"a":"**B**\nClosed pipe: L = λ/4, so f = v / 4L = 220 Hz.\nOpen pipe: L = λ/2, so f = v / 2L = 2 × 220 = **440 Hz**"}]},{"id":"cw-68","t":"Question 11","s":"","W":959,"H":558,"p":[{"id":"cw-68.0","l":"","m":1,"y":0,"w":959,"h":558,"a":"**D**\nSuccessive resonances occur when the air column gets longer by half a wavelength (x ≈ λ/4 and y ≈ 3λ/4).\ny − x = λ/2, so **λ = 2(y − x)**\nUsing the difference removes the end correction."}]},{"id":"cw-69","t":"Question 12","s":"","W":959,"H":408,"p":[{"id":"cw-69.0","l":"","m":1,"y":0,"w":959,"h":408,"a":"**A**\nThe powder collects at the displacement nodes, where the air does not move. Neighbouring nodes are half a wavelength apart, so d = λ/2 and λ = 2d.\nf = v / λ = **v / 2d**"}]},{"id":"cw-70","t":"Question 13","s":"","W":959,"H":435,"p":[{"id":"cw-70.0","l":"","m":1,"y":0,"w":959,"h":435,"a":"**C**\nThe first loud sound is the first harmonic of a pipe closed at one end. There is a displacement node at the water surface (closed end) and an antinode at the open top, with a quarter of a wavelength between them. C shows the envelope meeting at the water and widest at the top."}]},{"id":"cw-71","t":"Question 14","s":"","W":959,"H":1722,"p":[{"id":"cw-71.0","l":"(a)","m":2,"y":0,"w":959,"h":345,"a":"Any two of:\n- A standing wave does not transfer energy. A travelling wave does.\n- In a standing wave the amplitude varies with position (zero at nodes, maximum at antinodes). In a travelling wave every point has the same amplitude.\n- In a standing wave all points between two neighbouring nodes are in phase. In a travelling wave the phase changes continuously along the wave.\n- The wave profile of a standing wave does not move along. Crests of a travelling wave do."},{"id":"cw-71.1","l":"(b)","m":2,"y":345,"w":905,"h":247,"a":"When two or more waves meet at a point, the resultant displacement at that point is the vector sum of the displacements of the individual waves."},{"id":"cw-71.2","l":"(c)(i)","m":2,"y":592,"w":836,"h":903,"a":"**t = T/4:** every point of the string is at its equilibrium position, so draw a **straight line along the dotted line**.\n**t = T/2:** the string has the same shape as at t = 0 but **inverted**, with the same amplitude and the nodes in the same places (a trough where there was a crest, and a crest where there was a trough)."},{"id":"cw-71.3","l":"(c)(ii)","m":2,"y":1495,"w":839,"h":227,"a":"The points of zero displacement (nodes) stay in the same positions at all times, and the crests and troughs do not move along the string. Each point simply oscillates up and down about its equilibrium position with its own fixed amplitude, so the pattern does not travel."}]},{"id":"cw-72","t":"Question 15","s":"","W":960,"H":2921,"p":[{"id":"cw-72.0","l":"(a)(i)","m":1,"y":0,"w":960,"h":656,"a":"C marked at a time when the **displacement is zero**, for example t = 0.125 ms, 0.275 ms or 0.425 ms.\nAt the centre of a compression (and of a rarefaction) the particle has zero displacement, with the particles on either side displaced towards it."},{"id":"cw-72.1","l":"(a)(ii)","m":3,"y":656,"w":839,"h":248,"a":"From the graph the period is T = 0.30 ms.\nf = 1 / T = 1 / 0.30 × 10⁻³ = 3.3 × 10³ Hz\nλ = v / f = vT = 380 × 0.30 × 10⁻³\n**λ = 0.11 m**"},{"id":"cw-72.2","l":"(b)(i)","m":2,"y":904,"w":894,"h":202,"a":"Two waves of the same frequency (wavelength) and similar amplitude travel in opposite directions through the same medium and superpose. This usually happens when a wave is reflected at a boundary."},{"id":"cw-72.3","l":"(b)(ii)","m":2,"y":1106,"w":850,"h":395,"a":"At this frequency the length of the tube fits a whole number of quarter wavelengths, so the incident wave and the wave reflected from the closed end form a standing wave (resonance).\nThe air oscillates strongly at the antinodes and blows the powder away. The powder collects at the nodes, where the air does not move, and the nodes are equally spaced half a wavelength apart."},{"id":"cw-72.4","l":"(b)(iii)","m":2,"y":1501,"w":850,"h":227,"a":"Neighbouring nodes are λ/2 apart, so λ = 2 × 9.3 = 18.6 cm = 0.186 m\nv = fλ = 1800 × 0.186\n**v = 330 m s⁻¹** (335 m s⁻¹)"},{"id":"cw-72.5","l":"(c)","m":2,"y":1728,"w":894,"h":274,"a":"The separation of the heaps is λ/2, so the wavelength has increased.\nThe frequency is unchanged, and v = fλ, so the **speed of sound has increased** with the rise in temperature."},{"id":"cw-72.6","l":"(d)(i)","m":3,"y":2002,"w":905,"h":747,"a":"- The waves from the two sources meet in phase (crest on crest, trough on trough). This happens where the path difference is zero or a whole number of wavelengths.\n- By the principle of superposition the displacements add.\n- The resultant amplitude is the sum of the individual amplitudes, so it is a maximum (twice the amplitude of one wave)."},{"id":"cw-72.7","l":"(d)(ii)","m":1,"y":2749,"w":839,"h":86,"a":"Draw a line starting between the sources and passing through the next set of points where the wavefronts cross (crest meets crest) **outside one of the B lines**. Along it the path difference is 2λ."},{"id":"cw-72.8","l":"(d)(iii)","m":1,"y":2835,"w":839,"h":86,"a":"Draw a line starting between the sources and running **midway between line A and a line B**, through points where a wavefront from one source lies halfway between two wavefronts from the other (crest meets trough). Along it the path difference is λ/2."}]},{"id":"cw-73","t":"Question 16","s":"","W":960,"H":1962,"p":[{"id":"cw-73.0","l":"(a)","m":2,"y":0,"w":960,"h":368,"a":"Any two of:\n- A travelling wave transfers energy. A standing wave does not.\n- All points on a travelling wave have the same amplitude. In a standing wave the amplitude varies from zero at the nodes to a maximum at the antinodes.\n- In a travelling wave the phase changes continuously along the wave. In a standing wave all points between neighbouring nodes are in phase."},{"id":"cw-73.1","l":"(d)","m":5,"y":368,"w":894,"h":631,"a":"- Shaking end A sends a travelling wave along the tubing towards B.\n- The wave is reflected at the fixed end B (with a phase change of π).\n- The reflected wave travels back and superposes (interferes) with the incident wave.\n- The two waves have the same frequency and amplitude and travel in opposite directions, so a standing wave forms. B must be a node, and A is almost a node.\n- At this particular frequency the length AB is half a wavelength, so there is a single antinode in the middle. This is the first harmonic (fundamental)."},{"id":"cw-73.2","l":"(e)(i)","m":4,"y":999,"w":905,"h":623,"a":"- For the first harmonic the wavelength is fixed by the length: λ = 2L.\n- So v = fλ = 2Lf, and the speed is proportional to the frequency.\n- If v = k√T then f = (k / 2L)√T.\n- Plot f against √T (or f² against T). A **straight line through the origin** verifies the relationship, and its gradient is k / 2L."},{"id":"cw-73.3","l":"(e)(ii)","m":3,"y":1622,"w":839,"h":340,"a":"λ = 2L = 2 × 2.4 = 4.8 m\nv = fλ = 1.8 × 4.8 = 8.64 m s⁻¹\nk = v / √T = 8.64 / √9.0\n**k = 2.9** (unit m s⁻¹ N^{−½})"}]}],"hide":1}]},{"k":"D","n":"Fields","units":[{"k":"D1","n":"Gravitational fields","q":[{"id":"d1-1","t":"Question 1","s":"","W":942,"H":514,"p":[{"id":"d1-1.0","l":"","m":1,"y":0,"w":942,"h":514,"a":"**D**\nKepler's third law: T² ∝ r³, so T ∝ r^{3/2}.\nT_{X} / T_{Y} = 5^{3/2} = **√(5³)**"}]},{"id":"d1-2","t":"Question 2","s":"","W":873,"H":645,"p":[{"id":"d1-2.0","l":"","m":1,"y":0,"w":873,"h":645,"a":"**D**\nThe planet is moving towards the end of the ellipse nearest the Sun, so its distance from the Sun is decreasing.\nGravitational potential energy (−GMm/r) decreases as r decreases. The kinetic energy and the acceleration (GM/r²) both increase, and angular momentum is conserved."}]},{"id":"d1-3","t":"Question 3","s":"","W":943,"H":952,"p":[{"id":"d1-3.0","l":"","m":1,"y":0,"w":943,"h":952,"a":"**C**\nFrom the graph the potential at the surface (r = R₀) is −5 × 10⁶ J kg⁻¹.\nTo escape: ½v² = |V|, so v = √(2 × 5 × 10⁶) = √(10⁷)\n**v = 3.2 × 10³ m s⁻¹**"}]},{"id":"d1-4","t":"Question 4","s":"","W":944,"H":1048,"p":[{"id":"d1-4.0","l":"(a)","m":1,"y":0,"w":944,"h":461,"a":"Arrow from the satellite pointing **vertically down the page, towards the centre of the Earth**. The gravitational force provides the centripetal acceleration."},{"id":"d1-4.1","l":"(b)(i)","m":1,"y":461,"w":873,"h":342,"a":"The gravitational force provides the centripetal force:\nGMm / r² = mω²r = m(4π² / T²)r\nT² = (4π² / GM) r³\nComparing with T² = kr³ gives **k = 4π² / GM**."},{"id":"d1-4.2","l":"(b)(ii)","m":2,"y":803,"w":873,"h":42,"a":"r³ = GMT² / 4π² = (6.67 × 10⁻¹¹ × 5.97 × 10²⁴ × (5.62 × 10³)²) / 4π² = 3.19 × 10²⁰ m³\nr = 6.83 × 10⁶ m\nHeight = r − R = 6.83 × 10⁶ − 6.37 × 10⁶\n**h = 4.6 × 10⁵ m** (about 460 km)"},{"id":"d1-4.3","l":"(c)","m":3,"y":845,"w":873,"h":203,"a":"- **Total energy decreases**, because work is done against the drag force (energy is dissipated as thermal energy).\n- The satellite moves to a lower orbit, so its **gravitational potential energy decreases** (becomes more negative).\n- In a smaller orbit the orbital speed is greater (v = √(GM/r)), so the **kinetic energy increases**. The loss of potential energy is twice the gain in kinetic energy."}]},{"id":"d1-5","t":"Question 5","s":"","W":873,"H":458,"p":[{"id":"d1-5.0","l":"","m":1,"y":0,"w":873,"h":458,"a":"**B**\nT² ∝ r³, so r ∝ T^{2/3}.\nr_{Y} = R × 2^{2/3} = **∛4 R**"}]},{"id":"d1-6","t":"Question 6","s":"","W":943,"H":483,"p":[{"id":"d1-6.0","l":"","m":1,"y":0,"w":943,"h":483,"a":"**A**\nGMm / r² = m(4π² / T²)r gives T² = 4π²r³ / GM.\nT = 2πr^{1.5} / (GM)^{0.5}"}]},{"id":"d1-7","t":"Question 7","s":"","W":873,"H":454,"p":[{"id":"d1-7.0","l":"","m":1,"y":0,"w":873,"h":454,"a":"**B**\nIn circular orbit E_{K} = GMm / 2r = E and E_{P} = −GMm / r = −2E, so the total energy is −E.\nTo escape, the total energy must be at least zero, so the kinetic energy must equal GMm / r = **2E**."}]},{"id":"d1-8","t":"Question 8","s":"","W":943,"H":413,"p":[{"id":"d1-8.0","l":"","m":1,"y":0,"w":943,"h":413,"a":"**D**\n½mv² = GMm / r, so v = √(2GM / r).\ng = GM / r², so GM = gr² and **v = √(2gr)**."}]},{"id":"d1-9","t":"Question 9","s":"","W":873,"H":583,"p":[{"id":"d1-9.0","l":"(a)","m":3,"y":0,"w":803,"h":471,"a":"- Kepler's second law: the line joining the comet to the Sun sweeps out equal areas in equal times.\n- From A to B the comet moves further from the Sun, so to sweep the same area per unit time it must travel a shorter arc: its speed decreases.\n- Therefore the **kinetic energy decreases** from A to B (it is transferred to gravitational potential energy)."},{"id":"d1-9.1","l":"(b)","m":2,"y":471,"w":873,"h":112,"a":"Kepler's third law, comparing with Earth (T = 1 year):\nT² ∝ r³, so T = (4.5 × 10⁸ / 1.5 × 10⁸)^{3/2} = 3^{3/2}\n**T = 5.2 years**"}]},{"id":"d1-10","t":"Question 10","s":"","W":873,"H":640,"p":[{"id":"d1-10.0","l":"(a)","m":2,"y":0,"w":873,"h":333,"a":"Gravitational force = centripetal force:\nGMm / r² = mω²r, with ω = 2π / T\nGM / r² = 4π²r / T²\nT² / (4π²r³) = 1 / GM\nSo **k = 1 / GM**."},{"id":"d1-10.1","l":"(b)","m":2,"y":333,"w":873,"h":267,"a":"Both moons orbit Mars, so T² / r³ is the same for both.\nr_{D} = r_{P} (T_{D} / T_{P})^{2/3} = 9.38 × (30.4 / 7.66)^{2/3}\n**r = 23.5 Mm**"},{"id":"d1-10.2","l":"(c)","m":3,"y":600,"w":873,"h":40,"a":"Using Phobos: T = 7.66 × 3600 = 2.76 × 10⁴ s and r = 9.38 × 10⁶ m\nM = 4π²r³ / GT² = (4π² × (9.38 × 10⁶)³) / (6.67 × 10⁻¹¹ × (2.76 × 10⁴)²)\n**M = 6.4 × 10²³ kg**"}]},{"id":"d1-11","t":"Question 11","s":"","W":942,"H":306,"p":[{"id":"d1-11.0","l":"(a)","m":2,"y":0,"w":942,"h":154,"a":"The gravitational force of the sun provides the centripetal force on the planet:\nGMm / r² = mv² / r, with v = 2πr / T\nGM / r² = 4π²r / T²\nT² = (4π² / GM) r³\n4π² / GM is constant f
