<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IBDP Physics By Sanjith Chellamuthu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: a working column of question cards with a pinned tracker rail on the right; rail folds to a strip on phones. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunken:#e3e8f0; --line:#cfd6e2;
  --ink:#131c33; --muted:#566079; --accent:#2346d3; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --done:#0c7d57; --done-soft:#d9f1e7; --flag:#a85d00; --flag-soft:#fbe9cf;
  --img-filter:none; --img-blend:multiply;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131f; --surface:#171e2e; --sunken:#111827; --line:#2b3550;
  --ink:#e7ebf5; --muted:#98a3bd; --accent:#8fa8ff; --accent-ink:#0b1020; --accent-soft:#222d52;
  --done:#4fd3a2; --done-soft:#123a2f; --flag:#f2b35c; --flag-soft:#3d2c12;
  --img-filter:invert(1) hue-rotate(180deg); --img-blend:screen; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131f; --surface:#171e2e; --sunken:#111827; --line:#2b3550;
  --ink:#e7ebf5; --muted:#98a3bd; --accent:#8fa8ff; --accent-ink:#0b1020; --accent-soft:#222d52;
  --done:#4fd3a2; --done-soft:#123a2f; --flag:#f2b35c; --flag-soft:#3d2c12;
  --img-filter:invert(1) hue-rotate(180deg); --img-blend:screen; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
main{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 26px;max-width:60ch}
/* tracker rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.clock div{background:var(--sunken);border-radius:6px;padding:8px 2px;text-align:center}
.clock b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.clock span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.when{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .25s}
.rows{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px}
.row .bar{margin:0;height:6px}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile{font-family:var(--display);font-weight:700;width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.revbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--flag-soft);color:var(--flag);border:1px solid transparent;border-radius:8px;padding:10px 12px;font-weight:600}
.revbtn b{font-family:var(--mono)}
.sync{font-size:12px;color:var(--muted);margin:0;padding-inline:4px}
/* home */
.theme{margin-bottom:30px}
.theme h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.theme h2 .tile{width:30px;height:30px;font-size:16px;border-radius:7px}
.theme h2 .sub{color:var(--muted);font-family:var(--body);font-weight:400;font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.unit{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.unit:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.unit:disabled{cursor:default;background:transparent;border-style:dashed;color:var(--muted)}
.unit .code{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.unit:disabled .code{color:var(--muted)}
.unit .name{font-weight:600;font-size:15.5px;line-height:1.25;min-height:2.5em}
.unit .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.unit .bar{height:5px;margin-top:6px}
/* unit view */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}
.top .ttl{font-family:var(--display);font-weight:700;font-size:19px;min-width:0;flex:1 1 200px;line-height:1.2}
.top .ttl small{font-family:var(--mono);color:var(--accent);font-size:14px;margin-right:6px}
.top .cnt{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{font-family:var(--display);font-size:17px;font-weight:700;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q>header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.q>header h3{margin:0;font-size:14.5px;font-weight:600}
.q>header span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.part{padding:14px 16px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0}
.part.is-done{background:linear-gradient(90deg,var(--done-soft) 0 5px,transparent 5px)}
.part.is-flag{background:linear-gradient(90deg,var(--flag-soft) 0 5px,transparent 5px)}
.part.is-done.is-flag{background:linear-gradient(90deg,var(--done-soft) 0 5px,var(--flag-soft) 5px 10px,transparent 10px)}
.scroll{overflow-x:auto}
.crop{position:relative;overflow:hidden}
.crop img{position:absolute;left:0;max-width:none;filter:var(--img-filter);mix-blend-mode:var(--img-blend)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ctl .lab{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-right:auto}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.b .box{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.b.done[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.b.flag[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.b.show{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.show[aria-expanded="true"]{background:transparent;color:var(--accent)}
.ans{margin-top:12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;max-width:74ch}
.ans .eyebrow{color:var(--accent);margin-bottom:6px}
.ans p{margin:0 0 7px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 7px;padding-left:20px}.ans li{margin-bottom:4px}
.ans .letter{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:6px}
.ans .letter span{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.qfull{padding:12px 16px 14px;border-top:1px dashed var(--line);background:var(--sunken)}
.b.whole{width:100%;justify-content:center;font-weight:600}
.b.whole[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wholeq{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.wholeq .eyebrow{margin-bottom:8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* top tabs */
.tabs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:7px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wide{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;margin:0 0 24px}
/* notes */
.notes{display:flex;flex-direction:column;gap:14px;max-width:78ch}
.nsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.nsec h3{font-family:var(--display);font-size:17px;margin:0 0 8px}
.nsec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tip{margin-top:10px;background:var(--flag-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.tip b{color:var(--flag);margin-right:4px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pn button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px}
/* formulas */
.ftab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.frow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.6fr);gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.frow:first-child{border-top:0}
.frow .fd{font-size:14px;font-weight:600;min-width:0}
.frow .fd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.frow .fx{font-family:var(--math);font-size:20px;line-height:1.6;min-width:0;overflow-x:auto;white-space:nowrap}
.frow.cont{padding-top:2px;border-top:0}
.tag{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin:4px 6px 0 0;vertical-align:middle}
.tag.hl{background:var(--accent-soft);color:var(--accent)}
.tag.x{background:var(--flag-soft);color:var(--flag)}
.tag.bk{background:var(--done-soft);color:var(--done)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 2px;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.rt{white-space:nowrap}.rad{display:inline-block;border-top:1px solid currentColor;padding:3px 2px 0;margin-left:1px;line-height:1.25;vertical-align:middle}
.gap{display:inline-block;width:1.4em}
.rs{font-size:1.3em;vertical-align:middle;line-height:1}
.tags{display:block;margin-top:2px}
.fsec{font-family:var(--display);font-size:18px;font-weight:700;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
.fsec small{font-family:var(--mono);color:var(--accent);font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 18px}
@media (max-width:620px){.frow{grid-template-columns:minmax(0,1fr)}.frow .fx{font-size:19px}}
.from{font-size:13px;color:var(--muted);margin:22px 0 8px;font-weight:600}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:12px 48px}
  aside{position:static;order:-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  aside .panel{padding:12px}
  .rows,.sync{display:none}
  .revbtn{grid-column:1/-1}
  .clock b{font-size:18px}.big{font-size:24px}
  .in-unit aside .panel{display:none}
}
@media (max-width:520px){ aside{grid-template-columns:1fr} .part{padding:12px} .q>header{padding:9px 12px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main"></main>
  <aside aria-label="Tracker">
    <div class="panel">
      <p class="eyebrow">Time to the physics exam</p>
      <div class="clock" id="clock"></div>
      <p class="when">Wednesday 14 October 2026, 7:00 am IST</p>
    </div>
    <div class="panel">
      <p class="eyebrow">Question parts completed</p>
      <div class="big"><span id="tDone">0</span> <small>/ <span id="tAll"></span></small></div>
      <div class="bar"><i id="tBar" style="width:0"></i></div>
      <div class="rows" id="tRows"></div>
    </div>
    <button class="revbtn" id="revBtn" type="button"><span>Marked for review</span><b id="tRev">0</b></button>
    <p class="sync" id="sync">Progress is saved in this browser.</p>
  </aside>
</div>
<script>
const DATA={"themes":[{"k":"A","n":"Space, time and motion","units":[{"k":"A1","n":"Kinematics","q":[{"id":"a1-9","t":"Question 1","s":"","W":875,"H":462,"p":[{"id":"a1-9.0","l":"","m":1,"y":0,"w":875,"h":462,"a":"**B**\nThere is no horizontal force, so the horizontal component stays u cos θ.\nVertical displacement is zero, so the object is back at its launch height. By symmetry the vertical speed is the same as at launch but directed downwards: −u sin θ."}]},{"id":"a1-13","t":"Question 2","s":"","W":900,"H":1210,"p":[{"id":"a1-13.0","l":"(a)","m":2,"y":0,"w":900,"h":526,"a":"energy: scalar\nmomentum: vector\npower: scalar\ntime: scalar\nweight: vector"},{"id":"a1-13.1","l":"(b)(i)","m":1,"y":526,"w":891,"h":329,"a":"Draw an arrow 120 m pointing north, then from its tip an arrow 80 m pointing east (head to tail, with arrowheads).\nR is the arrow drawn from the starting point to the end of the second arrow, pointing to the north east. It forms the hypotenuse of a right angled triangle."},{"id":"a1-13.2","l":"(b)(ii)1","m":1,"y":855,"w":888,"h":155,"a":"Average speed = total distance / total time = (120 + 80) / (15 + 12) = 200 / 27\n**= 7.4 m s⁻¹**"},{"id":"a1-13.3","l":"(b)(ii)2","m":3,"y":1010,"w":843,"h":200,"a":"Resultant displacement R = √(120² + 80²) = 144 m\nAverage velocity v = displacement / time = 144 / 27\n**v = 5.3 m s⁻¹**\nAngle to the initial (north) direction: tan θ = 80 / 120\n**θ = 34°** (east of north)"}]},{"id":"a1-16","t":"Question 3","s":"","W":865,"H":1560,"p":[{"id":"a1-16.0","l":"(a)","m":2,"y":0,"w":865,"h":373,"a":"acceleration: vector\ndensity: scalar\ntemperature: scalar\nmomentum: vector"},{"id":"a1-16.1","l":"(b)(i)","m":1,"y":373,"w":855,"h":617,"a":"The gradient of a distance–time graph is the speed. The gradient decreases between t = 0 and t = 1.0 s, so the train is **decelerating** (its speed decreases)."},{"id":"a1-16.2","l":"(b)(ii)","m":2,"y":990,"w":816,"h":103,"a":"The graph is a straight line around t = 2.0 s, so the speed is the gradient of that section.\nUsing points on the line, (2.0, 0.32) and (3.0, 0.56):\nspeed = (0.56 − 0.32) / (3.0 − 2.0)\n**speed = 0.24 m s⁻¹**"},{"id":"a1-16.3","l":"(c)","m":1,"y":1093,"w":852,"h":467,"a":"**Zero.** Average velocity = displacement / time. After one complete lap the train is back at its starting point, so its displacement is zero."}]}]},{"k":"A2","n":"Forces and Momentum","q":[{"id":"a2a-1","t":"Question 1","s":"","W":705,"H":287,"p":[{"id":"a2a-1.0","l":"","m":1,"y":0,"w":705,"h":287,"a":"**C**\n1200 rotations per minute = 1200 / 60 = 20 rotations per second.\nω = 2πf = 2π × 20 = **126 rad s⁻¹**"}]},{"id":"a2a-2","t":"Question 2","s":"","W":471,"H":289,"p":[{"id":"a2a-2.0","l":"","m":1,"y":0,"w":471,"h":289,"a":"**C**\nf = 570 / 60 = 9.5 rotations per second.\nω = 2πf = 2π × 9.5 = 59.7 ≈ **60 rad s⁻¹**"}]},{"id":"a2a-3","t":"Question 3","s":"","W":903,"H":1798,"p":[{"id":"a2a-3.0","l":"(a)(i)","m":2,"y":0,"w":830,"h":683,"a":"Two forces only:\n- **Tension** acting along the string, up and towards the point of suspension.\n- **Weight** (mg) acting vertically downwards.\nDo not draw a separate \"centripetal force\". The horizontal component of the tension is the centripetal force."},{"id":"a2a-3.1","l":"(a)(ii)","m":2,"y":683,"w":878,"h":335,"a":"Period T = 60 / 36 = 1.67 s\nv = 2πr / T = (2π × 0.40) / 1.67\n**v = 1.5 m s⁻¹**"},{"id":"a2a-3.2","l":"(a)(iii)","m":3,"y":1018,"w":903,"h":447,"a":"Vertically the aeroplane is in equilibrium: T cos θ = mg\nHorizontally the tension component provides the centripetal force: T sin θ = mv² / r\nDividing the second equation by the first:\ntan θ = v² / (rg)\nThe mass m cancels, so θ depends only on v, r and g and is **independent of the mass**."},{"id":"a2a-3.3","l":"(b)","m":2,"y":1465,"w":903,"h":333,"a":"Measure the length L of the string and the radius r of the circular path with a metre rule (or the vertical height h of the support above the plane of the circle).\nThen use trigonometry: sin θ = r / L (or tan θ = r / h).\n(Alternative: take a photograph or video frame side on, level with the aeroplane, and measure θ with a protractor.)"}]},{"id":"a2a-4","t":"Question 4","s":"","W":757,"H":473,"p":[{"id":"a2a-4.0","l":"","m":1,"y":0,"w":757,"h":473,"a":"**B**\n360° = 2π radians, so 1° = 2π / 360 rad.\n40° = 40 × 2π / 360 rad."}]},{"id":"a2a-5","t":"Question 5","s":"","W":850,"H":432,"p":[{"id":"a2a-5.0","l":"","m":1,"y":0,"w":850,"h":432,"a":"**B**\nEach revolution is 2π radians, so the angle turned is 14 × 2π rad in 6 s.\nω = angle / time = 14 × 2π / 6"}]},{"id":"a2a-6","t":"Question 6","s":"","W":903,"H":331,"p":[{"id":"a2a-6.0","l":"","m":1,"y":0,"w":903,"h":331,"a":"**C**\nThe tension provides the centripetal force: T = mrω² = mv² / r.\nDecreasing the period increases ω (ω = 2π / T), so a larger tension is needed.\nDecreasing ω, m or v would all reduce the tension."}]},{"id":"a2a-7","t":"Question 7","s":"","W":910,"H":1228,"p":[{"id":"a2a-7.0","l":"(a)(i)","m":2,"y":0,"w":910,"h":778,"a":"Frequency f = 1400 / 60 = 23.3 Hz\nRadius r = 0.480 / 2 = 0.240 m\nv = 2πrf = 2π × 0.240 × 23.3\nv = 35.2 m s⁻¹ ≈ **35 m s⁻¹**"},{"id":"a2a-7.1","l":"(a)(ii)","m":2,"y":778,"w":909,"h":385,"a":"F = mv² / r = (1.4 × 10⁻³ × 35.2²) / 0.240\n**F = 7.2 N** (7.1 N if v = 35 m s⁻¹ is used)"},{"id":"a2a-7.2","l":"(b)","m":2,"y":1163,"w":868,"h":65,"a":"The clothes move in a circle because the wall of the drum pushes on them, providing the centripetal force.\nAt a hole there is no contact force on the water, so nothing provides the centripetal force. The water continues in a straight line along the tangent (Newton's first law) and leaves through the holes."}]},{"id":"a2a-8","t":"Question 8","s":"","W":905,"H":1887,"p":[{"id":"a2a-8.0","l":"(a)","m":3,"y":0,"w":905,"h":1028,"a":"The weight of M provides the tension, and the tension provides the centripetal force on the bung.\nMg = mv² / r\nv = √(Mgr / m) = √(0.250 × 9.81 × 0.59 / 0.080)\n**v = 4.3 m s⁻¹**"},{"id":"a2a-8.1","l":"(b)","m":3,"y":1028,"w":900,"h":463,"a":"- A greater speed needs a greater centripetal force (F = mv² / r) to stay at the same radius.\n- The tension is still equal to the weight of M, so it is no longer large enough for that radius.\n- The bung moves outwards to a larger radius, pulling more string through the tube, so M is pulled upwards."},{"id":"a2a-8.2","l":"(c)","m":2,"y":1491,"w":896,"h":396,"a":"**Student B's method.**\nIn a fixed time the bung will usually not complete a whole number of rotations, and a fraction of a rotation is hard to judge, so method A has a large uncertainty.\nTiming a fixed, large number of complete rotations gives a long time, so the percentage uncertainty from reaction time is small. Dividing by the number of rotations gives an accurate value for one rotation."}]},{"id":"a2a-9","t":"Question 9","s":"","W":901,"H":1360,"p":[{"id":"a2a-9.0","l":"(a)(i)","m":1,"y":0,"w":901,"h":812,"a":"Arrow drawn **along the rod, from the seat towards the disc** (upwards and inwards), labelled T."},{"id":"a2a-9.1","l":"(a)(ii)","m":2,"y":812,"w":855,"h":43,"a":"Radius of path = radius of disc + horizontal distance from the rod\nr = 7.8 / 2 + 11.1 sin 35°\nr = 3.9 + 6.37 = 10.3 m ≈ **10 m**"},{"id":"a2a-9.2","l":"(a)(iii)","m":3,"y":855,"w":863,"h":75,"a":"Vertically there is no acceleration, so the vertical component of tension balances the weight.\nT cos 35° = mg\nT = (12 × 9.81) / cos 35°\n**T = 140 N** (144 N)"},{"id":"a2a-9.3","l":"(a)(iv)","m":2,"y":930,"w":863,"h":66,"a":"The horizontal component of tension provides the centripetal force.\nT sin 35° = mω²r\nω = √(T sin 35° / mr) = √(144 × sin 35° / (12 × 10.3))\nω = 0.82 ≈ **0.8 rad s⁻¹**"},{"id":"a2a-9.4","l":"(b)(i)","m":2,"y":996,"w":895,"h":152,"a":"The sandbag has no initial vertical velocity.\ns = ½gt²\nt = √(2s / g) = √(2 × 17 / 9.81)\n**t = 1.9 s** (1.86 s)"},{"id":"a2a-9.5","l":"(b)(ii)","m":3,"y":1148,"w":857,"h":106,"a":"Horizontal speed at release = tangential speed of the seat\nv = ωr = 0.82 × 10.3 = 8.4 m s⁻¹\nThe horizontal velocity is constant during the fall.\ns = vt = 8.4 × 1.86\n**s = 16 m** (15 m if ω = 0.8 rad s⁻¹ and r = 10 m are used)"},{"id":"a2a-9.6","l":"(b)(iii)","m":3,"y":1254,"w":863,"h":106,"a":"**No change in the horizontal displacement.**\n- The horizontal speed at release is the same, because ω and r do not depend on the mass (tan θ = ω²r / g).\n- The time of fall is the same, because the acceleration of free fall is independent of mass.\n- So s = vt is unchanged (assuming air resistance is negligible)."}]},{"id":"a2a-10","t":"Question 10","s":"","W":899,"H":506,"p":[{"id":"a2a-10.0","l":"","m":1,"y":0,"w":899,"h":506,"a":"**B**\nIn uniform circular motion the velocity is along the tangent and the acceleration is towards the centre.\nAt P (top of the circle) the tangent is horizontal and the centre is directly below, so v is horizontal and a points down. Only B shows this."}]},{"id":"a2a-11","t":"Question 11","s":"","W":903,"H":538,"p":[{"id":"a2a-11.0","l":"","m":1,"y":0,"w":903,"h":538,"a":"**C**\nThe speed is constant but the direction changes, so the mass accelerates towards the centre. The resultant of tension and weight is the centripetal force, directed towards the centre of the circular path."}]},{"id":"a2a-12","t":"Question 12","s":"","W":904,"H":391,"p":[{"id":"a2a-12.0","l":"","m":1,"y":0,"w":904,"h":391,"a":"**A**\nF = mv² / r = 2E_{K} / r\nIf r doubles and E_{K} halves: F′ = 2(½E_{K}) / (2r) = ¼ × 2E_{K} / r = **F / 4**"}]},{"id":"a2a-13","t":"Question 13","s":"","W":904,"H":677,"p":[{"id":"a2a-13.0","l":"","m":1,"y":0,"w":904,"h":677,"a":"**D**\nBoth particles have the same angular velocity ω. Y is further from the axis.\nv = ωr, so Y has a greater speed than v.\na = ω²r, so Y has a greater acceleration than a."}]},{"id":"a2a-14","t":"Question 14","s":"","W":903,"H":314,"p":[{"id":"a2a-14.0","l":"","m":1,"y":0,"w":903,"h":314,"a":"**B**\nFriction provides the centripetal force. At the maximum speed: μmg = mv² / R, so v = √(μgR).\nv ∝ √R, so doubling the radius gives **v√2**."}]},{"id":"a2a-15","t":"Question 15","s":"","W":901,"H":388,"p":[{"id":"a2a-15.0","l":"","m":1,"y":0,"w":901,"h":388,"a":"**A**\nSpeed = distance / time = circumference / period = **2πr / T**"}]},{"id":"a2a-16","t":"Question 16","s":"","W":903,"H":646,"p":[{"id":"a2a-16.0","l":"","m":1,"y":0,"w":903,"h":646,"a":"**C**\nAll points on the disc have the same angular velocity ω.\na = ω²r, so a ∝ r. Q is at twice the radius, so its acceleration is **2a**."}]},{"id":"a2a-17","t":"Question 17","s":"","W":770,"H":372,"p":[{"id":"a2a-17.0","l":"","m":1,"y":0,"w":770,"h":372,"a":"**B**\nThe velocity changes direction continuously, so there is an acceleration of magnitude v² / r directed towards the centre of the circle (centripetal acceleration)."}]},{"id":"a2a-18","t":"Question 18","s":"","W":902,"H":318,"p":[{"id":"a2a-18.0","l":"","m":1,"y":0,"w":902,"h":318,"a":"**A**\nThe centripetal force is always perpendicular to the velocity (displacement).\nW = Fs cos θ with θ = 90°, so the work done is **zero**. This is why the speed and kinetic energy stay constant."}]},{"id":"a2a-19","t":"Question 19","s":"","W":904,"H":315,"p":[{"id":"a2a-19.0","l":"","m":1,"y":0,"w":904,"h":315,"a":"**A**\nThe speed is uniform, so the net force is purely centripetal, pointing towards the centre of the circle. At the lowest position the centre is directly above the ball, so the net force is vertically upwards."}]},{"id":"a2a-20","t":"Question 20","s":"","W":904,"H":310,"p":[{"id":"a2a-20.0","l":"","m":1,"y":0,"w":904,"h":310,"a":"**D**\nFor circular motion at constant speed the resultant force is the centripetal force (provided here by friction), directed towards the centre of the circle."}]},{"id":"a2b-1","t":"Question 21","s":"","W":907,"H":672,"p":[{"id":"a2b-1.0","l":"","m":1,"y":0,"w":907,"h":672,"a":"**A**\nNo external horizontal force acts, so horizontal momentum is conserved. The load has no horizontal momentum before it lands.\nmu = (m + M)v\nM = mu / v − m = **m(u − v) / v**"}]},{"id":"a2b-2","t":"Question 22","s":"","W":799,"H":510,"p":[{"id":"a2b-2.0","l":"","m":1,"y":0,"w":799,"h":510,"a":"**A**\nI is true: the moving car slows down and the car at rest speeds up (both end at half the initial speed).\nII is true: no external force acts, so total momentum is conserved.\nIII is false: the cars stick together, so the collision is inelastic and kinetic energy is lost."}]},{"id":"a2b-3","t":"Question 23","s":"","W":901,"H":439,"p":[{"id":"a2b-3.0","l":"","m":1,"y":0,"w":901,"h":439,"a":"**C**\nAfter leaving the ground, kinetic energy becomes gravitational potential energy: ½Mv² = Mgh, so v = √(2gh).\nImpulse = change in momentum = Mv − 0 = **M√(2gh)**"}]},{"id":"a2b-4","t":"Question 24","s":"","W":799,"H":489,"p":[{"id":"a2b-4.0","l":"","m":1,"y":0,"w":799,"h":489,"a":"**A**\nAt maximum height the rocket's momentum is zero, so after the explosion the total momentum is still zero.\nII is true: X and Y have momenta equal in magnitude and opposite in direction.\nI is true: E_{K} = p² / 2m. With the same p, the larger mass X has less kinetic energy.\nIII is false: total momentum is conserved, it does not increase."}]},{"id":"a2b-5","t":"Question 25","s":"","W":713,"H":641,"p":[{"id":"a2b-5.0","l":"","m":1,"y":0,"w":713,"h":641,"a":"**C**\nMomentum: 1 × 4 = (1 + 3)v, so v = 1 m s⁻¹.\nE_{K} before = ½ × 1 × 4² = 8 J\nE_{K} after = ½ × 4 × 1² = 2 J\nRatio = 2 / 8 = **1/4**"}]},{"id":"a2b-6","t":"Question 26","s":"","W":800,"H":680,"p":[{"id":"a2b-6.0","l":"","m":1,"y":0,"w":800,"h":680,"a":"**D**\nThe impulse on the ball equals its change in momentum, Δp. By Newton's third law the wall receives an impulse of equal magnitude in the opposite direction. The weight Mg is vertical and is a force, not an impulse, so it plays no part."}]},{"id":"a2b-7","t":"Question 27","s":"","W":878,"H":327,"p":[{"id":"a2b-7.0","l":"","m":1,"y":0,"w":878,"h":327,"a":"**A**\nImpulse = change in momentum = mΔv\nΔv = 25 − 5.0 = 20 cm s⁻¹ = 0.20 m s⁻¹\nImpulse = 0.30 × 0.20 = **0.06 N s**"}]},{"id":"a2b-8","t":"Question 28","s":"","W":774,"H":323,"p":[{"id":"a2b-8.0","l":"","m":1,"y":0,"w":774,"h":323,"a":"**C**\nE_{K} = p² / 2m, so p = √(2mE_{K}).\np_{X} / p_{Y} = √(m_{X}E_{X} / m_{Y}E_{Y}) = √(2 × 4) = √8 = **2√2**"}]},{"id":"a2b-9","t":"Question 29","s":"","W":864,"H":538,"p":[{"id":"a2b-9.0","l":"","m":1,"y":0,"w":864,"h":538,"a":"**A**\nIn a perfectly elastic head on collision between identical masses with one at rest, both momentum and kinetic energy are conserved only if the velocities are exchanged. X stops and Y moves off with speed v.\n(B conserves momentum but loses kinetic energy. C does not conserve momentum. D does not conserve momentum.)"}]},{"id":"a2b-10","t":"Question 30","s":"","W":756,"H":286,"p":[{"id":"a2b-10.0","l":"","m":1,"y":0,"w":756,"h":286,"a":"**A**\nImpulse = mΔv, so the greatest impulse needs the greatest change in velocity.\nFor v = −4 m s⁻¹: Δv = −4 − (+2) = −6 m s⁻¹, magnitude 6 m s⁻¹, which is the largest of the four options."}]},{"id":"a2b-11","t":"Question 31","s":"","W":769,"H":585,"p":[{"id":"a2b-11.0","l":"","m":1,"y":0,"w":769,"h":585,"a":"**C**\nInitial momentum is zero, so the masses leave with equal and opposite momenta p.\nE_{K} = p² / 2m, so for the same p, E_{K} ∝ 1/mass.\nE_{K}(m) / E_{K}(M) = M / m = **2**"}]},{"id":"a2b-12","t":"Question 32","s":"","W":840,"H":331,"p":[{"id":"a2b-12.0","l":"","m":1,"y":0,"w":840,"h":331,"a":"**D**\nThe ball rebounds to a lower height, so it leaves the ground with less kinetic energy than it arrived with. Kinetic energy is not conserved, so the collision is inelastic. (Momentum of the ball and Earth system is still conserved.)"}]},{"id":"a2b-13","t":"Question 33","s":"","W":878,"H":611,"p":[{"id":"a2b-13.0","l":"","m":1,"y":0,"w":878,"h":611,"a":"**B**\nImpulse = area under the force–time graph = change in momentum.\n½ × 100 × ΔT = mΔv = 1.5 × 10 = 15 N s\nΔT = 15 / 50 = **0.30 s**"}]},{"id":"a2b-14","t":"Question 34","s":"","W":610,"H":424,"p":[{"id":"a2b-14.0","l":"","m":1,"y":0,"w":610,"h":424,"a":"**A**\nTake right as positive and let each mass be m.\nm(6) + m(−4) = 2mv\nv = 2 / 2 = **1 m s⁻¹** (in the direction of the faster trolley)"}]},{"id":"a2b-15","t":"Question 35","s":"","W":904,"H":377,"p":[{"id":"a2b-15.0","l":"","m":1,"y":0,"w":904,"h":377,"a":"**D**\nWith no external forces, linear momentum must be conserved in every collision. By definition, kinetic energy is not conserved in an inelastic collision."}]},{"id":"a2b-16","t":"Question 36","s":"","W":899,"H":699,"p":[{"id":"a2b-16.0","l":"","m":1,"y":0,"w":899,"h":699,"a":"**A**\nTotal momentum before = mv to the right. Check each option:\nA: 0 + mv = mv ✓ (and kinetic energy is not increased)\nB: −½mv + ½mv = 0 ✗\nC: mv + mv = 2mv ✗\nD: −mv + mv = 0 ✗\nOnly A conserves momentum."}]},{"id":"a2b-17","t":"Question 37","s":"","W":721,"H":293,"p":[{"id":"a2b-17.0","l":"","m":1,"y":0,"w":721,"h":293,"a":"**D**\nNewton's third law always applies: the forces the two bodies exert on each other are equal in magnitude and opposite in direction, whatever the type of collision."}]},{"id":"a2b-18","t":"Question 38","s":"","W":536,"H":290,"p":[{"id":"a2b-18.0","l":"","m":1,"y":0,"w":536,"h":290,"a":"**B**\nMomentum is conserved in all collisions (with no external force). In an inelastic collision some kinetic energy is transferred to other forms such as thermal energy."}]},{"id":"a2b-19","t":"Question 39","s":"","W":558,"H":287,"p":[{"id":"a2b-19.0","l":"","m":1,"y":0,"w":558,"h":287,"a":"**A**\nImpulse = FΔt = Δp, the change in momentum of the body. (B is the definition of force.)"}]},{"id":"a2b-20","t":"Question 40","s":"","W":903,"H":534,"p":[{"id":"a2b-20.0","l":"","m":1,"y":0,"w":903,"h":534,"a":"**D**\nTake the direction away from the wall as positive.\nΔp = m(v − u) = 0.40 × (3.0 − (−5.0)) = 3.2 kg m s⁻¹\nF = Δp / Δt = 3.2 / 0.20 = **16 N**\nBy Newton's third law the ball exerts a force of the same magnitude on the wall."}]},{"id":"a1-18","t":"Question 41","s":"","W":899,"H":1477,"p":[{"id":"a1-18.0","l":"(a)","m":1,"y":0,"w":899,"h":184,"a":"A scalar has magnitude only. A vector has both magnitude and direction."},{"id":"a1-18.1","l":"(b)","m":2,"y":184,"w":889,"h":93,"a":"Underline **acceleration**, **momentum** and **weight**.\nKinetic energy and power are scalars."},{"id":"a1-18.2","l":"(c)(i)","m":1,"y":277,"w":889,"h":469,"a":"Horizontal component = 7.5 cos 40°\n**= 5.7 N**"},{"id":"a1-18.3","l":"(c)(ii)","m":1,"y":746,"w":850,"h":103,"a":"Vertical component = 7.5 sin 40°\n**= 4.8 N**"},{"id":"a1-18.4","l":"(d)","m":4,"y":849,"w":872,"h":628,"a":"The load is in equilibrium, so the resultant force is zero.\nHorizontally: T₁ cos 50° = T₂ cos 40°\nVertically: T₁ sin 50° + T₂ sin 40° = 7.5\nFrom the first equation T₂ = T₁ cos 50° / cos 40° = 0.839 T₁\nSubstituting: T₁ (sin 50° + 0.839 sin 40°) = 7.5, so 1.305 T₁ = 7.5\n**T₁ = 5.7 N**\n**T₂ = 0.839 × 5.75 = 4.8 N**\n(Shortcut: the strings are at 90° to each other, so the vector triangle is right angled: T₁ = 7.5 sin 50° and T₂ = 7.5 sin 40°.)"}]},{"id":"a3-2","t":"Question 42","s":"","W":905,"H":446,"p":[{"id":"a3-2.0","l":"","m":1,"y":0,"w":905,"h":446,"a":"**C**\nIn a head on elastic collision between identical masses, the spheres exchange velocities.\nX leaves with Y's original velocity: 2 m s⁻¹ to the left.\nY leaves with X's original velocity: 4 m s⁻¹ to the right.\nCheck: momentum before = 4m − 2m = 2m, after = −2m + 4m = 2m ✓"}]},{"id":"a3-5","t":"Question 43","s":"","W":902,"H":261,"p":[{"id":"a3-5.0","l":"","m":1,"y":0,"w":902,"h":261,"a":"**D**\nMomentum of the whole system (ball and racket) is always conserved when no external force acts. The ball's own momentum changes because it rebounds, and kinetic energy is only conserved if the collision is perfectly elastic."}]},{"id":"a3-14","t":"Question 44","s":"","W":858,"H":1953,"p":[{"id":"a3-14.0","l":"(a)","m":1,"y":0,"w":858,"h":168,"a":"Momentum is the product of mass and velocity (p = mv)."},{"id":"a3-14.1","l":"(b)(i)","m":3,"y":168,"w":852,"h":938,"a":"E_{K} = ½mv² = ½ × 0.24 × 2.3²\n**E_{K} = 0.63 J**"},{"id":"a3-14.2","l":"(b)(ii)","m":2,"y":1106,"w":820,"h":169,"a":"Change in momentum = area of the triangle under the graph\n= ½ × base × height = ½ × 5.0 × 10⁻³ × 240\n**Δp = 0.60 N s**"},{"id":"a3-14.3","l":"(b)(iii)","m":2,"y":1275,"w":826,"h":103,"a":"Initial momentum of Y = 0.12 × 2.3 = 0.276 N s (towards X).\nThe force from X acts in the opposite direction to Y's initial motion, so Y reverses.\nFinal momentum = 0.60 − 0.276 = 0.324 N s (away from X)\nv = 0.324 / 0.12\n**v = 2.7 m s⁻¹**"},{"id":"a3-14.4","l":"(c)","m":3,"y":1378,"w":856,"h":575,"a":"By Newton's third law, the force on X by Y is equal in magnitude and opposite in direction to the force on Y by X at every instant.\nThe sketch is the mirror image of Fig. 2.2 in the time axis:\n- straight line from (0, 0) down to (3.0 ms, −240 N)\n- straight line from (3.0 ms, −240 N) back up to (5.0 ms, 0)"}]},{"id":"a4-13","t":"Question 45","s":"","W":856,"H":915,"p":[{"id":"a4-13.0","l":"(a)","m":1,"y":0,"w":232,"h":77,"a":"One radian is the angle subtended at the centre of a circle by an arc equal in length to the radius of the circle."},{"id":"a4-13.1","l":"(b)","m":2,"y":77,"w":856,"h":571,"a":"The hand turns through 2π rad in one hour (3600 s).\nω = 2π / T = 2π / 3600\n**ω = 1.7 × 10⁻³ rad s⁻¹** (1.75 × 10⁻³)"},{"id":"a4-13.2","l":"(c)(i)","m":1,"y":648,"w":854,"h":106,"a":"θ = ωt = 1.75 × 10⁻³ × 1400\n**θ = 2.4 rad** (2.44)"},{"id":"a4-13.3","l":"(c)(ii)","m":2,"y":754,"w":256,"h":39,"a":"Arc length s = Lθ\nL = s / θ = 0.44 / 2.44\n**L = 0.18 m**"},{"id":"a4-13.4","l":"(c)(iii)","m":2,"y":793,"w":797,"h":39,"a":"a = ω²L = (1.75 × 10⁻³)² × 0.18\n**a = 5.5 × 10⁻⁷ m s⁻²**"},{"id":"a4-13.5","l":"(d)","m":2,"y":832,"w":856,"h":83,"a":"- The centripetal acceleration is extremely small compared with g (9.81 m s⁻²), so the centripetal force needed is negligible compared with the weight of the clay.\n- The force from the hand must supply the resultant of the centripetal force and the support for the weight. It is therefore almost exactly equal to the weight at every position, so its magnitude hardly changes during the revolution."}]},{"id":"a4-14","t":"Question 46","s":"","W":856,"H":1739,"p":[{"id":"a4-14.0","l":"(a)","m":1,"y":0,"w":236,"h":78,"a":"One radian is the angle subtended at the centre of a circle by an arc equal in length to the radius."},{"id":"a4-14.1","l":"(b)(i)","m":1,"y":78,"w":854,"h":564,"a":"Arrow V drawn from the clay along the **tangent** to its circular path, in the direction of rotation (anticlockwise). For the position shown this is **up and to the right**, perpendicular to the line joining the clay to the axis."},{"id":"a4-14.2","l":"(b)(ii)","m":1,"y":642,"w":818,"h":38,"a":"Arrow A drawn from the clay pointing **directly towards the axis** (the centre of the disc), up and to the left."},{"id":"a4-14.3","l":"(c)(i)","m":2,"y":680,"w":854,"h":129,"a":"Radius of the clay's path r = 9.3 − 1.2 = 8.1 cm = 0.081 m\nω = v / r = 0.68 / 0.081\n**ω = 8.4 rad s⁻¹**"},{"id":"a4-14.4","l":"(c)(ii)","m":2,"y":809,"w":687,"h":39,"a":"a = v² / r = 0.68² / 0.081\n**a = 5.7 m s⁻²**"},{"id":"a4-14.5","l":"(d)","m":3,"y":848,"w":856,"h":891,"a":"The second piece is closer to the axis. Mass does not affect any of these quantities.\n- angular speed: **same for both pieces** (every point on the disc turns through the same angle per second)\n- linear speed: **less for second piece** (v = ωr, smaller r)\n- acceleration: **less for second piece** (a = ω²r, smaller r)"}]},{"id":"a4-15","t":"Question 47","s":"","W":856,"H":1277,"p":[{"id":"a4-15.0","l":"(a)","m":2,"y":0,"w":731,"h":79,"a":"- The speed is constant, but the direction of the velocity changes continuously (it is always along the tangent), so the velocity is not constant.\n- The acceleration has constant magnitude and is always directed towards the centre of the circle, perpendicular to the velocity."},{"id":"a4-15.1","l":"(b)(i)","m":2,"y":79,"w":856,"h":732,"a":"The friction provides the centripetal force.\nF = mv² / r = (790 × 94²) / 318\n**F = 2.2 × 10⁴ N**"},{"id":"a4-15.2","l":"(b)(ii)","m":3,"y":811,"w":819,"h":466,"a":"The maximum friction force F and the mass are the same for both cars. Y has the larger radius.\n- centripetal acceleration: **Y same as X** (a = F / m)\n- maximum speed: **Y greater than X** (v = √(Fr / m), larger r)\n- time taken for one lap: **Y greater than X** (T = 2πr / v = 2π√(mr / F), which increases with r)"}]}]},{"k":"A3","n":"Work, Energy, Power","q":[{"id":"a3-1","t":"Question 1","s":"","W":901,"H":568,"p":[{"id":"a3-1.0","l":"","m":1,"y":0,"w":901,"h":568,"a":"**B**\nLoss of gravitational potential energy = mgh = 500 × 9.81 × 30 = 1.47 × 10⁵ J\nGain in kinetic energy = ½mv² = ½ × 500 × 11² = 3.0 × 10⁴ J\nEnergy dissipated by friction = 1.47 × 10⁵ − 0.30 × 10⁵ = **1.2 × 10⁵ J**"}]},{"id":"a3-3","t":"Question 2","s":"","W":904,"H":402,"p":[{"id":"a3-3.0","l":"","m":1,"y":0,"w":904,"h":402,"a":"**B**\nEnergy used for 100 km = (100 / 150) × 200 MJ = 133 MJ\nPower of supply P = IV = 13.0 × 230 = 2990 W\nt = E / P = 133 × 10⁶ / 2990 = 4.46 × 10⁴ s = **12.4 hours**"}]},{"id":"a3-4","t":"Question 3","s":"","W":902,"H":497,"p":[{"id":"a3-4.0","l":"","m":1,"y":0,"w":902,"h":497,"a":"**D**\nInput power = total output = 60 + 160 + 100 = 320 MW\nUseful power = 160 + 100 = 260 MW\nEfficiency = 260 / 320 = **81%**"}]},{"id":"a3-6","t":"Question 4","s":"","W":904,"H":216,"p":[{"id":"a3-6.0","l":"","m":1,"y":0,"w":904,"h":216,"a":"**B**\nWork done = gain in kinetic energy, so Fs = 8.0 − 4.0 = 4.0 J.\nNew work done = (2F)(2s) = 4Fs = 16 J\nNew kinetic energy = 4.0 + 16 = **20 J**"}]},{"id":"a3-7","t":"Question 5","s":"","W":900,"H":295,"p":[{"id":"a3-7.0","l":"","m":1,"y":0,"w":900,"h":295,"a":"**C**\nRate of gain of potential energy = mg × (vertical speed) = mgv sin θ\n= 1.2 × 10⁵ × 9.81 × 50 × sin 23°\n= **2.3 × 10⁷ J s⁻¹**"}]},{"id":"a3-8","t":"Question 6","s":"","W":902,"H":652,"p":[{"id":"a3-8.0","l":"","m":1,"y":0,"w":902,"h":652,"a":"**C**\nUse the height of the centre of mass.\nBefore: the block stands 0.6 m tall on the upper step, so its centre is 0.3 m above the step, which is 0.8 + 0.3 = 1.1 m above the lower floor.\nAfter: it lies with height 0.4 m, so its centre is 0.2 m above the lower floor.\nChange in height = 1.1 − 0.2 = 0.9 m\nΔE_{P} = weight × Δh = 500 × 0.9 = **450 J**"}]},{"id":"a3-9","t":"Question 7","s":"","W":903,"H":222,"p":[{"id":"a3-9.0","l":"","m":1,"y":0,"w":903,"h":222,"a":"**D**\nEach second, a mass m of sand gains horizontal momentum mv.\nForce needed = rate of change of momentum = mv\nPower = force × velocity = mv × v = **mv²**\n(Only ½mv² becomes kinetic energy of the sand. The rest is dissipated by friction while the sand slips on the belt.)"}]},{"id":"a3-10","t":"Question 8","s":"","W":904,"H":490,"p":[{"id":"a3-10.0","l":"","m":1,"y":0,"w":904,"h":490,"a":"**A**\nLoss of potential energy = mgh = 500 × 9.81 × 30 = 1.47 × 10⁵ J\nWork done against friction = Fd = 250 × 400 = 1.00 × 10⁵ J\nKinetic energy gained = 1.47 × 10⁵ − 1.00 × 10⁵ = 4.7 × 10⁴ J\nv = √(2E_{K} / m) = √(2 × 4.7 × 10⁴ / 500) = **14 m s⁻¹**"}]},{"id":"a3-11","t":"Question 9","s":"","W":862,"H":1176,"p":[{"id":"a3-11.0","l":"(a)(i)","m":1,"y":0,"w":862,"h":171,"a":"Power is the work done per unit time (rate of energy transfer)."},{"id":"a3-11.1","l":"(a)(ii)","m":2,"y":171,"w":819,"h":145,"a":"Work done W = force × displacement in the direction of the force = Fs\nP = W / t = Fs / t\nSince velocity v = s / t,\n**P = Fv**"},{"id":"a3-11.2","l":"(b)","m":1,"y":316,"w":855,"h":169,"a":"P = Fv, so driving force F = P / v = 130 × 10³ / 25 = 5200 N\nThe speed is constant, so the resultant force is zero and the resistive force equals the driving force = **5200 N**."},{"id":"a3-11.3","l":"(c)(i)","m":1,"y":485,"w":856,"h":499,"a":"Component of weight parallel to the road = **mg sin θ**"},{"id":"a3-11.4","l":"(c)(ii)","m":3,"y":984,"w":819,"h":192,"a":"At constant speed the driving force balances the resistive force plus the component of weight down the slope.\nF = 5200 + mg sin θ = 5200 + 36 000 × 9.81 × sin 1.4°\nF = 5200 + 8630 = 1.38 × 10⁴ N\nP = Fv = 1.38 × 10⁴ × 25 = 3.46 × 10⁵ W\n**P = 350 kW**"}]},{"id":"a3-12","t":"Question 10","s":"","W":865,"H":1390,"p":[{"id":"a3-12.0","l":"(a)(i)","m":1,"y":0,"w":865,"h":172,"a":"Power is the work done per unit time."},{"id":"a3-12.1","l":"(a)(ii)","m":2,"y":172,"w":821,"h":210,"a":"P = W / t and W = Fx\nSo P = Fx / t\nVelocity v = x / t, therefore **P = Fv**."},{"id":"a3-12.2","l":"(b)(i)","m":2,"y":382,"w":856,"h":541,"a":"Constant velocity, so the forces along the slope balance.\nT = component of weight down the slope = W sin θ = 430 sin 11°\n**T = 82 N**"},{"id":"a3-12.3","l":"(b)(ii)","m":1,"y":923,"w":819,"h":102,"a":"P = Tv\nv = P / T = 56 / 82\n**v = 0.68 m s⁻¹**"},{"id":"a3-12.4","l":"(b)(iii)","m":1,"y":1025,"w":825,"h":220,"a":"The block moves at constant velocity, so there is no gain in kinetic energy. All the useful work goes into gravitational potential energy."},{"id":"a3-12.5","l":"(b)(iv)","m":2,"y":1245,"w":825,"h":145,"a":"Efficiency = useful output power / input power\nInput power = 56 / 0.80 = 70 W\nt = E / P = 1.2 × 10³ / 70\n**t = 17 s**"}]},{"id":"a3-13","t":"Question 11","s":"","W":861,"H":1320,"p":[{"id":"a3-13.0","l":"(a)","m":1,"y":0,"w":861,"h":169,"a":"Power is the work done per unit time."},{"id":"a3-13.1","l":"(b)(i)","m":1,"y":169,"w":857,"h":567,"a":"**0 J.** The velocity is constant, so the kinetic energy does not change."},{"id":"a3-13.2","l":"(b)(ii)","m":1,"y":736,"w":818,"h":101,"a":"W = Fs = 440 × 25\n**W = 1.1 × 10⁴ J**"},{"id":"a3-13.3","l":"(c)(i)","m":2,"y":837,"w":855,"h":214,"a":"ΔE_{P} = mgh\nh = ΔE_{P} / mg = 4.8 × 10⁴ / (1700 × 9.81)\n**h = 2.9 m**"},{"id":"a3-13.4","l":"(c)(ii)","m":1,"y":1051,"w":818,"h":101,"a":"sin θ = h / 25 = 2.88 / 25\n**θ = 6.6°**"},{"id":"a3-13.5","l":"(d)","m":2,"y":1152,"w":855,"h":168,"a":"Total work done by the engine = gain in potential energy + work against resistive force\n= 4.8 × 10⁴ + 1.1 × 10⁴ = 5.9 × 10⁴ J\nt = W / P = 5.9 × 10⁴ / 1.7 × 10⁴\n**t = 3.5 s**"}]},{"id":"a3-15","t":"Question 12","s":"","W":865,"H":1409,"p":[{"id":"a3-15.0","l":"(a)","m":2,"y":0,"w":865,"h":631,"a":"Difference in height between X and Y = 4.0 − 1.1 = 2.9 m\nΔE_{P} = weight × Δh = 330 × 2.9\n**ΔE_{P} = 960 J** (957 J)"},{"id":"a3-15.1","l":"(b)","m":2,"y":631,"w":849,"h":146,"a":"Loss of potential energy = gain in kinetic energy + work done against friction\n957 = 540 + 52d\nd = (957 − 540) / 52\n**d = 8.0 m**"},{"id":"a3-15.2","l":"(c)(i)","m":2,"y":777,"w":854,"h":530,"a":"Mass of child m = W / g = 330 / 9.81 = 33.6 kg\nE_{K} = ½mv²\nv = √(2 × 540 / 33.6)\n**v = 5.7 m s⁻¹**"},{"id":"a3-15.3","l":"(c)(ii)","m":2,"y":1307,"w":818,"h":102,"a":"At the highest point Z the vertical component of velocity is zero, so the speed equals the horizontal component, which stays constant.\nv_{Z} = 5.67 cos 41°\n**v_{Z} = 4.3 m s⁻¹**"}]},{"id":"a3-16","t":"Question 13","s":"","W":865,"H":1808,"p":[{"id":"a3-16.0","l":"(a)(i)","m":2,"y":0,"w":865,"h":346,"a":"P = Fv = 18 × 1.4\n**P = 25 W**"},{"id":"a3-16.1","l":"(a)(ii)","m":3,"y":346,"w":818,"h":100,"a":"Deceleration a = F / m = 18 / 72 = 0.25 m s⁻²\nv = u + at with v = 0:\nt = u / a = 1.4 / 0.25\n**t = 5.6 s**"},{"id":"a3-16.2","l":"(b)(i)","m":3,"y":446,"w":855,"h":583,"a":"Resultant force down the slope = 54 − 18 = 36 N\na = F / m = 36 / 72 = 0.50 m s⁻²\nv² = u² + 2as = 0 + 2 × 0.50 × 9.5\n**v = 3.1 m s⁻¹**"},{"id":"a3-16.3","l":"(b)(ii)","m":1,"y":1029,"w":818,"h":100,"a":"W = Fs = 54 × 9.5\n**W = 510 J**"},{"id":"a3-16.4","l":"(b)(iii)","m":2,"y":1129,"w":824,"h":459,"a":"Work done = F × s and s = ½at², so W = ½Fat². Work done is proportional to t².\nSketch a **curve starting at the origin with an increasing gradient** (a parabola curving upwards). It is not a straight line, because the trolley covers more distance in each successive second."},{"id":"a3-16.5","l":"(c)","m":1,"y":1588,"w":855,"h":220,"a":"The trolley accelerates, so its speed increases, and air resistance increases with speed. The total resistive force therefore increases between X and Y."}]},{"id":"a3-17","t":"Question 14","s":"","W":874,"H":1730,"p":[{"id":"a3-17.0","l":"(a)","m":1,"y":0,"w":874,"h":175,"a":"The force is directly proportional to the extension (or compression), provided the limit of proportionality is not exceeded."},{"id":"a3-17.1","l":"(b)","m":2,"y":175,"w":855,"h":488,"a":"Elastic potential energy = area under the force–compression graph\nAt x = 16.0 cm = 0.160 m, F = 8.0 N\nE = ½Fx = ½ × 8.0 × 0.160\n**E = 0.64 J**"},{"id":"a3-17.2","l":"(c)(i)","m":2,"y":663,"w":856,"h":696,"a":"½mv² = 0.64\nv = √(2 × 0.64 / 0.076)\n**v = 4.1 m s⁻¹**"},{"id":"a3-17.3","l":"(c)(ii)","m":3,"y":1359,"w":817,"h":101,"a":"Height gained at the top of the loop = diameter = 2 × 0.12 = 0.24 m\nGain in potential energy = mgh = 0.076 × 9.81 × 0.24 = 0.179 J\nE_{K} at top = 0.64 − 0.179\n**E_{K} = 0.46 J**"},{"id":"a3-17.4","l":"(c)(iii)","m":1,"y":1460,"w":823,"h":101,"a":"Y is at the same height as X and there are no energy losses, so the kinetic energy is the same.\n**v = 4.1 m s⁻¹**"},{"id":"a3-17.5","l":"(d)","m":3,"y":1561,"w":855,"h":169,"a":"Distance travelled from X to Y = 0.30 + 2π × 0.12 + 0.25 = 1.30 m\nWork done against resistive force = loss of kinetic energy = 0.23 J\nF = W / d = 0.23 / 1.30\n**F = 0.18 N**"}]},{"id":"a3-18","t":"Question 15","s":"","W":866,"H":1801,"p":[{"id":"a3-18.0","l":"(a)(i)","m":2,"y":0,"w":866,"h":568,"a":"F₁ = kx = 800 × 0.045\n**F₁ = 36 N**"},{"id":"a3-18.1","l":"(a)(ii)","m":2,"y":568,"w":821,"h":123,"a":"Elastic potential energy = area under the graph (a triangle)\nE = ½F₁x = ½ × 36 × 0.045\n**E = 0.81 J**"},{"id":"a3-18.2","l":"(b)(i)","m":1,"y":691,"w":856,"h":235,"a":"Efficiency = (useful energy output / energy input) × 100 = (0.72 / 0.81) × 100\n**= 89%**"},{"id":"a3-18.3","l":"(b)(ii)","m":3,"y":926,"w":818,"h":100,"a":"E_{K} = ½mv², so v = √(2 × 0.72 / 0.020) = 8.49 m s⁻¹\np = mv = 0.020 × 8.49\n**p = 0.17 N s**\n(Or directly: p = √(2mE_{K}).)"},{"id":"a3-18.4","l":"(c)(i)","m":2,"y":1026,"w":854,"h":457,"a":"ΔE_{P} = mgh\nh = 0.60 / (0.020 × 9.81)\n**h = 3.1 m**"},{"id":"a3-18.5","l":"(c)(ii)","m":2,"y":1483,"w":819,"h":119,"a":"Work done against air resistance = 0.72 − 0.60 = 0.12 J\nF = W / h = 0.12 / 3.06\n**F = 0.039 N**"},{"id":"a3-18.6","l":"(c)(iii)","m":1,"y":1602,"w":821,"h":199,"a":"**More than T.** Without air resistance the only force is the weight, so the deceleration is smaller (just g). The ball takes longer to come to rest and also rises higher."}]},{"id":"a3-19","t":"Question 16","s":"","W":856,"H":1909,"p":[{"id":"a3-19.0","l":"(a)","m":2,"y":0,"w":844,"h":279,"a":"1. The resultant force is zero (in any direction).\n2. The resultant moment (torque) about any point is zero."},{"id":"a3-19.1","l":"(b)(i)","m":2,"y":279,"w":837,"h":656,"a":"Vertically: T sin 53° = 2.4\n**T = 2.4 / sin 53° = 3.0 N**\nHorizontally: F = T cos 53° = 3.0 × cos 53°\n**F = 1.8 N**"},{"id":"a3-19.2","l":"(b)(ii)","m":3,"y":935,"w":802,"h":117,"a":"Cross sectional area A = πd² / 4 = π × (0.50 × 10⁻³)² / 4 = 1.96 × 10⁻⁷ m²\nσ = T / A = 3.0 / 1.96 × 10⁻⁷\n**σ = 1.5 × 10⁷ Pa**"},{"id":"a3-19.3","l":"(c)(i)","m":1,"y":1052,"w":856,"h":612,"a":"Vertical distance of A below P = 75 sin 53° = 59.9 cm\nAt B the sphere is 75 cm below P.\nh = 75 − 59.9 = 15.1 cm ≈ **15 cm**"},{"id":"a3-19.4","l":"(c)(ii)","m":2,"y":1664,"w":821,"h":120,"a":"ΔE_{P} = weight × h = 2.4 × 0.15\n**ΔE_{P} = 0.36 J** (a decrease)"},{"id":"a3-19.5","l":"(c)(iii)","m":3,"y":1784,"w":823,"h":125,"a":"Loss of potential energy = gain in kinetic energy\nMass m = W / g = 2.4 / 9.81 = 0.245 kg\n½mv² = 0.36\nv = √(2 × 0.36 / 0.245)\n**v = 1.7 m s⁻¹**"}]},{"id":"a3-20","t":"Question 17","s":"","W":886,"H":1483,"p":[{"id":"a3-20.0","l":"(a)(i)","m":1,"y":0,"w":886,"h":168,"a":"Power is the work done per unit time."},{"id":"a3-20.1","l":"(a)(ii)","m":1,"y":168,"w":845,"h":133,"a":"The energy stored in a mass due to its position (height) in a gravitational field."},{"id":"a3-20.2","l":"(b)(i)","m":2,"y":301,"w":883,"h":513,"a":"P = Fv = 2.0 × 10³ × 45\n**P = 9.0 × 10⁴ W**"},{"id":"a3-20.3","l":"(b)(ii)1","m":2,"y":814,"w":834,"h":147,"a":"t = 3.0 × 60 = 180 s\nW = Pt = 9.0 × 10⁴ × 180\n**W = 1.6 × 10⁷ J**"},{"id":"a3-20.4","l":"(b)(ii)2","m":2,"y":961,"w":791,"h":101,"a":"Height gained = 3.3 × 180 = 594 m\nΔE_{P} = mgh = 1200 × 9.81 × 594\n**ΔE_{P} = 7.0 × 10⁶ J**"},{"id":"a3-20.5","l":"(b)(ii)3","m":1,"y":1062,"w":791,"h":101,"a":"The velocity is constant, so no work goes into kinetic energy.\nWork against air resistance = 1.62 × 10⁷ − 0.70 × 10⁷\n**= 9.2 × 10⁶ J**"},{"id":"a3-20.6","l":"(b)(iii)","m":1,"y":1163,"w":842,"h":119,"a":"Distance moved along the path = vt = 45 × 180 = 8100 m\nF = W / d = 9.2 × 10⁶ / 8100\n**F = 1100 N**"},{"id":"a3-20.7","l":"(b)(iv)","m":2,"y":1282,"w":841,"h":201,"a":"The aircraft moves with constant velocity, so its acceleration is zero and the resultant force on it is zero. Therefore the aircraft **is in equilibrium**."}]},{"id":"a1-11","t":"Question 18","s":"","W":907,"H":1137,"p":[{"id":"a1-11.0","l":"(a)","m":2,"y":0,"w":907,"h":426,"a":"Vectors: acceleration, displacement.\nScalars: gravitational potential energy, speed, temperature.\n[2 marks for all five correct, 1 mark for four correct.]"},{"id":"a1-11.1","l":"(b)(i)","m":3,"y":426,"w":897,"h":255,"a":"Work done on the car W = Fs.\nFrom Newton's second law F = ma, so W = mas.\nThe car starts from rest, so v² = 0 + 2as, giving as = ½v².\nTherefore W = m × ½v² = ½mv².\nAll the work done by the resultant force becomes kinetic energy, so **E_{K} = ½mv²**."},{"id":"a1-11.2","l":"(b)(ii)","m":1,"y":681,"w":859,"h":153,"a":"E_{K} = ½mv² = ½ × 920 × 17²\n**E_{K} = 1.3 × 10⁵ J** (1.33 × 10⁵ J)"},{"id":"a1-11.3","l":"(b)(iii)","m":3,"y":834,"w":864,"h":151,"a":"Total work done by the car = gain in kinetic energy + work done against resistive forces\n= 1.33 × 10⁵ + 4.7 × 10⁴ = 1.80 × 10⁵ J\nAverage power = work done / time = 1.80 × 10⁵ / 5.8\n**P = 3.1 × 10⁴ W**"},{"id":"a1-11.4","l":"(b)(iv)","m":1,"y":985,"w":864,"h":152,"a":"**Less than.** At constant speed the kinetic energy is no longer increasing, so the car only does work against the resistive forces. Before t = 5.8 s it also had to supply the gain in kinetic energy."}]}]},{"k":"A4","n":"Rigid body mechanics","q":[{"id":"a4-1","t":"Question 1","s":"","W":908,"H":338,"p":[{"id":"a4-1.0","l":"","m":3,"y":0,"w":908,"h":338,"a":"Loss of gravitational potential energy = gain in translational kinetic energy + gain in rotational kinetic energy\nmgh = ½mv² + ½Iω²\nRolling without slipping, so ω = v / r, and I = (2/5)mr²:\nmgh = ½mv² + ½ × (2/5)mr² × (v / r)²\nmgh = ½mv² + (1/5)mv² = (7/10)mv²\nv² = 10gh / 7\n**v = √(10gh / 7)**"}]},{"id":"a4-2","t":"Question 2","s":"","W":908,"H":800,"p":[{"id":"a4-2.0","l":"(a)","m":2,"y":0,"w":908,"h":346,"a":"Angular displacement θ = 6 × 2π = 37.7 rad\nω² = ω₀² + 2αθ = 0 + 2 × 0.110 × 37.7 = 8.29\nω = 2.88 rad s⁻¹ ≈ 3 rad s⁻¹"},{"id":"a4-2.1","l":"(b)","m":1,"y":346,"w":900,"h":354,"a":"θ = ½αt², so the graph is a **curve from the origin with an increasing gradient** (a parabola curving upwards). The gradient is the angular velocity, which increases uniformly."},{"id":"a4-2.2","l":"(c)","m":1,"y":700,"w":847,"h":39,"a":"τ = Iα = 0.0216 × 0.110\n**τ = 2.4 × 10⁻³ N m**"},{"id":"a4-2.3","l":"(d)","m":2,"y":739,"w":847,"h":61,"a":"θ = 30 × 2π = 188 rad. Initial angular velocity 2.88 rad s⁻¹, final angular velocity zero.\nθ = ½(ω_{i} + ω_{f})t\nt = 2θ / ω_{i} = (2 × 188) / 2.88\n**t = 130 s** (131 s)"}]},{"id":"a4-3","t":"Question 3","s":"","W":897,"H":566,"p":[{"id":"a4-3.0","l":"(a)","m":2,"y":0,"w":897,"h":241,"a":"Total kinetic energy = translational + rotational\nE_{K} = ½mv² + ½Iω²\nRolling without slipping: ω = v / r\nE_{K} = ½mv² + ½ × (2/5)mr² × (v² / r²)\nE_{K} = ½mv² + (1/5)mv² = **(7/10)mv²**"},{"id":"a4-3.1","l":"(b)","m":3,"y":241,"w":831,"h":325,"a":"Conservation of energy: kinetic energy at the bottom = kinetic energy at the top + loss of potential energy\n(7/10)mv² = (7/10)mu² + mgh\nv² = u² + 10gh / 7 = 0.50² + (10 × 9.81 × 0.45) / 7 = 0.25 + 6.31\n**v = 2.6 m s⁻¹**\n(The mass cancels, so the 1.5 kg is not needed.)"}]},{"id":"a4-4","t":"Question 4","s":"","W":894,"H":495,"p":[{"id":"a4-4.0","l":"(a)","m":1,"y":0,"w":894,"h":398,"a":"The ladder is in translational equilibrium, so the resultant horizontal force is zero. The only horizontal forces are the normal force from the wall and the friction from the ground, so they must be equal in magnitude and opposite in direction."},{"id":"a4-4.1","l":"(b)","m":2,"y":398,"w":831,"h":38,"a":"Take moments about the foot of the ladder (the weight acts at the centre, 2.00 m along the ladder):\nN_{wall} × 4.00 sin 60° = 50.0 × 2.00 cos 60°\nN_{wall} = 50.0 / (2 tan 60°) = 14.4 N\n**F = 14.4 N**"},{"id":"a4-4.2","l":"(c)","m":2,"y":436,"w":831,"h":59,"a":"Normal force from the ground = weight = 50.0 N (vertical equilibrium)\nMaximum friction available = μN = 0.400 × 50.0 = 20.0 N\nThe friction needed is only 14.4 N, which is less than 20.0 N, so **the ladder will not slip**."}]},{"id":"a4-5","t":"Question 5","s":"","W":895,"H":1018,"p":[{"id":"a4-5.0","l":"(a)(i)","m":3,"y":0,"w":895,"h":659,"a":"Block (Newton's second law): (M/4)g − T = (M/4)a\nCylinder (torque): TR = Iα = ½MR²α, so T = ½MRα\nThe rope does not slip, so a = αR.\nSubstituting: (M/4)g − ½MRα = (M/4)Rα\n(M/4)g = ¾MRα\n**α = g / 3R**"},{"id":"a4-5.1","l":"(a)(ii)","m":1,"y":659,"w":783,"h":60,"a":"T = ½MRα = ½MR × (g / 3R)\n**T = Mg / 6**"},{"id":"a4-5.2","l":"(b)","m":2,"y":719,"w":830,"h":60,"a":"Linear acceleration of the block a = αR = g / 3 = 3.27 m s⁻²\ns = ½at²\nt = √(2s / a) = √(2 × 0.50 / 3.27) = 0.553 s ≈ 0.55 s"},{"id":"a4-5.3","l":"(c)(i)","m":2,"y":779,"w":830,"h":202,"a":"α = g / 3R = 9.81 / (3 × 0.20) = 16.4 rad s⁻²\nω = αt = 16.4 × 0.553 = 9.04 rad s⁻¹\nI = ½MR² = ½ × 12 × 0.20² = 0.24 kg m²\nL = Iω = 0.24 × 9.04\n**L = 2.2 kg m² s⁻¹**"},{"id":"a4-5.4","l":"(c)(ii)","m":2,"y":981,"w":783,"h":37,"a":"E_{K} = ½Iω² = ½ × 0.24 × 9.04²\n**E_{K} = 9.8 J**\n(Check: the block loses 3.0 × 9.81 × 0.50 = 14.7 J of potential energy. The cylinder gains 9.8 J and the block gains 4.9 J.)"}]},{"id":"a4-6","t":"Question 6","s":"","W":880,"H":1525,"p":[{"id":"a4-6.0","l":"(a)(i)","m":1,"y":0,"w":880,"h":940,"a":"Moment of inertia is a measure of a body's resistance to a change in its rotational motion (to angular acceleration). It is the rotational equivalent of mass and depends on how the mass is distributed about the axis of rotation (I = Σmr²)."},{"id":"a4-6.1","l":"(a)(ii)","m":3,"y":940,"w":800,"h":83,"a":"Loss of potential energy = translational kinetic energy + rotational kinetic energy\nmgh = ½mv² + ½Iω²\nThe shaft rolls on the rails, so ω = v / r with r = 1.2 cm = 0.012 m.\n0.25 × 9.81 × 0.36 = ½ × 0.25 × v² + ½ × 1.3 × 10⁻⁴ × v² / 0.012²\n0.883 = 0.125v² + 0.451v² = 0.576v²\nv = 1.24 m s⁻¹ ≈ 1 m s⁻¹"},{"id":"a4-6.2","l":"(a)(iii)","m":1,"y":1023,"w":800,"h":38,"a":"ω = v / r = 1.24 / 0.012\n**ω = 100 rad s⁻¹** (103 rad s⁻¹)"},{"id":"a4-6.3","l":"(b)(i)","m":2,"y":1061,"w":849,"h":426,"a":"F acts in the direction of motion of the wheel, so it is a resultant forward force on the wheel. The wheel has a linear acceleration, so its **linear speed increases** (until it rolls without slipping)."},{"id":"a4-6.4","l":"(b)(ii)","m":2,"y":1487,"w":800,"h":38,"a":"F acts at the edge of the wheel, so it produces a torque about the axis. This torque is in the opposite sense to the rotation, giving an angular deceleration, so the **angular speed decreases**.\n(On the flat track the wheel rolls on its rim, radius 4.0 cm. The rim is moving at ωR = 103 × 0.040 = 4.1 m s⁻¹, much faster than the 1.2 m s⁻¹ of the centre, which is why it slips.)"}]},{"id":"a4-7","t":"Question 7","s":"","W":910,"H":898,"p":[{"id":"a4-7.0","l":"(a)","m":2,"y":0,"w":910,"h":507,"a":"Radius r = 4.00 / 2 = 2.00 m\nτ = Fr = 50.0 × 2.00 = 100 N m\nα = τ / I = 100 / 450 = 0.22 rad s⁻² ≈ 0.2 rad s⁻²"},{"id":"a4-7.1","l":"(b)(i)","m":1,"y":507,"w":849,"h":127,"a":"One revolution: θ = 2π rad\nω² = 2αθ = 2 × 0.222 × 2π = 2.79\n**ω = 1.7 rad s⁻¹** (1.67)"},{"id":"a4-7.2","l":"(b)(ii)","m":1,"y":634,"w":801,"h":37,"a":"L = Iω = 450 × 1.67\n**L = 750 kg m² s⁻¹**"},{"id":"a4-7.3","l":"(c)","m":2,"y":671,"w":850,"h":105,"a":"Moment of inertia of the child = mr² = 30.0 × 2.00² = 120 kg m²\nNo external torque acts, so angular momentum is conserved:\n450 × 1.67 = (450 + 120)ω\n**ω = 1.3 rad s⁻¹** (1.32)"},{"id":"a4-7.4","l":"(d)(i)","m":2,"y":776,"w":849,"h":83,"a":"- As the child moves towards the centre, the child's distance from the axis decreases, so the moment of inertia of the system decreases.\n- No external torque acts, so angular momentum L = Iω is conserved. A smaller I therefore means a larger ω."},{"id":"a4-7.5","l":"(d)(ii)","m":2,"y":859,"w":801,"h":39,"a":"At the centre the child's moment of inertia is zero, so I = 450 kg m² and ω is back to 1.67 rad s⁻¹.\nRotational kinetic energy before = ½ × 570 × 1.32² = 496 J\nRotational kinetic energy after = ½ × 450 × 1.67² = 628 J\nWork done by the child = gain in kinetic energy = 628 − 496\n**W = 130 J**"}]},{"id":"a4-8","t":"Question 8","s":"","W":851,"H":748,"p":[{"id":"a4-8.0","l":"(a)","m":2,"y":0,"w":851,"h":499,"a":"Three forces:\n- **Weight** (mg) acting vertically downwards from the centre of the hoop.\n- **Normal reaction** acting from the point of contact, perpendicular to the plane (through the centre of the hoop).\n- **Friction** acting at the point of contact, parallel to the plane and directed **up** the slope."},{"id":"a4-8.1","l":"(b)","m":4,"y":499,"w":783,"h":99,"a":"Translation along the plane: mg sin θ − F = ma, where F is the friction.\nRotation about the centre: only friction has a torque, Fr = Iα.\nI = mr² and, rolling without slipping, α = a / r:\nFr = mr² × (a / r), so F = ma\nSubstituting: mg sin θ − ma = ma\n2ma = mg sin θ\n**a = g sin θ / 2**"},{"id":"a4-8.2","l":"(c)","m":1,"y":598,"w":785,"h":57,"a":"a = (9.81 × sin 20°) / 2\n**a = 1.7 m s⁻²**"},{"id":"a4-8.3","l":"(d)","m":2,"y":655,"w":785,"h":36,"a":"From (b), F = ma = ½mg sin θ.\nThe friction force is proportional to sin θ, so it increases as the angle of the incline increases."},{"id":"a4-8.4","l":"(e)","m":3,"y":691,"w":785,"h":57,"a":"Normal reaction N = mg cos θ.\nThe hoop begins to slip when the friction needed equals the maximum available, F = μN:\n½mg sin θ = μmg cos θ\ntan θ = 2μ\n**θ = tan⁻¹(2μ)**"}]},{"id":"a4-9","t":"Question 9","s":"","W":908,"H":1248,"p":[{"id":"a4-9.0","l":"(a)(i)","m":1,"y":0,"w":908,"h":548,"a":"**Zero.** The two forces are equal in magnitude and opposite in direction, so the resultant force on the probe is zero."},{"id":"a4-9.1","l":"(a)(ii)","m":2,"y":548,"w":797,"h":37,"a":"Each force acts at r = 6.0 m from the axis and both torques act in the same sense.\nτ = 2Fr = 2 × 9.60 × 10³ × 6.0\n**τ = 1.15 × 10⁵ N m**"},{"id":"a4-9.2","l":"(b)","m":2,"y":585,"w":846,"h":60,"a":"α = τ / I = 1.15 × 10⁵ / 1.44 × 10⁴ = 8.0 rad s⁻²\nω = αt = 8.0 × 2.00 = 16 rad s⁻¹"},{"id":"a4-9.3","l":"(c)(i)","m":2,"y":645,"w":844,"h":543,"a":"No external torque acts, so angular momentum is conserved:\nI_{probe}ω = (I_{probe} + I_{satellite})ω′\n1.44 × 10⁴ × 16 = (1.44 × 10⁴ + 4.80 × 10³)ω′\n**ω′ = 12 rad s⁻¹**"},{"id":"a4-9.4","l":"(c)(ii)","m":3,"y":1188,"w":795,"h":60,"a":"Before: E_{K} = ½ × 1.44 × 10⁴ × 16² = 1.84 × 10⁶ J\nAfter: E_{K} = ½ × 1.92 × 10⁴ × 12² = 1.38 × 10⁶ J\n**Loss = 4.6 × 10⁵ J**"}]},{"id":"a4-10","t":"Question 10","s":"","W":907,"H":1056,"p":[{"id":"a4-10.0","l":"(a)(i)","m":1,"y":0,"w":907,"h":707,"a":"Only the moving particle has angular momentum, and it moves at right angles to the bar at a distance R from the axis.\n**L = (M/3)vR = MvR / 3**"},{"id":"a4-10.1","l":"(a)(ii)","m":1,"y":707,"w":796,"h":106,"a":"Both masses are at a distance R from the axis.\nI = MR² + (M/3)R² = (4/3)MR²\nL = Iω = **(4/3)MR²ω**"},{"id":"a4-10.2","l":"(a)(iii)","m":1,"y":813,"w":797,"h":57,"a":"Angular momentum is conserved in the collision:\nMvR / 3 = (4/3)MR²ω\n**ω = v / 4R**"},{"id":"a4-10.3","l":"(a)(iv)","m":3,"y":870,"w":797,"h":37,"a":"Initial kinetic energy = ½(M/3)v² = Mv² / 6\nFinal kinetic energy = ½Iω² = ½ × (4/3)MR² × (v / 4R)² = Mv² / 24\nEnergy lost = Mv² / 6 − Mv² / 24\n**= Mv² / 8**"},{"id":"a4-10.4","l":"(b)(i)","m":1,"y":907,"w":845,"h":111,"a":"I = (4/3)MR² = (4/3) × 0.70 × 0.50² = 0.233 kg m²\nα = τ / I = 0.010 / 0.233 = 0.043 rad s⁻²"},{"id":"a4-10.5","l":"(b)(ii)","m":3,"y":1018,"w":797,"h":38,"a":"Initial angular velocity ω = v / 4R = 2.1 / (4 × 0.50) = 1.05 rad s⁻¹\n0 = ω² − 2αθ\nθ = ω² / 2α = 1.05² / (2 × 0.043) = 12.8 rad\nNumber of revolutions = 12.8 / 2π\n**= 2.0 revolutions**"}]},{"id":"a4-11","t":"Question 11","s":"","W":910,"H":1511,"p":[{"id":"a4-11.0","l":"(a)","m":1,"y":0,"w":910,"h":672,"a":"**Zero.** The line of action of W passes through the axis of rotation, so its perpendicular distance from the axis is zero."},{"id":"a4-11.1","l":"(b)(i)","m":1,"y":672,"w":901,"h":527,"a":"The area is the angular impulse, which equals the **change in angular momentum** of the flywheel."},{"id":"a4-11.2","l":"(b)(ii)","m":2,"y":1199,"w":801,"h":38,"a":"Area under the graph = ½ × 1.00 × 0.40 + 4.00 × 0.40 = 1.80 N m s\nI = ½MR² = ½ × 5.00 × 0.0600² = 9.00 × 10⁻³ kg m²\nThe flywheel starts from rest, so Iω = 1.80\nω = 1.80 / 9.00 × 10⁻³ = 200 rad s⁻¹"},{"id":"a4-11.3","l":"(b)(iii)","m":1,"y":1237,"w":801,"h":38,"a":"The maximum torque is 0.40 N m, and the tension acts at the radius of the axle.\nT = Γ / r = 0.40 / 0.0120\n**T = 33 N**"},{"id":"a4-11.4","l":"(c)(i)","m":2,"y":1275,"w":850,"h":128,"a":"**Translational equilibrium:** the resultant force on the body is zero, so its centre of mass has no linear acceleration.\n**Rotational equilibrium:** the resultant torque on the body is zero, so it has no angular acceleration.\n(The flywheel here is in translational equilibrium but not rotational equilibrium, because the frictional torque slows it down.)"},{"id":"a4-11.5","l":"(c)(ii)","m":3,"y":1403,"w":801,"h":108,"a":"θ = 8.00 × 10³ × 2π = 5.03 × 10⁴ rad\n0 = ω² − 2αθ\nα = ω² / 2θ = 200² / (2 × 5.03 × 10⁴) = 0.398 rad s⁻²\nτ = Iα = 9.00 × 10⁻³ × 0.398\n**τ = 3.6 × 10⁻³ N m**"}]},{"id":"a4-12","t":"Question 12","s":"","W":908,"H":662,"p":[{"id":"a4-12.0","l":"(a)","m":2,"y":0,"w":908,"h":310,"a":"Take moments about the pivot. The weight acts at the centre of the rod, 2.50 m from the pivot.\nF × 4.00 = 36.0 × 2.50\n**F = 22.5 N**"},{"id":"a4-12.1","l":"(b)(i)","m":2,"y":310,"w":846,"h":114,"a":"The only torque about the pivot is that of the weight.\nτ = 36.0 × 2.50 = 90.0 N m\nα = τ / I = 90.0 / 30.6\n**α = 2.94 rad s⁻²**"},{"id":"a4-12.2","l":"(b)(ii)","m":2,"y":424,"w":798,"h":109,"a":"- The equation only applies when the angular acceleration is constant.\n- As the rod rotates, the perpendicular distance from the pivot to the line of action of the weight decreases (τ = W × 2.50 cos θ), so the torque and the angular acceleration decrease. They fall to zero when the rod is vertical."},{"id":"a4-12.3","l":"(c)(i)","m":3,"y":533,"w":846,"h":91,"a":"The centre of mass falls 2.50 m. Loss of potential energy = gain in rotational kinetic energy.\nW × 2.50 = ½Iω²\n36.0 × 2.50 = ½ × 30.6 × ω²\nω = √(180 / 30.6) = 2.43 rad s⁻¹"},{"id":"a4-12.4","l":"(c)(ii)","m":1,"y":624,"w":798,"h":38,"a":"L = Iω = 30.6 × 2.43\n**L = 74.4 kg m² s⁻¹**"}]}]}]},{"k":"B","n":"The particulate nature of matter","units":[{"k":"B1","n":"Thermal energy transfers","q":[{"id":"bt-3","t":"Question 1","s":"","W":907,"H":363,"p":[{"id":"bt-3.0","l":"","m":1,"y":0,"w":907,"h":363,"a":"**B**\nEnergy supplied by the heater = Pt\nEnergy used to vaporise the liquid = mL\nEnergy transferred to the surroundings = **Pt − mL**"}]},{"id":"bt-5","t":"Question 2","s":"","W":879,"H":353,"p":[{"id":"bt-5.0","l":"","m":1,"y":0,"w":879,"h":353,"a":"**B**\nP = (Δm / Δt) cΔT\nΔm / Δt = P / (cΔT) = 2400 / (4000 × 6.0) = **0.1 kg s⁻¹**"}]},{"id":"bt-6","t":"Question 3","s":"","W":772,"H":660,"p":[{"id":"bt-6.0","l":"","m":1,"y":0,"w":772,"h":660,"a":"**A**\nEnergy is supplied at a constant rate, so the length of each flat section is proportional to the latent heat. The second flat section (boiling) is longer than the first (melting), so L(vaporization) > L(fusion).\nA steeper slope means a smaller specific heat capacity. The solid and vapour lines are both steeper than the liquid line, so C and D are wrong."}]},{"id":"bt-8","t":"Question 4","s":"","W":831,"H":364,"p":[{"id":"bt-8.0","l":"","m":1,"y":0,"w":831,"h":364,"a":"**B**\nVolume of Y = (2L)³ = 8L³, so Y has 8 times the mass of X.\nFor X: Q = mcΔT\nFor Y: 2Q = (8m)cΔT′\nΔT′ = 2Q / 8mc = **ΔT / 4**"}]},{"id":"bt-9","t":"Question 5","s":"","W":846,"H":287,"p":[{"id":"bt-9.0","l":"","m":1,"y":0,"w":846,"h":287,"a":"**A**\nOne kelvin is the same size as one degree Celsius, so a temperature change has the same numerical value on both scales. The 273 cancels: (θ₂ + 273) − (θ₁ + 273) = θ₂ − θ₁."}]},{"id":"bt-10","t":"Question 6","s":"","W":837,"H":610,"p":[{"id":"bt-10.0","l":"","m":1,"y":0,"w":837,"h":610,"a":"**B**\nDuring QR the solid is melting. The energy supplied increases the intermolecular potential energy as bonds are broken. The mean kinetic energy of the molecules stays constant, and temperature is a measure of mean kinetic energy, so the temperature is constant."}]},{"id":"bt-11","t":"Question 7","s":"","W":907,"H":1920,"p":[{"id":"bt-11.0","l":"(a)(i)","m":3,"y":0,"w":907,"h":569,"a":"Intensity of sunlight at Ceres:\nI = P / (4πd²) = 3.8 × 10²⁶ / (4π × (4.4 × 10¹¹)²) = 156 W m⁻²\nAt equilibrium, power absorbed = power emitted. Ceres absorbs over its cross section πR² and radiates from its whole surface 4πR²:\nI × πR² = σT⁴ × 4πR²\nT⁴ = I / (4σ) = 156 / (4 × 5.67 × 10⁻⁸)\n**T = 160 K** (162 K)"},{"id":"bt-11.1","l":"(a)(ii)","m":2,"y":569,"w":901,"h":299,"a":"The energy is transferred by **conduction** through the solid rock and ice.\nAtoms in the hotter core vibrate with greater energy and pass energy to neighbouring atoms through collisions/interatomic forces, so energy flows from the hot centre to the cooler surface (where it is radiated away). Convection is not possible because the material is solid."},{"id":"bt-11.2","l":"(b)(i)","m":3,"y":868,"w":901,"h":389,"a":"- Same temperature, so the molecules in both phases have the same mean (random) kinetic energy.\n- In the solid the molecules vibrate about fixed positions in a regular lattice. In the gas they move freely and randomly with translational motion.\n- The intermolecular forces/bonds are strong in the solid and negligible in the gas, so the molecules are far apart in the gas and the gas has greater intermolecular potential energy."},{"id":"bt-11.3","l":"(b)(ii)","m":1,"y":1257,"w":901,"h":298,"a":"T = −38 + 273 = 235 K\nE_{K} = (3/2)kT = 1.5 × 1.38 × 10⁻²³ × 235\n**E_{K} = 4.9 × 10⁻²¹ J**"},{"id":"bt-11.4","l":"(b)(iii)","m":1,"y":1555,"w":901,"h":365,"a":"V = −GM / r = −(6.67 × 10⁻¹¹ × 9.0 × 10²⁰) / (4.7 × 10⁵)\nV = −1.3 × 10⁵ J kg⁻¹ ≈ **−10⁵ J kg⁻¹**"}]},{"id":"bt-13","t":"Question 8","s":"","W":901,"H":772,"p":[{"id":"bt-13.0","l":"(a)","m":2,"y":0,"w":901,"h":120,"a":"The two objects are at the same temperature, so there is no net transfer of thermal energy between them."},{"id":"bt-13.1","l":"(b)(i)","m":1,"y":120,"w":897,"h":309,"a":"**E₁ = XL**"},{"id":"bt-13.2","l":"(b)(ii)","m":1,"y":429,"w":859,"h":92,"a":"**E₂ = Mc(t − θ)**"},{"id":"bt-13.3","l":"(b)(iii)","m":1,"y":521,"w":864,"h":88,"a":"**E₃ = Xcθ**"},{"id":"bt-13.4","l":"(c)","m":2,"y":609,"w":896,"h":163,"a":"The beaker is insulated, so energy lost by the water = energy gained by the ice:\nE₂ = E₁ + E₃\nMc(t − θ) = XL + Xcθ\nMct − Mcθ = XL + Xcθ\nMct − XL = cθ(M + X)\n**θ = (Mct − XL) / c(M + X)**"}]},{"id":"bt-14","t":"Question 9","s":"","W":901,"H":1319,"p":[{"id":"bt-14.0","l":"(a)(i)","m":1,"y":0,"w":901,"h":175,"a":"Luminosity is the total power radiated by the star (total energy emitted per unit time)."},{"id":"bt-14.1","l":"(a)(ii)","m":3,"y":175,"w":858,"h":81,"a":"- A standard candle is an object of known luminosity L (for example a Cepheid variable or a type Ia supernova).\n- The apparent brightness b (radiant flux intensity) of a standard candle in the galaxy is measured at Earth.\n- The distance d is calculated from the inverse square law, b = L / (4πd²)."},{"id":"bt-14.2","l":"(b)(i)","m":3,"y":256,"w":896,"h":787,"a":"Y is at the centre of the disc and has no velocity along the line of sight, so 656.2831 nm is the unshifted wavelength. X is moving away, so its light is red shifted.\nΔλ = 656.2877 − 656.2831 = 0.0046 nm\nDoppler: Δλ / λ = v / c\nv = (0.0046 / 656.2831) × 3.00 × 10⁸ = 2.10 × 10³ m s⁻¹\nThis is the speed of a point on the equator: v = 2πR / T\nR = vT / 2π = (2.10 × 10³ × 2.07 × 10⁶) / 2π\n**R = 6.93 × 10⁸ m**"},{"id":"bt-14.3","l":"(b)(ii)","m":2,"y":1043,"w":858,"h":123,"a":"Z is moving towards the observer at the same speed that X is moving away. The observed wavelength is **shorter** than the emitted wavelength (blue shift), by the same amount, 0.0046 nm, giving about 656.2785 nm."},{"id":"bt-14.4","l":"(b)(iii)","m":2,"y":1166,"w":864,"h":153,"a":"L = 4πR²σT⁴\nT⁴ = L / (4πR²σ) = 3.8 × 10²⁶ / (4π × (6.93 × 10⁸)² × 5.67 × 10⁻⁸)\n**T = 5800 K**"}]},{"id":"bt-20","t":"Question 10","s":"","W":866,"H":1485,"p":[{"id":"bt-20.0","l":"(a)","m":2,"y":0,"w":866,"h":591,"a":"Any two of:\n- the electrical resistance of a metal wire or thermistor\n- the volume of a gas at constant pressure (or pressure of a gas at constant volume)\n- the e.m.f. of a thermocouple\n- the length of a solid (expansion)"},{"id":"bt-20.1","l":"(b)(i)","m":4,"y":591,"w":856,"h":392,"a":"Thermal energy lost by the water = thermal energy gained by the mercury. Let the final temperature be T.\n18.7 × 4.18 × (37.4 − T) = 6.94 × 0.140 × (T − 23.0)\n78.17 (37.4 − T) = 0.9716 (T − 23.0)\n2923.4 + 22.3 = 79.14 T\n**T = 37.2 °C**"},{"id":"bt-20.2","l":"(b)(ii)","m":1,"y":983,"w":818,"h":152,"a":"Use a smaller mass of mercury (a smaller bulb), so the thermometer has a lower heat capacity and absorbs less thermal energy from the water it is measuring."},{"id":"bt-20.3","l":"(c)(i)","m":2,"y":1135,"w":857,"h":198,"a":"The thermodynamic scale does not depend on the property of any particular substance. This thermometer relies on the expansion of mercury, which is a property of one substance (and need not vary exactly linearly with thermodynamic temperature), and it is calibrated in degrees Celsius between fixed points."},{"id":"bt-20.4","l":"(c)(ii)","m":1,"y":1333,"w":820,"h":152,"a":"An **ideal gas**."}]},{"id":"b4-1","t":"Question 11","s":"","W":818,"H":387,"p":[{"id":"b4-1.0","l":"","m":1,"y":0,"w":818,"h":387,"a":"**B**\nThe block is colder than the water in Q, so thermal energy flows from the water to the block until they reach thermal equilibrium. The water cools slightly as it gives up energy, so the final temperature of both is a little below 28 °C."}]},{"id":"b4-2","t":"Question 12","s":"","W":820,"H":269,"p":[{"id":"b4-2.0","l":"","m":1,"y":0,"w":820,"h":269,"a":"**B**\nHeat capacity = Q / Δθ = 12 600 / (60 − 30) = **420 J °C⁻¹**\n(This is the heat capacity of the 100 g sample, not the specific heat capacity.)"}]},{"id":"b4-3","t":"Question 13","s":"","W":826,"H":297,"p":[{"id":"b4-3.0","l":"","m":1,"y":0,"w":826,"h":297,"a":"**A**\nQ = mcΔθ\nc = Q / (mΔθ) = 12 000 × 10³ / (25 × (130 − 10)) = **4000 J kg⁻¹ °C⁻¹**"}]},{"id":"b4-4","t":"Question 14","s":"","W":781,"H":270,"p":[{"id":"b4-4.0","l":"","m":1,"y":0,"w":781,"h":270,"a":"**B**\nHeat capacity C = mc\nc = C / m = 1500 / 75 = **20 J kg⁻¹ K⁻¹**"}]},{"id":"b4-5","t":"Question 15","s":"","W":815,"H":390,"p":[{"id":"b4-5.0","l":"","m":1,"y":0,"w":815,"h":390,"a":"**B**\nQR and ST are changes of state (melting and boiling). The energy absorbed is latent heat: it does work breaking the bonds between the molecules, increasing their potential energy. The kinetic energy of the molecules, and so the temperature, does not change."}]},{"id":"b4-6","t":"Question 16","s":"","W":822,"H":366,"p":[{"id":"b4-6.0","l":"","m":1,"y":0,"w":822,"h":366,"a":"**C**\nThe water first cools to 0 °C while the ice melts (the flat section along the time axis). Once the ice has melted, the water warms until it is in thermal equilibrium with the room, so X is room temperature."}]},{"id":"b4-7","t":"Question 17","s":"","W":684,"H":245,"p":[{"id":"b4-7.0","l":"","m":1,"y":0,"w":684,"h":245,"a":"**B**\nLatent heat of fusion is used to break the bonds holding the particles in their fixed positions. The particles' average kinetic energy does not change, so the temperature stays constant."}]},{"id":"b4-8","t":"Question 18","s":"","W":804,"H":363,"p":[{"id":"b4-8.0","l":"","m":1,"y":0,"w":804,"h":363,"a":"**B**\nPt = mcΔθ\nt = mcΔθ / P = (3.5 × 900 × 80) / 800 = **315 s**"}]},{"id":"b4-12","t":"Question 19","s":"","W":900,"H":886,"p":[{"id":"b4-12.0","l":"(a)","m":3,"y":0,"w":900,"h":623,"a":"Mass of water m = ρV = 998 × 2750 = 2.74 × 10⁶ kg\nΔE = mcΔθ = 2.74 × 10⁶ × 4190 × (28.0 − 16.5)\n**ΔE = 1.32 × 10¹¹ J**"},{"id":"b4-12.1","l":"(b)","m":1,"y":623,"w":895,"h":263,"a":"Some energy is transferred to the surroundings (the air, the walls and floor of the pool, and through evaporation), so the heater must supply more energy than ΔE."}]},{"id":"b4-13","t":"Question 20","s":"","W":896,"H":1765,"p":[{"id":"b4-13.0","l":"(a)","m":3,"y":0,"w":896,"h":1058,"a":"Volume = 2.5 × 2.5 × 3.5 = 21.9 cm³ = 2.19 × 10⁻⁵ m³\nm = ρV = 1.00 × 10³ × 2.19 × 10⁻⁵\nm = 0.0219 kg ≈ **0.02 kg**"},{"id":"b4-13.1","l":"(b)","m":4,"y":1058,"w":893,"h":707,"a":"Total mass of water = 6 × 0.0219 = 0.131 kg\nEnergy to cool to 0 °C = mcΔθ = 0.131 × 4180 × 22.5 = 1.23 × 10⁴ J\nEnergy to freeze = mL = 0.131 × 3.34 × 10⁵ = 4.38 × 10⁴ J\nTotal energy removed = 5.6 × 10⁴ J\nTime = 12 × 60 = 720 s\nRate = 5.6 × 10⁴ / 720 = **78 W**\nThis is less than 110 W, so energy is **not** transferred from the water at 110 W. (The freezer also removes energy from the tray and the air.)"}]},{"id":"b4-15","t":"Question 21","s":"","W":901,"H":1089,"p":[{"id":"b4-15.0","l":"(a)","m":3,"y":0,"w":898,"h":545,"a":"E = mcΔθ = 0.165 × 4190 × (100.0 − 12.5) = 6.05 × 10⁴ J\nt = E / P = 6.05 × 10⁴ / 280\nt = 216 s ≈ **220 s**"},{"id":"b4-15.1","l":"(b)","m":3,"y":545,"w":901,"h":544,"a":"The heater supplies the same energy as in (a): 6.05 × 10⁴ J.\nEnergy to reach 87.7 °C = 0.165 × 4190 × (87.7 − 12.5) = 5.20 × 10⁴ J\nEnergy left to vaporise water = 6.05 × 10⁴ − 5.20 × 10⁴ = 8.5 × 10³ J\nm = E / L = 8.5 × 10³ / 2.29 × 10⁶\n**m = 3.7 × 10⁻³ kg** (3.7 g)"}]},{"id":"b4-17","t":"Question 22","s":"","W":898,"H":3169,"p":[{"id":"b4-17.0","l":"(a)(i)","m":2,"y":0,"w":897,"h":1217,"a":"s = ut + ½gt² with u = 0\nt = √(2s / g) = √(2 × 41.5 / 9.81)\nt = 2.9 s ≈ **3 s**"},{"id":"b4-17.1","l":"(a)(ii)","m":6,"y":1217,"w":898,"h":773,"a":"Volume of sphere = (4/3)πr³ = (4/3)π(1.2 × 10⁻³)³ = 7.24 × 10⁻⁹ m³\nMass = ρV = 1.13 × 10⁴ × 7.24 × 10⁻⁹ = 8.18 × 10⁻⁵ kg\nEnergy lost in cooling = mcΔθ = 8.18 × 10⁻⁵ × 130 × (615 − 370) = 2.60 J\nEnergy lost in solidifying = mL = 8.18 × 10⁻⁵ × 2.47 × 10⁴ = 2.02 J\nTotal energy transferred = 4.62 J\nMean rate = 4.62 / 2.91\n**= 1.6 W** (1.5 W if t = 3 s is used)"},{"id":"b4-17.2","l":"(b)(i)","m":2,"y":1990,"w":889,"h":893,"a":"Gravitational potential energy lost in N falls = Nmgd. This becomes internal energy of the lead: Nmgd = mcΔθ.\nThe mass m appears on both sides and cancels, so Δθ = Ngd / c, which does not depend on the mass."},{"id":"b4-17.3","l":"(b)(ii)","m":2,"y":2883,"w":893,"h":286,"a":"The method is unlikely to be accurate. Some energy is transferred to the tube, the
